  var h = document.documentElement, l = location;
  var seguro = l.protocol === 'https:' || l.hostname === 'localhost' || l.hostname === '127.0.0.1';
  if (!seguro || !('serviceWorker' in navigator)) { h.setAttribute('data-sw', 'indisponivel'); return; }
  h.setAttribute('data-sw', navigator.serviceWorker.controller ? 'ativo' : 'registrando');
  navigator.serviceWorker.register('sw.js', { scope: './' }).then(function () {
    if (!navigator.serviceWorker.controller) h.setAttribute('data-sw', 'instalado');
  }, function () { h.setAttribute('data-sw', 'erro'); });
  // Pede ao navegador para não apagar os dados do app por falta de espaço ou de uso.
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () { });
})();</script>

<!-- App só de água gelada (sessão AG1): o mesmo código do index.html, com o js/interface/modo_agua.js depois do nucleo.js.
     Plataforma comum (_plataforma-hvac): tokens, base, componentes e folha do memorial. O build embute tudo no HTML único. -->
<style>
/* ==== plataforma v0.4.1: css/base.css ==== */
/* Plataforma HVAC: tokens de tema, base e componentes comuns aos apps.
   Regra do guia: nenhum valor de cor fora dos blocos de tokens. Cor própria de um app entra no CSS do app. */
:root {
  --fundo: #f3f0e8; --sup: #fffdf8; --sup2: #f8f5ee; --linha: #ddd6c7; --linha-forte: #bfb6a3;
  --tinta: #1b2829; --tinta2: #4a5b5c; --tinta3: #768485;
  --prim: #0e5f59; --prim-tinta: #ffffff; --prim-suave: #d9e9e5;
  --norma-f: #e6ecd6; --norma-t: #42511c;
  --alt-f: #fbe7c2; --alt-t: #744600;
  --calc-f: #e8e4db; --calc-t: #4a5b5c;
  --demo-f: #e7e0f3; --demo-t: #4a3879;
  --erro: #b3261e; --alerta: #8a5200; --ok: #2c6b2f;
  --sombra: 0 1px 2px rgba(27, 40, 41, .06), 0 8px 24px rgba(27, 40, 41, .07);
  --raio: 12px; --fonte: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --fonte-titulo: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  /* Cores que valem igual nos dois temas: véu das janelas, variação da faixa e a folha do memorial (papel branco). */
  --veu: rgba(10, 16, 16, .45); --faixa-delta: rgba(127, 127, 127, .3);
  --folha-fundo: #fff; --folha-tinta: #1b1b1b; --folha-tinta2: #555; --folha-linha: #d5d5d5;
  color-scheme: light;
}
:root[data-tema="escuro"] {
  --fundo: #121819; --sup: #1a2223; --sup2: #212b2c; --linha: #2f3b3c; --linha-forte: #465758;
  --tinta: #e8eeec; --tinta2: #b4c1c0; --tinta3: #8b9a99;
  --prim: #5fc4b8; --prim-tinta: #0b1f1d; --prim-suave: #1e3936;
  --norma-f: #2c3520; --norma-t: #c9d8a2;
  --alt-f: #45330f; --alt-t: #f3cf8a;
  --calc-f: #2a3334; --calc-t: #b4c1c0;
  --demo-f: #2f2945; --demo-t: #cbbdf0;
  --erro: #ff8a80; --alerta: #f0b862; --ok: #8fd694;
  --sombra: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--fundo); color: var(--tinta); font: 15px/1.5 var(--fonte); padding-bottom: 76px; }
h1, h2, h3 { font-family: var(--fonte-titulo); line-height: 1.2; margin: 0; text-wrap: balance; }
h1 { font-size: 28px; font-weight: 650; letter-spacing: -.01em; }
h2 { font-size: 19px; font-weight: 650; }
h3 { font-size: 15px; font-weight: 650; }
p { margin: 0; }
a { color: var(--prim); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--prim); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
.suave { color: var(--tinta2); }
.fraco { color: var(--tinta3); font-size: 13px; }
.oculto { display: none !important; }

/* ---------- Topo e trilha ---------- */
.topo { position: sticky; top: 0; z-index: 20; background: var(--sup); border-bottom: 1px solid var(--linha); }
.topo-linha { max-width: 1040px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
.marca { display: flex; align-items: center; gap: 8px; font-family: var(--fonte-titulo); font-weight: 700; text-decoration: none; color: var(--tinta); white-space: nowrap; }
.marca svg { width: 26px; height: 26px; }
.marca small { font-weight: 500; color: var(--tinta3); font-size: 12px; }
.topo-acoes { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.icone { background: none; border: 1px solid transparent; border-radius: 8px; padding: 6px 10px; color: var(--tinta2); font-size: 13px; white-space: nowrap; }
.icone:hover { background: var(--sup2); border-color: var(--linha); }
.icone[aria-pressed="true"] { background: var(--prim-suave); color: var(--prim); border-color: transparent; font-weight: 600; }
kbd { font: 11px var(--fonte); border: 1px solid var(--linha-forte); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; color: var(--tinta2); background: var(--sup); }

.trilha { max-width: 1040px; margin: 0 auto; padding: 0 16px 10px; display: flex; gap: 4px; list-style: none; overflow-x: auto; }
.trilha li { flex: 1 1 0; min-width: 118px; }
.trilha a { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: var(--tinta2); border: 1px solid transparent; }
.trilha a:hover { background: var(--sup2); }
.trilha .n { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--linha-forte); display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.trilha .t { display: block; font-weight: 600; font-size: 14px; line-height: 1.2; white-space: nowrap; }
.trilha .s { display: block; font-size: 12px; color: var(--tinta3); white-space: nowrap; }
.trilha a[aria-current="page"] { background: var(--prim-suave); color: var(--tinta); }
.trilha a[aria-current="page"] .n { background: var(--prim); border-color: var(--prim); color: var(--prim-tinta); }
.trilha .pend .s { color: var(--alerta); }

/* ---------- Estrutura da tela ---------- */
main { max-width: 860px; margin: 0 auto; padding: 28px 16px 40px; }
main.larga { max-width: 1040px; }
.cabeca { margin-bottom: 20px; }
.cabeca .sobre { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--prim); margin-bottom: 6px; }
.cabeca p { color: var(--tinta2); margin-top: 6px; max-width: 62ch; }
.cartao { background: var(--sup); border: 1px solid var(--linha); border-radius: var(--raio); padding: 18px; margin-bottom: 14px; }
.cartao > h2 { margin-bottom: 12px; }
.grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px 18px; }
.grade.g2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.grade:not(.g2) > .campo { max-width: 300px; }
.acoes { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.botao { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--linha-forte); background: var(--sup); border-radius: 10px; padding: 8px 14px; font-weight: 600; text-decoration: none; color: var(--tinta); }
.botao:hover { border-color: var(--prim); }
.botao.prim { background: var(--prim); border-color: var(--prim); color: var(--prim-tinta); }
.botao.leve { border-color: transparent; background: none; color: var(--prim); padding: 6px 8px; }
.botao.perigo:hover { border-color: var(--erro); color: var(--erro); }
.aviso { border-left: 3px solid var(--demo-t); background: var(--demo-f); color: var(--demo-t); border-radius: 0 10px 10px 0; padding: 10px 14px; font-size: 14px; margin-bottom: 14px; }
.aprender { border-left: 3px solid var(--prim); background: var(--prim-suave); border-radius: 0 10px 10px 0; padding: 10px 14px; font-size: 14px; margin: 0 0 14px; }
.aprender b { color: var(--prim); }

/* ---------- Campo com estado ---------- */
.campo { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.campo label, .rotulo { font-size: 13px; font-weight: 600; color: var(--tinta2); }
.entrada { display: flex; align-items: stretch; border: 1px solid var(--linha-forte); border-radius: 10px; background: var(--sup); overflow: hidden; }
.entrada:focus-within { border-color: var(--prim); box-shadow: 0 0 0 3px var(--prim-suave); }
.entrada input, .entrada select { flex: 1; min-width: 0; border: 0; background: transparent; padding: 9px 11px; outline: none; font-size: 15px; }
.entrada input.num { text-align: right; font-weight: 600; }
.entrada .un { display: grid; place-items: center; padding: 0 10px; font-size: 13px; color: var(--tinta3); background: var(--sup2); border-left: 1px solid var(--linha); white-space: nowrap; }
.entrada.fixo { background: var(--sup2); border-style: dashed; }
.entrada.fixo input { color: var(--tinta2); }
.campo.invalido .entrada { border-color: var(--erro); }
.estado { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 22px; }
.selo { display: inline-flex; align-items: center; gap: 4px; border: 0; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.selo.norma { background: var(--norma-f); color: var(--norma-t); }
.selo.alterado { background: var(--alt-f); color: var(--alt-t); }
.selo.calc { background: var(--calc-f); color: var(--calc-t); }
.selo.demo { background: var(--demo-f); color: var(--demo-t); }
.selo.mantido { background: var(--prim-suave); color: var(--prim); }
button.selo:hover { filter: brightness(.95); text-decoration: underline; }
.voltar { border: 0; background: none; color: var(--tinta2); font-size: 12px; padding: 2px 4px; text-decoration: underline; }
.msg { font-size: 12.5px; color: var(--alerta); }
.campo.invalido .msg { color: var(--erro); }
.seg { display: inline-flex; border: 1px solid var(--linha-forte); border-radius: 10px; overflow: hidden; background: var(--sup); }
.seg button { border: 0; background: none; padding: 8px 12px; font-size: 14px; border-right: 1px solid var(--linha); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--prim); color: var(--prim-tinta); font-weight: 600; }
.valor-calc { display: inline-flex; align-items: baseline; gap: 6px; border: 1px dashed var(--linha-forte); background: var(--sup2); border-radius: 10px; padding: 8px 11px; font-weight: 650; color: var(--tinta); text-align: left; }
.valor-calc:hover { border-color: var(--prim); }
.valor-calc small { font-weight: 500; color: var(--tinta3); }

/* ---------- Bloco recolhível (frase-resumo) ---------- */
.bloco { background: var(--sup); border: 1px solid var(--linha); border-radius: var(--raio); margin-bottom: 10px; }
.bloco-cab { width: 100%; display: grid; grid-template-columns: 30px 1fr auto 18px; gap: 12px; align-items: center; padding: 14px 16px; background: none; border: 0; text-align: left; border-radius: var(--raio); }
.bloco-cab:hover { background: var(--sup2); }
.bloco-cab .n { width: 28px; height: 28px; border-radius: 50%; background: var(--prim-suave); color: var(--prim); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.bloco-cab .tit { font-weight: 650; font-size: 16px; display: block; }
.bloco-cab .frase { color: var(--tinta2); font-size: 14px; display: block; }
.bloco-cab .carga { text-align: right; font-weight: 650; white-space: nowrap; }
.bloco-cab .carga small { display: block; font-weight: 500; color: var(--tinta3); font-size: 12px; }
.bloco-cab .seta { color: var(--tinta3); transition: transform .15s; }
.bloco.aberto .bloco-cab .seta { transform: rotate(90deg); }
.bloco.aberto { border-color: var(--linha-forte); box-shadow: var(--sombra); }
.bloco-corpo { padding: 4px 16px 18px 58px; }
.sub { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--linha); }
.sub > h3 { margin-bottom: 10px; }
details.mais { margin-top: 16px; border-top: 1px solid var(--linha); padding-top: 12px; }
details.mais > summary { cursor: pointer; font-weight: 600; color: var(--prim); font-size: 14px; }
details.mais > .grade { margin-top: 12px; }

/* ---------- Lista de ambientes (linha: nome, indicadores e ações; o app pode trocar as colunas) ---------- */
.amb-item { display: grid; grid-template-columns: 1fr auto auto; gap: 16px; align-items: center; padding: 14px 16px; background: var(--sup); border: 1px solid var(--linha); border-radius: var(--raio); margin-bottom: 10px; }
.amb-item:hover { border-color: var(--prim); }
.amb-item a.nome { font-weight: 650; font-size: 16px; color: var(--tinta); text-decoration: none; }
.amb-item a.nome:hover { color: var(--prim); text-decoration: underline; }
.amb-item .kpi { text-align: right; }
.amb-item .kpi b { font-size: 18px; }

/* ---------- Tabelas ---------- */
.tabela-rolo { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--linha); text-align: left; vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--tinta3); font-weight: 700; white-space: nowrap; }
td.num, th.num { text-align: right; white-space: nowrap; }
tr.total td { font-weight: 700; border-top: 2px solid var(--linha-forte); }
tr.clicavel { cursor: pointer; }
tr.clicavel:hover td { background: var(--sup2); }
.x { border: 0; background: none; color: var(--tinta3); font-size: 18px; padding: 6px; border-radius: 6px; }
.x:hover { color: var(--erro); background: var(--sup2); }

/* ---------- Número em destaque, indicadores, barras, cartões e lista de pendências ---------- */
.heroi-res { display: grid; grid-template-columns: auto 1fr; gap: 28px; align-items: center; }
.numero { font-family: var(--fonte-titulo); font-size: 64px; font-weight: 700; line-height: 1; letter-spacing: -.02em; }
.numero small { font-size: 24px; font-weight: 600; color: var(--tinta2); letter-spacing: 0; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.kpi-c { border: 1px solid var(--linha); border-radius: 10px; padding: 10px 12px; background: var(--sup2); text-align: left; }
button.kpi-c:hover { border-color: var(--prim); }
.kpi-c span { display: block; font-size: 12px; color: var(--tinta3); font-weight: 600; }
.kpi-c b { font-size: 18px; }
.barras { display: grid; grid-template-columns: minmax(150px, 230px) 1fr 84px 52px; gap: 6px 12px; align-items: center; font-size: 14px; }
.barras .linha-b { display: contents; cursor: pointer; }
.barras .linha-b:hover .nome { color: var(--prim); text-decoration: underline; }
.barras .trilho { height: 14px; position: relative; }
.barras .barra { position: absolute; top: 0; bottom: 0; background: var(--prim); border-radius: 0 4px 4px 0; min-width: 2px; }
.barras .barra.neg { background: var(--tinta3); border-radius: 4px 0 0 4px; }
.barras .eixo { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--linha-forte); }
.barras .v, .barras .p { text-align: right; font-variant-numeric: tabular-nums; }
.barras .p { color: var(--tinta3); }
.pesos { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.peso { border: 1px solid var(--linha); border-radius: 10px; padding: 12px; }
.peso b { display: block; font-size: 22px; font-family: var(--fonte-titulo); }
.pend { list-style: none; padding: 0; margin: 0; }
.pend li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--linha); }
.pend li:last-child { border-bottom: 0; }

/* ---------- Faixa de resultado ---------- */
.faixa { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--tinta); color: var(--fundo); }
.faixa-linha { max-width: 1040px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
.faixa .item span { display: block; font-size: 11px; opacity: .7; text-transform: uppercase; letter-spacing: .05em; }
.faixa .item b { font-size: 18px; font-variant-numeric: tabular-nums; }
.faixa .delta { font-size: 13px; border-radius: 999px; padding: 3px 10px; background: var(--faixa-delta); }
.faixa a { margin-left: auto; color: inherit; font-weight: 600; text-decoration: none; border: 1px solid currentColor; border-radius: 10px; padding: 7px 12px; }

/* ---------- Gaveta, paleta e janela ---------- */
.veu { position: fixed; inset: 0; background: var(--veu); z-index: 40; }
.gaveta { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); background: var(--sup); z-index: 41; box-shadow: var(--sombra); display: flex; flex-direction: column; }
.gaveta header { padding: 18px 20px 12px; border-bottom: 1px solid var(--linha); display: flex; gap: 12px; align-items: flex-start; }
.gaveta header div { flex: 1; }
.gaveta .corpo { padding: 16px 20px 28px; overflow: auto; }
.gaveta .valor-g { font-family: var(--fonte-titulo); font-size: 30px; font-weight: 700; }
.passo { border: 1px solid var(--linha); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
.passo .q { font-weight: 650; display: flex; justify-content: space-between; gap: 12px; }
.passo .f { font-family: "Cascadia Mono", Consolas, monospace; font-size: 13px; color: var(--tinta2); margin-top: 2px; overflow-wrap: anywhere; }
.passo .fo { font-size: 12.5px; color: var(--tinta3); margin-top: 4px; }
.janela { position: fixed; top: 12vh; left: 50%; transform: translateX(-50%); width: min(640px, calc(100vw - 24px)); max-height: 76vh; overflow: auto; background: var(--sup); z-index: 41; border-radius: 14px; box-shadow: var(--sombra); padding: 16px; }
.janela h2 { margin-bottom: 10px; }
.paleta input { width: 100%; border: 1px solid var(--linha-forte); border-radius: 10px; padding: 10px 12px; background: var(--sup); font-size: 16px; }
.paleta ul { list-style: none; margin: 10px 0 0; padding: 0; }
.paleta li button { width: 100%; text-align: left; border: 0; background: none; padding: 9px 10px; border-radius: 8px; display: flex; justify-content: space-between; gap: 10px; }
.paleta li button.ativo, .paleta li button:hover { background: var(--prim-suave); }

@media (max-width: 760px) {
  h1 { font-size: 23px; }
  .trilha .s { display: none; }
  .trilha li { min-width: 0; }
  .trilha .t { font-size: 13px; }
  .topo-acoes .txt { display: none; }
  .bloco-corpo { padding-left: 16px; }
  .bloco-cab { grid-template-columns: 30px 1fr 18px; }
  .bloco-cab .carga { grid-column: 2; text-align: left; }
  .bloco-cab .carga small { display: inline; margin-left: 6px; }
  .heroi-res { grid-template-columns: 1fr; gap: 14px; }
  .numero { font-size: 48px; }
  .barras { display: block; }
  .barras .linha-b { display: grid; grid-template-columns: 1fr auto 44px; gap: 3px 10px; margin-bottom: 10px; }
  .barras .trilho { grid-column: 1 / -1; grid-row: 2; }
  .faixa-linha { gap: 14px; }
  .faixa .item.sec { display: none; }
  .amb-item { grid-template-columns: 1fr; }
  .amb-item .kpi { text-align: left; }
}

/* ---------- Celular (v0.4.0; especificação aprovada na sessão M0, itens C1 a C17) ----------
   Regra que muda elemento que já existe: só sob @media screen and (max-width: 760px). O "screen" é obrigatório: sem ele o
   navegador aplica a regra também na impressão e o PDF muda (achado da M0). A regra estreita acima (sem "screen") fica como está.
   Elemento novo (cel-*) nasce oculto aqui e só aparece em tela estreita: no computador não ocupa nenhum pixel. */
.cel-menu, .cel-passos, .cel-dica, .cel-cartoes, .cel-rolar { display: none; }
/* .so-celular: só em tela estreita (some no computador e no papel); .so-computador: some em tela estreita */
@media not screen and (max-width: 760px) { .so-celular { display: none !important; } }
/* Seletor de arquivo de projeto sobre um botão, invisível (input[type=file][data-arquivo-projeto] dentro de .arquivo-projeto):
   o seletor escondido com display:none e acionado por código falha em alguns celulares */
.arquivo-projeto { position: relative; overflow: hidden; cursor: pointer; }

<script>
/* ==== plataforma v0.4.1: js/util/formatacao.js ==== */
/* Formatação numérica (padrão brasileiro: vírgula decimal) e utilidades de texto. */
(function (H) {
  'use strict';

  function num(v, casas) {
    if (v === null || v === undefined || isNaN(v)) return '—';
    if (casas === undefined) casas = 2;
    var s = Math.abs(Number(v)).toFixed(casas);
    var partes = s.split('.');
    partes[0] = partes[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    var negativo = Number(v) < 0 && Number(s) !== 0;
    return (negativo ? '−' : '') + partes.join(',');
  }

  function numU(v, casas, unidade) {
    return num(v, casas) + (unidade ? ' ' + unidade : '');
  }

  // Valor para dentro de um <input>: sem separador de milhar, sem zeros à direita
  function campo(v, casas) {
    if (v === null || v === undefined || isNaN(v)) return '';
    var s = Number(v).toFixed(casas === undefined ? 2 : casas);
    if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
    return s.replace('.', ',');
  }

  // Lê número digitado com vírgula ou ponto decimal
  function ler(texto) {
    if (typeof texto === 'number') return texto;
    if (texto === null || texto === undefined) return NaN;
    var s = String(texto).trim().replace(/\s/g, '').replace('−', '-');
    if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.');
    return s === '' ? NaN : Number(s);
  }

  function esc(s) {
    return String(s === undefined || s === null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function pct(v, casas) { return num(v * 100, casas === undefined ? 0 : casas) + ' %'; }

  H.util.fmt = { num: num, numU: numU, campo: campo, ler: ler, esc: esc, pct: pct };
})(window.HVAC);

</script>

    clausulas: [
      { "referencia": "NBR 16401-1:2024, 12.1.2 (p. 32, PDF 42)", "texto": "A vazão de água do sistema depende do diferencial de temperatura requerido nos trocadores de calor. [...] Recomenda-se adotar o maior diferencial de temperatura condizente com uma seleção econômica de cada trocador, e não um diferencial arbitrário uniforme para toda a rede.", "uso_na_planilha": "A vazão de cada terminal pode ser informada diretamente (m³/h) — permite ΔT diferente por trocador. Quando se informa a carga (kW), usa-se o ΔT de projeto da aba Premissas." },
      { "referencia": "NBR 16401-1:2024, 12.1.3 (p. 32, PDF 42)", "texto": "Recomenda-se projetar o sistema para operar em vazão variável, adotando válvulas de controle de duas vias. Válvulas de controle de três vias podem ser usadas em sistemas de pequeno porte, com trocadores de calor situados próximos da central e com potência de bombeamento de até 3,75 kW.", "uso_na_planilha": "Premissas: tipo de vazão (variável/constante) — usado na verificação ASHRAE 90.1 e no fator de diversificação." },
      { "referencia": "NBR 16401-1:2024, 12.1.4, Tab. 3 e 4 (p. 32-33, PDF 42-43)", "texto": "Os limites de velocidade da água são determinados por considerações de custo das tubulações, ruído e erosão. As Tabelas 3 e 4 indicam alguns valores recomendados.", "uso_na_planilha": "Tab. 4 (erosão x horas/ano) limita a velocidade dos tubos > 50 mm. Tab. 3 é informativa." },
      { "referencia": "NBR 16401-1:2024, 12.2.1 (p. 33, PDF 43)", "texto": "Nos sistemas com controle em vazão de água variável, deve-se aplicar um fator de diversificação para os efeitos de dimensionamento da bomba e de alocação da vazão de água nos troncos e ramais principais da rede.", "uso_na_planilha": "Coluna \"Fator de diversificação\" da aba Trechos, aplicada à vazão somada dos ramais a jusante." },
      { "referencia": "NBR 16401-1:2024, 12.2.2 (p. 33, PDF 43)", "texto": "Deve-se proceder ao dimensionamento preliminar da tubulação, adotando-se um coeficiente de perda de carga por fricção no tubo reto e um limite para a velocidade da água.", "uso_na_planilha": "Critérios de Pa/m e de velocidade na aba Premissas; DN sugerido na aba Trechos." },
      { "referencia": "NBR 16401-1:2024, 12.2.4 (p. 33, PDF 43)", "texto": "Os dados publicados são geralmente válidos para os tubos novos de aço-carbono. Após anos de uso em circuito aberto, estes tubos apresentam rugosidade interna e perdas por fricção muito maiores, o que deve ser considerado no dimensionamento de redes abertas de água de condensação.", "uso_na_planilha": "Acréscimo por envelhecimento (%) na aba Premissas, aplicado à perda distribuída (ASHRAE 22.23: +15 a 20 % fechado; +75 a 90 % aberto). A norma restringe a recomendação a circuito aberto; o padrão de 15 % em circuito fechado vem da ASHRAE 22.23." },
      { "referencia": "NBR 16401-1:2024, 12.2.7 (p. 33, PDF 43)", "texto": "Uma relação da energia elétrica consumida no bombeamento para a energia térmica transportada de 0,04 kW/kW é desejável, porém, nem sempre viável, por resultar em custo excessivo da rede.", "uso_na_planilha": "Aba Bomba_Balanceamento calcula a relação kW elétrico de bombeamento / kW térmico." },
      { "referencia": "NBR 16401-1:2024, 12.2.8 (p. 33, PDF 43)", "texto": "Um critério frequentemente adotado [...] consiste em limitar a velocidade em 1,2 m/s para tubos com diâmetro de até 50 mm e a perda por fricção em 400 Pa/m para tubos maiores que 50 mm.", "uso_na_planilha": "Verificações automáticas de cada trecho (v e Pa/m) e cálculo do DN sugerido." },
      { "referencia": "NBR 16401-1:2024, 12.2.9 (p. 34, PDF 44)", "texto": "As perdas de carga da rede devem ser calculadas considerando as somas das perdas nas válvulas e as singularidades [...] e a perda nos trocadores de calor.", "uso_na_planilha": "Perdas localizadas pelo método K (aba Conexoes) e perdas em equipamentos (aba Equipamentos)." },
      { "referencia": "NBR 16401-1:2024, 12.2.10 (p. 34, PDF 44)", "texto": "Para tubulações que conduzem solução de água com anticongelante, os coeficientes de perda de carga e a potência de bombeamento devem ser corrigidos em função da viscosidade e da massa específica da solução.", "uso_na_planilha": "ρ, μ e cp da solução (etileno/propilenoglicol) interpolados da ASHRAE cap. 31 e usados em todo o cálculo." },
      { "referencia": "ASHRAE Fund. 2021, 22.22 (p. 22.22)", "texto": "One recommendation places a velocity limit of 1.2 m/s for 50 mm pipe and smaller, and a pressure drop limit of 400 Pa/m for piping over 50 mm. [...] Carrier (1960) recommends that the velocity not exceed 4.6 m/s in any case.", "uso_na_planilha": "Mesmo critério da NBR 12.2.8." },
      { "referencia": "ASHRAE Fund. 2021, 22.23 (p. 22.23)", "texto": "The HDR Design Guide (1981) increased the friction loss by 15 to 20% for closed piping systems and 75 to 90% for open systems.", "uso_na_planilha": "Valor padrão do acréscimo por envelhecimento: 15 % (circuito fechado)." },
      { "referencia": "ASHRAE Fund. 2021, cap. 22 Tab. 21 (p. 22.22)", "texto": "Piping System Design Maximum Flow Rate for Energy Conservation (base ASHRAE 90.1-2013 Tab. 6.5.4.5).", "uso_na_planilha": "Verificação informativa de eficiência energética (aço 65–300 mm e acima), conforme horas/ano e tipo de vazão." }

/* ==== js/dados/tabelas.js ==== */
/* Redes HVAC. Tabelas da água gelada: converte o texto de tabelas_brutas.js (gerado dos CSV pelo build)
   em números e índices. Sem DOM. Comparação de texto sem diferenciar maiúsculas, como na planilha v1.0.1. */
(function (H) {
  'use strict';
  var B = H.dados.bruto || {};

  function num(s) {
    if (s === null || s === undefined) { return null; }
    s = String(s).trim();
    if (s === '') { return null; }
    var v = parseFloat(s);
    return isFinite(v) ? v : null;
  }
  // chave de busca: partes unidas por "|", em minúsculas
  function chave() { return Array.prototype.join.call(arguments, '|').toLowerCase(); }
  function mapa() { return Object.create(null); }

  // --- tubos e especificações ---
  var tubos = [], tubosEsp = mapa(), tuboChave = mapa();
  (B.tubos || []).forEach(function (l) {
    var de = num(l.DE_mm), e = num(l.e_mm);
    var t = { esp: l.especificacao, fam: l.familia, dn: l.DN, dnmm: num(l.DN_mm), de: de, e: e, di: de - 2 * e, fonte: l.fonte };
    tubos.push(t);
    var ke = chave(t.esp);
    (tubosEsp[ke] = tubosEsp[ke] || []).push(t);
    var kc = chave(t.esp, t.dn);
    if (!tuboChave[kc]) { tuboChave[kc] = t; }
  });
  var especs = [], especChave = mapa();
  (B.especificacoes || []).forEach(function (l) {
    var e = { nome: l.especificacao, fam: l.familia, eps: num(l.eps_mm), fonteEps: l.fonte_eps, uso: l.uso };
    especs.push(e);
    if (!especChave[chave(e.nome)]) { especChave[chave(e.nome)] = e; }
  });

  // --- fluidos (blocos por fluido|concentração, na ordem do arquivo) ---
  var fluidos = mapa(), listaFluidos = [];
  (B.fluidos || []).forEach(function (l) {
    var k = chave(l.fluido, String(num(l.conc_vol_pct)));
    if (!fluidos[k]) { fluidos[k] = []; listaFluidos.push({ fluido: l.fluido, conc: num(l.conc_vol_pct) }); }
    fluidos[k].push({ t: num(l.T_C), rho: num(l.rho_kg_m3), cp: num(l.cp_kJ_kgK), mu: num(l.mu_mPa_s), fonte: l.fonte });
  });
  var congelamento = mapa();
  (B.congelamento || []).forEach(function (l) {
    congelamento[chave(l.fluido, String(num(l.conc_vol_pct)))] = { tcong: num(l.T_congelamento_C), concMassa: num(l.conc_massa_pct), fonte: l.fonte };
  });

  var unioes = mapa();
  (B.unioes || []).forEach(function (l) { var k = chave(l.familia); (unioes[k] = unioes[k] || []).push(l.uniao); });

    var it = { fam: l.familia, uniao: l.uniao, item: l.item, metodo: l.metodo, param: l.param, fonte: l.fonte };
    itens.push(it);
    var k = chave(it.fam, it.uniao, it.item);
    if (!itemChave[k]) { itemChave[k] = it; }
  });

  // --- Tabelas 3 e 4 do cap. 22 (K por DN): tabela[DN mm][parâmetro] = número ou null ---
  function tabelaDN(linhas) {
    var m = mapa(), dns = [];
    (linhas || []).forEach(function (l) {
      var dn = num(l.DN_mm), o = mapa();

    return { valor: m, dns: dns };

/* Redes HVAC. Catálogo de campos do projeto (especificação A0, seções 2.1 e 3; dutos de ar: ESPECIFICACAO_R1, seção 2, e

   A ordem das chaves de cada grupo é a ordem em que elas são gravadas no arquivo de projeto.
   t: 'txt' | 'num' | 'op' (lista fechada) | 'bool'. p: padrão. nulo: aceita vazio (null). min e max: limites inclusivos;
   pos: tem de ser maior que zero. pct: guardado em fração e mostrado em %. livre: aceita número negativo (temperaturas).

<script>
/* ==== js/motor/fluido.js ==== */
/* Redes HVAC. Motor, peça Fluido: propriedades na temperatura de cálculo, por interpolação em fluidos.csv.
   Mesma conta da planilha v1.0.1 (aba Premissas): ρ e cp lineares, μ log-linear, sem extrapolar. Sem DOM. */
(function (H) {
  'use strict';
  var M = H.motor = H.motor || {};
  var NOMES = { agua: 'Água', etilenoglicol: 'Etilenoglicol', propilenoglicol: 'Propilenoglicol' };

  function num(v) {
    if (typeof v === 'number') { return isFinite(v) ? v : null; }
    if (v === null || v === undefined || v === '') { return null; }
    var x = parseFloat(String(v).replace(',', '.'));
    return isFinite(x) ? x : null;
  }
  function texto(n) { return String(n).replace('.', ','); }

  M.fluido = {
    G: 9.80665,   // m/s², gravidade padrão (a mesma da planilha)
    nome: function (tipo) { return NOMES[tipo] || String(tipo || ''); },

    // f: { tipo, concentracao, tAlim, tRet, baseT ('alimentacao' | 'media' | 'manual'), tManual }
    propriedades: function (f, tab) {
      f = f || {};
      tab = tab || H.dados.tab;
      var nome = this.nome(f.tipo), agua = nome === 'Água';
      var conc = agua ? 0 : (num(f.concentracao) || 0);
      var tAlim = num(f.tAlim) || 0, tRet = num(f.tRet) || 0;
      var tcalc = f.baseT === 'manual' ? (num(f.tManual) || 0) : (f.baseT === 'media' ? (tAlim + tRet) / 2 : tAlim);
      var r = {
        ok: false, erro: '', nome: nome, concentracao: conc, chave: nome + '|' + conc,
        tAlim: tAlim, tRet: tRet, dT: tRet - tAlim, tCalc: tcalc,
        tMin: null, tMax: null, t1: null, t2: null, w: null,
        rho: null, cp: null, mu: null, nu: null, tCong: null, margemCong: null, fonte: ''
      };
      var cg = agua ? { tcong: 0 } : tab.congelamento[tab.chave(nome, String(conc))];
      if (cg) { r.tCong = cg.tcong; r.margemCong = tAlim - cg.tcong; }
      var bloco = tab.fluidos[tab.chave(nome, String(conc))];
      if (!bloco || !bloco.length) { r.erro = 'ERRO: fluido/concentração sem dados'; return r; }
      var n = bloco.length;
      r.tMin = bloco[0].t; r.tMax = bloco[n - 1].t;
      if (tcalc < r.tMin || tcalc > r.tMax) {
        r.erro = 'ERRO: T fora da faixa tabelada (' + texto(r.tMin) + ' a ' + texto(r.tMax) + ' °C)';
        return r;
      }
      var i = 0, k;
      for (k = 0; k < n; k++) { if (bloco[k].t <= tcalc) { i = k; } }   // maior T tabelada que não passa de T
      var a = bloco[i], b = bloco[Math.min(i + 1, n - 1)];
      var w = b.t === a.t ? 0 : (tcalc - a.t) / (b.t - a.t);
      r.t1 = a.t; r.t2 = b.t; r.w = w;
      r.rho = a.rho + w * (b.rho - a.rho);                                             // kg/m³
      r.cp = a.cp + w * (b.cp - a.cp);                                                 // kJ/(kg·°C)
      r.mu = Math.exp(Math.log(a.mu) + w * (Math.log(b.mu) - Math.log(a.mu))) / 1000;  // Pa·s
      r.nu = r.mu / r.rho;                                                             // m²/s
      r.fonte = a.fonte;
      r.ok = true;
      return r;
    }
  };
})(window.HVAC);

</script>
<script>
/* ==== js/motor/conduto.js ==== */
/* Redes HVAC. Motor, peça Conduto: área, diâmetro de cálculo e rugosidade.
   Na v0.1.0 só o conduto circular (especificação e DN, de tubos.csv e especificacoes.csv). Sem DOM. */

  'use strict';
  var M = H.motor = H.motor || {};

    // área de um círculo de diâmetro em mm, em m²

    circular: function (esp, dn, epsManual, tab) {

      var di = t ? t.di : null;

        eps: (epsManual !== null && epsManual !== undefined) ? epsManual : (e ? e.eps : null),   // mm
        area: di === null ? null : this.area(di),                      // m²

<script>
/* ==== js/motor/atrito.js ==== */
/* Redes HVAC. Motor, peça Atrito: fator de atrito de Darcy.
   Colebrook em x = 1/√f, com partida de Swamee-Jain e três passos de Newton (os mesmos da planilha v1.0.1);
   laminar (Re < 2 000): f = 64/Re; transição de 2 000 a 10 000, já com Colebrook (D24: ASHRAE Fundamentals 2021 SI,
   cap. 3, p. 3.7). Sem DOM. */
(function (H) {
  'use strict';
  var M = H.motor = H.motor || {};
  var log10 = Math.log10 || function (x) { return Math.log(x) / Math.LN10; };

  function newton(x, re, rr) {
    var a = rr / 3.7 + 2.51 * x / re;
    return x - (x + 2 * log10(a)) / (1 + 2 * 2.51 / re / (a * Math.LN10));
  }

  M.atrito = {
    RE_LAMINAR: 2000,
    RE_TURBULENTO: 10000,
    RESIDUO_MAX: 1e-6,

    regime: function (re) { return re < this.RE_LAMINAR ? 'laminar' : (re < this.RE_TURBULENTO ? 'transição' : 'turbulento'); },

    // f de Swamee-Jain (usado só na partida e na busca do menor DN)
    swameeJain: function (re, rr) { return 0.25 / Math.pow(log10(rr / 3.7 + 5.74 / Math.pow(re, 0.9)), 2); },

    // re: Reynolds; rr: rugosidade relativa ε/D. Devolve null se não há como calcular.
    colebrook: function (re, rr) {
      if (!(re > 0) || typeof rr !== 'number' || !isFinite(rr)) { return null; }
      var x0 = -2 * log10(rr / 3.7 + 5.74 / Math.pow(re, 0.9));
      var x1 = newton(x0, re, rr), x2 = newton(x1, re, rr), x3 = newton(x2, re, rr);
      var res = Math.abs(x3 + 2 * log10(rr / 3.7 + 2.51 * x3 / re));
      var f = re < this.RE_LAMINAR ? 64 / re : 1 / (x3 * x3);
      if (!isFinite(f)) { return null; }
      return { x0: x0, x1: x1, x2: x2, x3: x3, residuo: res, f: f, regime: this.regime(re) };
    }
  };
})(window.HVAC);

</script>
<script>
/* ==== js/motor/tabela_k.js ==== */
/* Redes HVAC. Motor: tabela de K das conexões, uma linha por item e DN da família.
   Mesmas regras do aba_acessorios.ps1 (linhas 82 a 108) da planilha v1.0.1, mais o método T4T3 (diferença D2).
   A tabela de fT entra como parâmetro: o app usa a do Crane TP-410M de 2009 (diferença D12). Sem DOM. */
(function (H) {
  'use strict';
  var M = H.motor = H.motor || {};
  var padrao = null;

  // fT pelo maior DN tabelado que não passa do DN (mm); ft = pares [DN, fT] em ordem
  function fT(ft, mm) {
    var v = null, i;
    for (i = 0; i < ft.length; i++) { if (ft[i][0] <= mm) { v = ft[i][1]; } }
    return v;
  }

  // DN da família: rótulos distintos de tubos.csv (o 1º dá o DN em mm), por ordem de mm
  function dnDaFamilia(tab) {
    var m = Object.create(null), ordem = [];
    tab.tubos.forEach(function (t) {
      var k = tab.chave(t.fam);
      if (!m[k]) { m[k] = []; ordem.push(k); }
      if (!m[k].some(function (d) { return d.dn === t.dn; })) { m[k].push({ dn: t.dn, mm: t.dnmm }); }
    });
    ordem.forEach(function (k) { m[k].sort(function (a, b) { return a.mm - b.mm; }); });
    return m;
  }

  // Tabela 4 (solda e flange): de 25 a 300 mm; DN não tabelado usa o imediatamente menor; acima de 300 usa 300
  function tabela4(tab, mm, param, fonte) {
    if (mm < 25) { return null; }
    var ref = mm, f = fonte, i;
    if (mm > 300) {
      ref = 300; f = fonte + ' — valor de 300 mm adotado (conservador)';
    } else if (!tab.t4.valor[mm]) {
      ref = null;
      for (i = 0; i < tab.t4.dns.length; i++) { if (tab.t4.dns[i] < mm) { ref = tab.t4.dns[i]; } }
      f = fonte + ' — DN ' + mm + ' mm não tabelado: valor de ' + ref + ' mm adotado (conservador)';
    }
    var linha = ref === null ? null : tab.t4.valor[ref];
    var v = linha ? linha[param] : null;
    return { k: (v === null || v === undefined) ? null : v, fonte: f };
  }

  M.tabelaK = {
    fT: fT,
    chave: function (fam, uniao, item, dn) { return [fam, uniao, item, dn].join('|').toLowerCase(); },

    // ft: pares [DN mm, fT]; sem ft, usa a tabela do app (Crane TP-410M, 2009)
    montar: function (tab, ft) {
      tab = tab || H.dados.tab;
      ft = ft || tab.craneFt;
      var dnFam = dnDaFamilia(tab), linhas = [], porChave = Object.create(null), me = this;
      tab.itens.forEach(function (x) {
        if (x.metodo === 'RED' || x.metodo === 'AMP') { return; }
        (dnFam[tab.chave(x.fam)] || []).forEach(function (d) {
          var mm = d.mm, k = null, fonte = x.fonte, met = x.metodo, r, n, linha;
          if (x.metodo === 'T3') {
            linha = tab.t3.valor[mm];
            if (linha && linha[x.param] !== null && linha[x.param] !== undefined) { k = linha[x.param]; }
          } else if (x.metodo === 'T4') {
            r = tabela4(tab, mm, x.param, x.fonte);
            if (r) {
              fonte = r.fonte;
              if (r.k !== null) {
                k = r.k;
              } else if (x.param === 'gaveta') {
                // Q6 (T3b): o Crane de 2009 da biblioteca confirma o multiplicador
                k = 8 * fT(ft, mm); met = 'CRANE';
                fonte = 'Crane TP-410M (2009), p. A-28 (PDF 122): K = 8·fT (fora da faixa da ASHRAE Tab. 4)';
              }
            }
          } else if (x.metodo === 'T4T3') {
            // D2: Tabela 4 pelo DN equivalente; abaixo de 25 mm, onde ela não tem valor, Tabela 3
            if (mm < 25) {
              linha = tab.t3.valor[mm];
              if (linha && linha[x.param] !== null && linha[x.param] !== undefined) { k = linha[x.param]; met = 'T3'; }
            } else {
              r = tabela4(tab, mm, x.param, x.fonte);
              if (r && r.k !== null) { k = r.k; fonte = r.fonte; met = 'T4'; }
            }
          } else if (x.metodo === 'CRANE') {
            if (mm >= 15) { k = parseFloat(x.param) * fT(ft, mm); }
          } else if (x.metodo === 'CRANE_BORB') {
            if (mm >= 15) {
              n = 45; if (mm > 200) { n = 35; } if (mm > 350) { n = 25; }
              k = n * fT(ft, mm); met = 'CRANE (n = ' + n + ')';
              // Q7 (T3b): o Crane tabela a borboleta a partir de 50 mm
              if (mm < 50) { fonte = x.fonte + ' — abaixo de 50 mm o Crane não tabela a borboleta: n = 45 adotado - CONFERIR'; }
            }
          } else if (x.metodo === 'FIXO') {
            k = parseFloat(x.param);
          } else if (x.metodo === 'PVC_COT') {
            k = 0.87; if (mm <= 150) { k = 0.91; } if (mm <= 50) { k = 1.00; }
            if (mm < 50) { fonte = x.fonte + ' — valor de 50 mm (menor DN ensaiado) adotado - CONFERIR'; }
            // Q14 (T3b): o ensaio da Tab. 8 vai até 200 mm
            if (mm > 200) { fonte = x.fonte + ' — acima de 200 mm, valor de 200 mm extrapolado (premissa)'; }
          }
          if (k === null || !isFinite(k)) { return; }
          var l = { chave: me.chave(x.fam, x.uniao, x.item, d.dn), fam: x.fam, uniao: x.uniao, item: x.item, dn: d.dn, dnmm: mm, metodo: met, k: k, fonte: fonte };
          linhas.push(l);
          if (!porChave[l.chave]) { porChave[l.chave] = l; }
        });
      });
      return { linhas: linhas, porChave: porChave, ft: ft };
    },

    // tabela do app, montada uma vez
    padrao: function (tab) {
      if (tab && tab !== H.dados.tab) { return this.montar(tab); }
      if (!padrao) { padrao = this.montar(H.dados.tab); }
      return padrao;
    }
  };
})(window.HVAC);

</script>
<script>
/* ==== js/motor/rede.js ==== */
/* Redes HVAC. Motor, peça Rede: árvore com um montante por trecho. Serve à água gelada e, depois, aos dutos de ar.
   Estrutura (ID repetido, montante que não existe, ciclo), vazão das folhas para a raiz e acumulado da raiz para
   as folhas. O ID é comparado sem diferenciar maiúsculas; o montante aponta para a 1ª linha com aquele ID (como a
   planilha v1.0.1). Linha sem ID não entra em nada. Sem DOM e sem recursão (não há limite de trechos). */
(function (H) {
  'use strict';
  var M = H.motor = H.motor || {};

  function chave(id) { return (id === null || id === undefined) ? '' : String(id).toLowerCase(); }
  function numero(v) { return typeof v === 'number' && isFinite(v); }

  M.rede = {
    chave: chave,
    RAIZ: -1,          // pai: sai da bomba (ou do ventilador)
    INEXISTENTE: -2,   // pai: montante informado não existe
    SEM_ID: -3,        // linha sem ID

    // linhas: [{ id, montante }]
    estrutura: function (linhas) {
      var n = linhas.length, i, k, m;
      var e = {
        n: n, chave: [], chaveMon: [], primeira: Object.create(null), linhasDe: Object.create(null),
        pai: [], filhos: Object.create(null), terminal: [], repetido: [], proprio: [], laco: []
      };
      for (i = 0; i < n; i++) {
        k = chave(linhas[i].id);
        e.chave.push(k);
        e.chaveMon.push(k === '' ? '' : chave(linhas[i].montante));
        if (k !== '') {
          if (e.primeira[k] === undefined) { e.primeira[k] = i; e.linhasDe[k] = []; }
          e.linhasDe[k].push(i);
        }
      }
      for (i = 0; i < n; i++) {
        k = e.chave[i]; m = e.chaveMon[i];
        if (k === '') { e.pai.push(this.SEM_ID); continue; }
        e.pai.push(m === '' ? this.RAIZ : (e.primeira[m] !== undefined ? e.primeira[m] : this.INEXISTENTE));
        if (m !== '') { (e.filhos[m] = e.filhos[m] || []).push(i); }
      }
      for (i = 0; i < n; i++) {
        k = e.chave[i];
        e.terminal.push(k !== '' && !(e.filhos[k] && e.filhos[k].length));
        e.repetido.push(k !== '' && e.linhasDe[k].length > 1);
        e.proprio.push(k !== '' && e.chaveMon[i] === k);
      }
      // laço: '' (o caminho até a bomba existe, ou acaba num montante que não existe), 'ciclo' (o trecho faz
      // parte de um ciclo) ou 'descende' (o montante leva a um ciclo)
      var estado = [], marca = [], pos = [], j, caminho, fim, c;
      for (i = 0; i < n; i++) { estado.push(e.chave[i] === '' ? '' : null); marca.push(-1); pos.push(0); }
      for (i = 0; i < n; i++) {
        if (estado[i] !== null) { continue; }
        caminho = []; j = i; fim = null;
        while (true) {
          if (j < 0) { fim = ''; break; }
          if (estado[j] !== null) { fim = estado[j] === '' ? '' : 'descende'; break; }
          if (marca[j] === i) {
            for (c = 0; c < caminho.length; c++) { estado[caminho[c]] = c >= pos[j] ? 'ciclo' : 'descende'; }
            break;
          }
          marca[j] = i; pos[j] = caminho.length; caminho.push(j); j = e.pai[j];
        }
        if (fim !== null) { for (c = 0; c < caminho.length; c++) { estado[caminho[c]] = fim; } }
      }
      e.laco = estado;
      return e;
    },

    // Vazão por trecho. direta[i]: número (vazão própria), null (própria, mas sem valor) ou undefined (soma dos
    // ramais × fator[i]). Devolve null onde a soma depende de um ciclo ou de um ramal sem valor.
    vazoes: function (e, direta, fator) {
      var n = e.n, q = [], dep = [], fila = [], i, c, m, pais, p, a, s, ok, f;
      for (i = 0; i < n; i++) {
        q.push(null); dep.push(0);
        if (e.chave[i] === '') { continue; }
        if (direta[i] !== undefined) {
          q[i] = numero(direta[i]) ? direta[i] : null; fila.push(i);
        } else {
          dep[i] = (e.filhos[e.chave[i]] || []).length;
          if (dep[i] === 0) { q[i] = 0; fila.push(i); }
        }
      }
      for (c = 0; c < fila.length; c++) {
        m = e.chaveMon[fila[c]];
        if (m === '' || !e.linhasDe[m]) { continue; }
        pais = e.linhasDe[m];
        for (a = 0; a < pais.length; a++) {
          p = pais[a];
          if (direta[p] !== undefined) { continue; }
          dep[p]--;
          if (dep[p] === 0) {
            s = 0; ok = true; f = e.filhos[m];
            for (i = 0; i < f.length; i++) { if (q[f[i]] === null) { ok = false; } else { s += q[f[i]]; } }
            q[p] = ok && numero(s * fator[p]) ? s * fator[p] : null;
            fila.push(p);
          }
        }
      }
      return q;
    },

    // Acumulado da raiz para as folhas: valor[i] + acumulado do montante (montante que não existe soma zero).
    // null onde não há caminho até a raiz (ciclo) ou o valor do trecho é null.
    acumulado: function (e, valor) {
      var n = e.n, acu = [], feito = [], i, j, pilha, base, k;
      for (i = 0; i < n; i++) { acu.push(null); feito.push(e.chave[i] === '' || e.laco[i] !== ''); }
      for (i = 0; i < n; i++) {
        if (feito[i]) { continue; }
        pilha = []; j = i;
        while (j >= 0 && !feito[j]) { pilha.push(j); j = e.pai[j]; }
        base = (j >= 0 && numero(acu[j])) ? acu[j] : 0;
        while (pilha.length) {
          k = pilha.pop();
          acu[k] = numero(valor[k]) ? valor[k] + base : null;
          feito[k] = true;
          base = numero(acu[k]) ? acu[k] : 0;
        }
      }
      return acu;
    },

    // Índices do trecho i até a raiz (o próprio i primeiro)
    caminho: function (e, i) {
      var c = [], j = i;
      while (j >= 0 && c.length <= e.n) { c.push(j); j = e.pai[j]; }
      return c;
    }
  };
})(window.HVAC);

</script>
<script>
/* ==== js/motor/criterios.js ==== */
/* Redes HVAC. Motor, peça Critérios (água gelada): limites, verificações, menor DN que atende e avisos.
   Regras da planilha v1.0.1 (NBR 16401-1:2024, 12.2.8 (1,2 m/s e 400 Pa/m) e 12.1.4 com a Tabela 4 (erosão); ASHRAE 90.1 informativo) e os dois avisos novos
   da especificação A0 (seção 2.5), que não mudam a situação. Sem DOM. */
(function (H) {
  'use strict';
  var M = H.motor = H.motor || {};
  var log10 = Math.log10 || function (x) { return Math.log(x) / Math.LN10; };

  function numero(v) { return typeof v === 'number' && isFinite(v); }
  function texto(n) { return String(n).replace('.', ','); }
  // a planilha compara "<" & número, e o número vira texto com 15 algarismos
  function quinze(x) { return Number(x.toPrecision(15)); }

  M.criterios = {
    // DN (mm) que separa os dois critérios de arraste de ar: ASHRAE Fundamentals 2021 (SI), cap. 22, p. 22.28, PDF 664
    DN_ARRASTE: 50,
    TEXTO_VEL_BAIXA: 'velocidade baixa: o ar pode não ser arrastado até o separador',
    TEXTO_VEL_BAIXA_PERDA: 'velocidade baixa: o ar pode não ser arrastado até o separador (perda abaixo de {pa} Pa/m; o Handbook imprime 75 Pa; unidade por metro a CONFERIR)',

    // NBR 16401-1:2024, Tabela 4: linha de horas imediatamente superior (ou a exata); fora da tabela, a 1ª ou a última
    vMaxErosao: function (horas, tab) {
      var e = (tab || H.dados.tab).erosao, n = e.length, i, k = -1;
      if (!n) { return null; }
      if (horas <= e[0][0]) { return e[0][1]; }
      if (horas > e[n - 1][0]) { return e[n - 1][1]; }
      for (i = 0; i < n; i++) { if (e[i][0] <= horas) { k = i; } }
      return e[k][0] === horas ? e[k][1] : e[k + 1][1];
    },

    // coluna da Tabela 21 do cap. 22 (base ASHRAE 90.1): 1 a 6 = (até 2 000 h | até 4 400 h | acima) × (outro | variável)
    coluna901: function (horas, controle) {
      return (horas <= 2000 ? 1 : (horas <= 4400 ? 3 : 5)) + (controle === 'variavel' ? 1 : 0);
    },

    // velocidade da ASHRAE 90.1 (m/s) ou "n.a." (só aço, DN 65 ou maior)
    v901: function (familia, dnmm, coluna, tab) {
      var a = (tab || H.dados.tab).ashrae901, i;
      if (familia !== 'Aço' || dnmm < 65 || !a.length) { return 'n.a.'; }
      if (dnmm > 300) { return a[a.length - 1].v[coluna - 1]; }
      for (i = 0; i < a.length; i++) { if (a[i].dnmm === dnmm) { return a[i].v[coluna - 1]; } }
      return 'n.a.';
    },

    // t: { dnmm, v, paM, familia }; p: premissas (dnLimite, vMaxPequeno, vMaxErosao, paMax, paMin, col901)
    verificar: function (t, p, tab) {
      var r = { vMax: null, sitV: '', sitPerda: '', v901: '', sit901: '' };
      if (!numero(t.dnmm)) { return r; }
      r.vMax = t.dnmm <= p.dnLimite ? p.vMaxPequeno : p.vMaxErosao;
      if (numero(t.v)) { r.sitV = t.v > r.vMax ? 'ACIMA do limite' : 'OK'; }
      if (numero(t.paM)) {
        r.sitPerda = t.dnmm <= p.dnLimite ? 'n.a. (DN ≤ ' + texto(p.dnLimite) + ' mm)'
          : (t.paM > p.paMax ? 'ACIMA de ' + texto(p.paMax) + ' Pa/m' : (t.paM < p.paMin ? 'abaixo da faixa usual' : 'OK'));
      }
      r.v901 = this.v901(t.familia, t.dnmm, p.col901, tab);
      r.sit901 = r.v901 === 'n.a.' ? 'n.a.' : (numero(t.v) ? (t.v > r.v901 ? 'acima (energia)' : 'OK') : '');
      return r;
    },

    // Menor DN da especificação que atende. q em m³/h, eps em mm. Três iterações do Di pela perda, com f de
    // Swamee-Jain e 2 % de folga sobre o Pa/m máximo; escolha pela regra do DN limite.
    menorDN: function (q, eps, esp, p, tab) {
      tab = tab || H.dados.tab;
      var tubos = tab.tubosDaEsp(esp), r = { dVelErosao: null, dVelPequeno: null, d1: null, d2: null, d3: null, k1: null, k2: null, k3: null, kf: null, dn: '' };
      if (!(q > 0) || !tubos.length) { return r; }
      var qs = q / 3600;
      function dPerda(d) {
        var re = 4 * qs / (Math.PI * d / 1000 * p.nu);
        var f = 0.25 / Math.pow(log10(eps / (3.7 * d) + 5.74 / Math.pow(re, 0.9)), 2);
        return Math.pow(f * 8 * p.rho * qs * qs / (Math.PI * Math.PI * p.paMax * 0.98), 0.2) * 1000;
      }
      r.dVelErosao = 1000 * Math.sqrt(4 * qs / (Math.PI * p.vMaxErosao));
      r.dVelPequeno = 1000 * Math.sqrt(4 * qs / (Math.PI * p.vMaxPequeno));
      if (!numero(eps) || !numero(p.nu) || !numero(p.rho)) { return r; }   // sem fluido ou sem ε, só os diâmetros pela velocidade
      r.d1 = dPerda(r.dVelErosao); r.d2 = dPerda(r.d1); r.d3 = dPerda(r.d2);
      if (!numero(r.dVelErosao) || !numero(r.dVelPequeno) || !numero(r.d3)) { return r; }
      var lim1 = quinze(Math.max(r.dVelErosao, r.d3)), lim2 = quinze(r.dVelPequeno), k1 = 0, k2 = 0, k3 = 0;
      tubos.forEach(function (t) {
        if (t.di < lim1) { k1++; }
        if (t.di < lim2) { k2++; }
        if (t.dnmm <= p.dnLimite) { k3++; }
      });
      r.k1 = k1; r.k2 = k2; r.k3 = k3;
      r.kf = k2 < k3 ? k2 : Math.max(k1, k3);
      r.dn = r.kf >= tubos.length ? 'acima do maior DN' : tubos[r.kf].dn;
      return r;
    },

    // Aviso de velocidade baixa (arraste de ar): até 50 mm, v abaixo de vMin; acima, perda abaixo de paMinArraste
    velocidadeBaixa: function (t, p) {
      if (!numero(t.dnmm) || !numero(t.v) || !numero(t.paM)) { return ''; }
      if (t.dnmm <= this.DN_ARRASTE) { return t.v < p.vMin ? this.TEXTO_VEL_BAIXA : ''; }
      return t.paM < p.paMinArraste ? this.TEXTO_VEL_BAIXA_PERDA.replace('{pa}', texto(p.paMinArraste)) : '';
    },

    // Aviso de autoridade da válvula de controle (ΔP da válvula ÷ (ΔP do trecho terminal + excesso), D23)
    textoAutoridade: function (a, p) {
      if (!numero(a) || !(a < p.autoridadeMin)) { return ''; }
      // valor truncado em duas casas, para 0,299 não aparecer como "0,30" num aviso de autoridade abaixo de 0,30
      return 'autoridade baixa (' + (Math.floor(a * 100 + 1e-9) / 100).toFixed(2).replace('.', ',') + '): a válvula perde controle; faixa indicada de ' +
        p.autoridadeMin.toFixed(2).replace('.', ',') + ' a 0,50';
    }
  };
})(window.HVAC);

</script>
<script>
/* ==== js/motor/agua.js ==== */
/* Redes HVAC. Motor da água gelada: recebe o projeto e devolve os resultados (especificação A0, seção 2).
   Reproduz a planilha Dimensionamento_Agua_Gelada v1.0.1 (abas Premissas, Trechos, Conexoes, Equipamentos e Bomba),
   com as diferenças declaradas na seção 6 da especificação. Unidades: Q em m³/h, comprimentos em m, diâmetros e
   rugosidade em mm, ΔP em kPa, perda por metro em Pa/m, temperatura em °C. Sem DOM. */
(function (H) {
  'use strict';
  var M = H.motor = H.motor || {};

  // Padrões do projeto (especificação A0, seção 2.1)
  var PADROES = {
    sistema: { circuito: 'fechado', controle: 'variavel', horasAno: 3000 },
    fluido: { tipo: 'agua', concentracao: 0, tAlim: 7, tRet: 12, baseT: 'alimentacao', tManual: null },
    criterios: { dnLimite: 50, vMaxPequeno: 1.2, paMax: 400, paMin: 100, envelhecimento: 0.15, vMin: 0.6, paMinArraste: 75, autoridadeMin: 0.30 },
    // qNominal, hDisp e tolVazaoBomba: bomba existente (sessão AG1); vazios, nada é comparado
    bomba: { margem: 0, rendBomba: 0.70, rendMotor: 0.92, qNominal: null, hDisp: null, tolVazaoBomba: 0.05 }
  };
  var LIMITE_REL = 0.04;   // kW/kW, NBR 16401-1:2024, 12.2.7
  var MU_LIMITE_BOMBA = 1.1;   // mPa·s, S&E 2016 (SI), cap. 13, p. 13.24 (PDF 282): abaixo disso o efeito na bomba pode ser ignorado

  function num(v) {
    if (typeof v === 'number') { return isFinite(v) ? v : null; }
    if (v === null || v === undefined || v === '') { return null; }
    var x = parseFloat(String(v).replace(',', '.'));
    return isFinite(x) ? x : null;
  }
  function numero(v) { return typeof v === 'number' && isFinite(v); }
  function ou(v, padrao) { var x = num(v); return x === null ? padrao : x; }
  function txt(v) { return (v === null || v === undefined) ? '' : String(v); }
  function fixo(n, casas) { return n.toFixed(casas).replace('.', ','); }

  // --- premissas: fluido, limites e parâmetros da bomba ---
  function premissas(P, tab) {
    var s = P.sistema || {}, c = P.criterios || {}, b = P.bomba || {}, pc = PADROES.criterios, pb = PADROES.bomba;
    var fl = M.fluido.propriedades(P.fluido || PADROES.fluido, tab);
    var horas = ou(s.horasAno, PADROES.sistema.horasAno);
    var circuito = s.circuito === 'aberto' ? 'aberto' : 'fechado';
    var controle = s.controle === 'constante' ? 'constante' : 'variavel';
    var env = ou(c.envelhecimento, pc.envelhecimento);
    return {
      ok: fl.ok, erro: fl.erro, fluido: fl,
      rho: fl.rho, cp: fl.cp, mu: fl.mu, nu: fl.nu, dT: fl.dT, g: M.fluido.G,
      circuito: circuito, controle: controle, horas: horas,
      dnLimite: ou(c.dnLimite, pc.dnLimite), vMaxPequeno: ou(c.vMaxPequeno, pc.vMaxPequeno),
      paMax: ou(c.paMax, pc.paMax), paMin: ou(c.paMin, pc.paMin), env: env,
      vMin: ou(c.vMin, pc.vMin), paMinArraste: ou(c.paMinArraste, pc.paMinArraste), autoridadeMin: ou(c.autoridadeMin, pc.autoridadeMin),
      vMaxErosao: M.criterios.vMaxErosao(horas, tab), col901: M.criterios.coluna901(horas, controle),
      margem: ou(b.margem, pb.margem), rendBomba: ou(b.rendBomba, pb.rendBomba), rendMotor: ou(b.rendMotor, pb.rendMotor),
      qNominal: num(b.qNominal), hDisp: num(b.hDisp), tolVazaoBomba: ou(b.tolVazaoBomba, pb.tolVazaoBomba),
      // ASHRAE Fundamentals 2021 (SI), cap. 22, p. 22.23 (PDF 659): circuito aberto pede de 75 a 90 %
      sitEnvelhecimento: (circuito === 'aberto' && env < 0.75) ? 'ATENÇÃO: circuito aberto — ASHRAE 22.23 indica +75 a 90 %' : 'OK'
    };
  }

  // --- K de uma redução ou de uma ampliação entre o tubo do trecho e o do outro lado: o K do lado de referência (kRed) e o
  //     mesmo K levado à velocidade do trecho (kUnit) ---
  function kReducao(metodo, uniao, diTrecho, diOutro, dnmmTrecho, dnmmOutro, tab) {
    var o = { chave: '', kRed: null, refMaior: false, fonte: '', kUnit: null };
    var maior = Math.max(diTrecho, diOutro), menor = Math.min(diTrecho, diOutro), beta = menor / maior;
    o.chave = (metodo === 'RED' ? 'Redução (contração)' : 'Ampliação (expansão)') + '|' + uniao + '|' + Math.max(dnmmTrecho, dnmmOutro) + '|' + Math.min(dnmmTrecho, dnmmOutro);
    var tabelado = tab.reducoes[o.chave.toLowerCase()];
    if (tabelado) {
      o.kRed = tabelado.k;
      // D30 (R4, no lugar da D20): o K tabelado é referido à velocidade de montante da peça: na redução, a do lado maior; na
      // ampliação, a do lado menor. Base: a nota c da Tabela 6 cita Ding et al. (2005), o relatório final da ASHRAE RP-1116,
      // que define o K pela velocidade de montante (Eq. 3.1) e traz na Tabela 4.3 os mesmos valores de 150 × 100, 200 × 150 e
      // 250 × 200. Nas demais reduções vale por analogia, e a linha do CSV segue com CONFERIR.
      // D31 (R5): o K do CSV é o maior das três colunas de velocidade da tabela (1,2, 2,4 e 3,6 m/s)
      o.refMaior = metodo === 'RED';
      o.fonte = metodo !== 'RED' ? 'ASHRAE Fund. 2021 cap. 22 Tab. 6 (Rahmeyer 2003a), o maior K das colunas de 1,2, 2,4 e 3,6 m/s, convertido para a velocidade do trecho'
        : 'ASHRAE Fund. 2021 cap. 22 Tab. 6 (Rahmeyer 2003a), o maior K das colunas de 1,2, 2,4 e 3,6 m/s, K referido à velocidade de montante (lado maior), convertido para a velocidade do trecho' +
          (/CONFERIR/.test(tabelado.fonte) ? '. CONFERIR a velocidade de referência: a tabela não diz; adotada a de montante, por analogia com as reduções de 150, 200 e 250 mm (ASHRAE RP-1116)'
            : ' (nota c da tabela: Ding et al., 2005, relatório final da ASHRAE RP-1116, que define o K pela velocidade de montante, Eq. 3.1, e traz os mesmos valores na Tabela 4.3)');
    } else {
      var b2 = beta * beta;
      o.kRed = metodo === 'RED' ? 0.5 * (1 - b2) : (1 - b2) * (1 - b2);
      o.fonte = 'Fórmula de ' + (metodo === 'RED' ? 'contração brusca K = 0,5(1−β²) (Crane TP-410)' : 'expansão brusca K = (1−β²)² (Borda-Carnot)') +
        ', β = ' + fixo(beta, 3) + ', convertida para a velocidade do trecho';
    }
    // K do lado de referência (o menor; na redução tabelada, o maior: D30), na velocidade do trecho
    o.kUnit = o.kRed * Math.pow(diTrecho / (o.refMaior ? maior : menor), 4);
    return o;
  }

  // --- Q1 (T3b): tê de derivação com redução (β = Di do ramal ÷ Di do tronco < 1), Crane TP-410M (2009), p. 2-15 (PDF 37).
  //     Ida (dividindo): Eq. 2-37, K = G[1 + H(q/β²)² − J(q/β²)cos α], α = 90° (o termo de J some); H = 1 (Tab. 2-3, β ≤ 2/3;
  //     entre 2/3 e 1 a tabela não dá constante: H = 1, premissa a favor da segurança); G pela Tab. 2-4, lida pela continuidade
  //     das retas. Volta (convergindo): Eq. 2-35, K = C[1 + D(q/β²)² − E(1 − q)² − F(1/β²)q²], D = 1, E = 2, F = 0 (Tab. 2-1,
  //     90°), C pela Tab. 2-2; K ≥ 0 (piso). Os dois K são referidos ao tronco combinado: × (β²/q)² leva à velocidade do ramal.
  //     t: o trecho do ramal; m: o montante (tronco combinado). Sem montante, β = 1 ou q fora de (0, 1]: null (fica a tabela)
  function teCrane(t, m) {
    if (!t || !m || !numero(t.q) || !numero(m.q) || !numero(t.di) || !numero(m.di)) { return null; }
    if (!(t.q > 0 && m.q > 0 && t.di < m.di)) { return null; }
    var q = t.q / m.q;
    if (q > 1) { return null; }
    var beta = t.di / m.di, b2 = beta * beta, x = q / b2, conv = 1 / (x * x), H = 1;
    var G = b2 <= 0.35 ? (q <= 0.4 ? 1.1 - 0.7 * q : 0.85) : (q <= 0.6 ? 1.0 - 0.6 * q : 0.6);

        // (ASHRAE S&E 2016, cap. 47, p. 47.8, PDF 804). Premissa: todo o excesso é dissipado no próprio terminal
        t.dpRamal = t.dpTrecho + (numero(t.excesso) ? t.excesso : 0);
        t.autoridade = valv[k] / t.dpRamal;
        t.dpValvula = valv[k];
        var ta = M.criterios.textoAutoridade(t.autoridade, pr);
        if (ta !== '') { t.avisos.push({ tipo: 'autoridade', texto: ta }); }
      }
      if (estIgn[k]) { t.avisos.push({ tipo: 'estaticaIgnorada', texto: M.agua.TEXTO_ESTATICA_IGNORADA }); }
      cont.avisos += t.avisos.length;
    }

    // 7) bomba
    var bq = 0, nRaiz = 0;
    for (i = 0; i < n; i++) {
      if (est.pai[i] === M.rede.RAIZ) { nRaiz++; if (numero(T[i].q)) { bq += T[i].q; } }
    }
    var B = {
      q: bq, nRaiz: nRaiz, qt: null, terminalCritico: crit >= 0 ? T[crit].id : '—', indiceCritico: crit,
      dpCritico: dpCrit, margem: pr.margem, dpProjeto: dpCrit * (1 + pr.margem),
      h: null, pHid: null, pEixo: null, pEl: null, relacao: null, sitRelacao: ''
    };
    B.pHid = bq / 3600 * B.dpProjeto;                                          // kW (m³/s × kPa)
    if (pr.ok) {
      B.qt = bq / 3600 * pr.rho * pr.cp * pr.dT;                               // kW
      B.h = B.dpProjeto * 1000 / (pr.rho * pr.g);                              // m de coluna do fluido
    }
    if (pr.rendBomba > 0) { B.pEixo = B.pHid / pr.rendBomba; }
    if (B.pEixo !== null && pr.rendMotor > 0) { B.pEl = B.pEixo / pr.rendMotor; }
    if (B.qt > 0 && B.pEl !== null) {
      B.relacao = B.pEl / B.qt;
      B.sitRelacao = B.relacao <= LIMITE_REL ? 'OK (≤ 0,04 kW/kW)' : 'acima do desejável (0,04 kW/kW) — avaliar otimização';
    }
    B.existente = existente(B, pr);

    // 8) caminho crítico (do terminal até a bomba) e balanceamento por terminal
    var caminho = [], terminais = [];
    if (crit >= 0) {
      M.rede.caminho(est, crit).forEach(function (j, p) {
        var x = T[j];
        caminho.push({ passo: p + 1, id: x.id, circuito: x.circuito, descricao: x.descricao, especificacao: x.especificacao, dn: x.dn, q: x.q, v: x.v, dpTrecho: x.dpTrecho, dpAcum: x.dpAcum });
      });
    }
    for (i = 0; i < n; i++) {
      t = T[i];
      if (!t.terminal) { continue; }
      var exc = t.excesso, pct = (exc !== null && dpCrit !== 0) ? exc / dpCrit : null;
      terminais.push({
        n: terminais.length + 1, id: t.id, circuito: t.circuito, descricao: t.descricao, q: t.q, dpAcum: t.dpAcum,
        excesso: exc, excessoM: (exc !== null && pr.ok) ? exc * 1000 / (pr.rho * pr.g) : null, fracao: pct, autoridade: t.autoridade,
        obs: exc === null ? '' : (exc < 0.005 ? 'circuito crítico (válvula totalmente aberta)'
          : (pct > 0.5 ? 'excesso > 50 % do crítico: avaliar redução de DN do ramal ou válvula independente de pressão'
            : 'dissipar na válvula de balanceamento'))
      });
    }
    return { premissas: pr, trechos: T, conexoes: CX, equipamentos: EQ, bomba: B, caminho: caminho, terminais: terminais, contagem: cont, estrutura: est };
  }

  /* Bomba existente (sessão AG1, especificação AG9 a AG14): vazão nominal e altura na vazão nominal, do catálogo.
     Vazão: diferença relativa da vazão da rede (a da bomba, sem margem) para a nominal; aviso acima da tolerância (5 %,
     premissa do app: a NBR 16401-1:2024 não dá número para a água; a 17.6.2 manda o projeto especificar o critério).
     Altura: folga = disponível − altura de projeto (crítico × (1 + margem)); a folga sem a margem vai ao lado.
     Sem correção pela massa específica: na mesma rotação a altura em metros de coluna não depende de ρ (a pressão sim,
     ΔP = ρ · g · H). Sem correção pela viscosidade do glicol (premissa; o catálogo é em água). Comparação no ponto nominal,
     sem a curva. null sem nenhum dos dois dados; sem fluido válido, sem altura */
  function existente(B, pr) {
    if (pr.qNominal === null && pr.hDisp === null) { return null; }
    var X = {
      q: pr.qNominal !== null && pr.qNominal > 0 ? pr.qNominal : null, h: pr.hDisp, tol: pr.tolVazaoBomba, margem: pr.margem,
      qRede: B.q, difVazao: null, hProjeto: B.h, hCritico: null, folga: null, folgaSemMargem: null, pDisp: null,
      glicol: pr.ok && pr.fluido.nome !== 'Água' && pr.fluido.concentracao > 0, nu: pr.ok ? pr.nu : null,   // nu em m²/s
      muMPas: pr.ok ? pr.mu * 1000 : null, viscoso: false, avisos: []
    };
    // nota da viscosidade (premissa, sem correção): o catálogo vale em água de 15 a 25 °C e o efeito pode ser ignorado abaixo
    // de 1,1 mPa·s (ASHRAE HVAC Systems and Equipment 2016 (SI), cap. 13, p. 13.24, PDF 282; Fig. 43)
    X.viscoso = X.muMPas !== null && X.muMPas > MU_LIMITE_BOMBA;
    if (X.q !== null) { X.difVazao = (B.q - X.q) / X.q; }
    if (X.h !== null && pr.ok) {
      X.hCritico = B.dpCritico * 1000 / (pr.rho * pr.g);
      X.folga = X.h - X.hProjeto;
      X.folgaSemMargem = X.h - X.hCritico;
      X.pDisp = X.h * pr.rho * pr.g / 1000;                                    // kPa no fluido da rede
    }
    // texto da vazão condicionado à folga de altura (item 1 da revisão da AG1, aprovado pelo Francisco): com a curva da bomba
    // descendente, só há "sobra" garantida quando também sobra altura; sem a altura, o ponto de operação pede a curva
    X.vazaoFora = X.difVazao !== null && Math.abs(X.difVazao) > X.tol;
    if (X.vazaoFora) {
      var comAltura = X.folga !== null, sobraH = comAltura && X.folga >= 0, fim;
      if (X.difVazao > 0) {
        fim = !comAltura ? 'a bomba não entrega a vazão da rede no ponto nominal; conferir na curva da bomba ou rever as vazões'
          : (sobraH ? 'a bomba não entrega a vazão da rede no ponto nominal; com a sobra de altura, pode atender trabalhando à direita do ponto nominal: conferir na curva da bomba'
            : 'a bomba não entrega nem a vazão nem a altura da rede no ponto nominal; rever a rede ou a bomba');
      } else {
        fim = !comAltura ? 'sobra vazão no ponto nominal; sem a altura da bomba, o ponto de operação só se define com a curva da bomba'
          : (sobraH ? 'sobra vazão e altura: a bomba tende a trabalhar à direita do ponto nominal; ajustar com o inversor, a válvula de balanceamento ou o rotor, ou rever as vazões'
            : 'a vazão nominal passa da vazão da rede, mas a altura não basta: o ponto de operação só se define com a curva da bomba');
      }
      X.avisos.push({
        tipo: 'vazaoBomba', texto: 'A vazão da rede (' + fixo(B.q, 2) + ' m³/h) é ' + fixo(100 * Math.abs(X.difVazao), 1) + ' % '
          + (X.difVazao > 0 ? 'maior' : 'menor') + ' que a nominal da bomba existente (' + fixo(X.q, 2) + ' m³/h): ' + fim
          + ' (tolerância de ' + fixo(100 * X.tol, 1) + ' %, premissa do app).'
      });
    }
    if (X.folga !== null && X.folga < 0) {
      X.avisos.push({
        tipo: 'alturaBomba', texto: (X.margem > 0 && X.folgaSemMargem >= 0)
          ? 'A bomba existente (' + fixo(X.h, 2) + ' m na vazão nominal) cobre o circuito crítico (' + fixo(X.hCritico, 2) + ' m), mas não a margem de ' + fixo(100 * X.margem, 1)
            + ' %: faltam ' + fixo(-X.folga, 2) + ' m para a altura de projeto (' + fixo(X.hProjeto, 2) + ' m); rever a margem, a rede ou a bomba.'
          : 'A altura exigida pela rede (' + fixo(X.hProjeto, 2) + ' m' + (X.margem > 0 ? ', com a margem de ' + fixo(100 * X.margem, 1) + ' %' : '') + ') supera em ' + fixo(-X.folga, 2)
            + ' m a altura da bomba existente (' + fixo(X.h, 2) + ' m na vazão nominal): a bomba não cobre ' + (X.margem > 0 ? 'nem ' : '') + 'o circuito crítico (' + fixo(X.hCritico, 2) + ' m); rever a rede ou a bomba.'
      });
    }
    return X;
  }

  // Sensibilidade de DN de um trecho: todos os DN da especificação, com a vazão, o ε e o comprimento do trecho
  function sensibilidade(R, id, opc) {
    var tab = (opc && opc.tab) || H.dados.tab, pr = R.premissas, i = R.estrutura.primeira[M.rede.chave(id)];
    if (i === undefined || !pr.ok) { return null; }
    var t = R.trechos[i], L = (t.L === null ? 0 : t.L) * (t.idaVolta === null ? 1 : t.idaVolta);
    var r = { id: t.id, q: t.q, especificacao: t.especificacao, dn: t.dn, eps: t.eps, comprimento: L, linhas: [] };
    if (!numero(t.q) || !numero(t.eps)) { return r; }
    tab.tubosDaEsp(t.especificacao).forEach(function (tb, j) {
      var v = t.q / 3600 / M.conduto.area(tb.di), re = v * tb.di / 1000 / pr.nu, rr = t.eps / tb.di;
      var at = M.atrito.colebrook(re, rr), paM = at ? at.f / (tb.di / 1000) * pr.rho * v * v / 2 : null;
      var vMax = tb.dnmm <= pr.dnLimite ? pr.vMaxPequeno : pr.vMaxErosao;
      r.linhas.push({
        n: j + 1, dn: tb.dn, dnmm: tb.dnmm, di: tb.di, v: v, re: re, rr: rr, atrito: at, f: at ? at.f : null, paM: paM,
        dpDist: paM === null ? null : paM * (1 + pr.env) * L / 1000,
        vMax: vMax, sitV: v > vMax ? 'ACIMA' : 'OK',
        sitPerda: paM === null ? '' : (tb.dnmm <= pr.dnLimite ? 'n.a.' : (paM > pr.paMax ? 'ACIMA' : (paM < pr.paMin ? 'abaixo da faixa' : 'OK'))),
        atual: tb.dn === t.dn
      });
    });
    return r;
  }

  // Projeto novo, com os padrões "em uso"
  function projetoPadrao() {
    var p = JSON.parse(JSON.stringify(PADROES));
    p.nome = ''; p.revisao = 'R00'; p.cliente = ''; p.local = 'Brasília - DF'; p.responsavel = ''; p.registro = ''; p.data = '';
    p.agua = { trechos: [], conexoes: [], equipamentos: [] };
    return p;
  }

  M.agua = { PADROES: PADROES, LIMITE_REL: LIMITE_REL, MU_LIMITE_BOMBA: MU_LIMITE_BOMBA,
    TEXTO_ESTATICA_IGNORADA: 'altura estática ignorada: em circuito fechado ela não entra na altura da bomba',
    premissas: premissas, calcular: calcular, sensibilidade: sensibilidade, projetoPadrao: projetoPadrao };
})(window.HVAC);

</script>
<script>
/* ==== js/motor/formato.js ==== */
/* Redes HVAC. Arquivo de projeto, formato 2 ("hvac-redes"; especificação A0, seção 3; dutos de ar e unidades:
   ESPECIFICACAO_R1, seção 6, e ESPECIFICACAO_telas_dutos, seção 6). Sem DOM.
   Formato 2 (v0.2.0) = formato 1 + "unidades" (cadastro), "ar" (premissas, método, critérios e redes de dutos) e o campo
   "unidade" no trecho da água. O formato 1 abre sem perda: ganha as três coisas vazias ou com os padrões, com uma linha
   "convertido" no relatório; o app salva sempre no formato 2.
   abrir(obj) nunca lança erro: confere o envelope, refaz o projeto campo a campo pelo catálogo (dados\campos.js) e devolve
   { ok, projeto, relatorio, versaoOrigem, motivo }. Campo ausente ou inválido adota o padrão e escreve uma linha no relatório.
   O projeto devolvido tem sempre as mesmas chaves, na mesma ordem: salvar e reabrir devolve o mesmo bloco "projeto".
   O bloco "resultados" é gravado ao salvar (resultados) e ignorado ao abrir. */
(function (H) {
  'use strict';
  var M = H.motor = H.motor || {};
  var FORMATO = 'hvac-redes', VERSAO = 2, CAT = H.dados.campos;
  var ENVELOPE = ['formato', 'versaoFormato', 'versaoApp', 'versaoPlataforma', 'projeto', 'resultados'];
  var NOME_LISTA = { trechos: 'Trecho', conexoes: 'Conexão', equipamentos: 'Equipamento' };
  var NOME_GRUPO_AR = { premissas: 'Ar dos dutos', metodo: 'Método dos dutos', criterios: 'Critérios dos dutos' };
  var NOME_LISTA_AR = { trechos: 'Trecho de ar', singularidades: 'Singularidade', componentes: 'Componente' };
  // critérios dos dutos que entraram depois do formato 2 (v0.5.0): ausentes no arquivo, adotam o padrão sem linha no relatório
  var CALADOS_AR = ['tolVazaoEquip', 'rhoCat'];
  // bomba existente (sessão AG1, v0.6.0): idem
  var CALADOS_BOMBA = ['qNominal', 'hDisp', 'tolVazaoBomba'];

  function objeto(v) { return !!v && typeof v === 'object' && !Array.isArray(v); }
  function tem(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }
  function mostra(v) {
    if (v === undefined) { return '(ausente)'; }
    if (v === null || v === '') { return '(vazio)'; }
    if (typeof v === 'string') { return v; }
    if (typeof v === 'number') { return String(v).replace('.', ','); }
    if (typeof v === 'boolean') { return v ? 'sim' : 'não'; }
    var s; try { s = JSON.stringify(v); } catch (e) { s = String(v); }
    return s.length > 60 ? s.substring(0, 57) + '...' : s;
  }
  function nao(motivo) { return { ok: false, projeto: null, relatorio: [], versaoOrigem: 0, motivo: motivo }; }

  // Número escrito como texto ("1,2" ou "1.2"); devolve null quando não é número
  function numeroDeTexto(s) {
    s = String(s).trim().replace(/\s/g, '');
    if (s.indexOf(',') >= 0) { s = s.replace(/\./g, '').replace(',', '.'); }
    if (s === '' || !/^[+-]?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$/.test(s)) { return null; }
    var v = Number(s);
    return isFinite(v) ? v : null;
  }

  /* Lê um campo pelo catálogo. Devolve o valor adotado e escreve a linha do relatório quando ele difere do arquivo.
     Nível: "info" quando o campo faltava e o padrão é vazio; "convertido" quando só o tipo mudou; "substituido" nos demais. */
  function ler(def, bruto, onde, rel) {
    var vazioPadrao = def.p === null || def.p === '' || def.p === false;
    function linha(nivel, adotado, motivo) {
      rel.push({ onde: onde, campo: def.rotulo, nivel: nivel, valorArquivo: mostra(bruto), valorAdotado: mostra(adotado), motivo: motivo });
      return adotado;
    }
    if (bruto === undefined) { return linha(vazioPadrao ? 'info' : 'substituido', def.p, 'Campo ausente no arquivo: adotado o padrão.'); }
    if (def.t === 'txt') {
      if (typeof bruto === 'string') {
        if (def.apara && bruto !== bruto.trim()) { return linha('convertido', bruto.trim(), 'Espaços retirados das pontas.'); }
        return bruto;
      }
      if (bruto === null) { return linha('info', def.p, 'Campo vazio: adotado o padrão.'); }
      if (typeof bruto === 'number' && isFinite(bruto)) { return linha('convertido', String(bruto), 'Número lido como texto.'); }
      return linha('substituido', def.p, 'Valor que não é texto: adotado o padrão.');
    }
    if (def.t === 'bool') {
      if (typeof bruto === 'boolean') { return bruto; }
      return linha('substituido', def.p, 'Valor que não é sim ou não: adotado o padrão.');
    }
    if (def.t === 'op') {
      if (def.ops.some(function (o) { return o.v === bruto; })) { return bruto; }
      return linha('substituido', def.p, 'Opção que não existe: adotado o padrão.');
    }
    // número
    if (bruto === null || bruto === '') {
      if (def.nulo) { return null; }
      return linha('substituido', def.p, 'Campo vazio: adotado o padrão.');
    }
    var v = bruto, convertido = false;
    if (typeof bruto === 'string') { v = numeroDeTexto(bruto); convertido = v !== null; }
    if (typeof v !== 'number' || !isFinite(v)) { return linha('substituido', def.p, 'Valor que não é número: adotado o padrão.'); }
    var erro = CAT.erro(def, v);
    if (erro) { return linha('substituido', def.p, 'Valor fora do limite (' + erro.replace(/\.$/, '') + '): adotado o padrão.'); }
    if (convertido) { return linha('convertido', v, 'Texto lido como número.'); }
    return v;
  }

  // Um grupo de campos (objeto do arquivo → objeto novo, com as chaves do catálogo, na ordem do catálogo).
  // opc.calados: chaves que, ausentes, adotam o padrão sem linha (conversão do formato 1); opc.listas: chaves que são listas, lidas à parte
  function grupo(defs, bruto, onde, rel, opc) {
    var o = {}, k, origem = objeto(bruto) ? bruto : {}, calados = (opc && opc.calados) || [], listas = (opc && opc.listas) || [];
    for (k in defs) {
      if (!tem(defs, k)) { continue; }
      o[k] = (origem[k] === undefined && calados.indexOf(k) >= 0) ? defs[k].p : ler(defs[k], origem[k], onde, rel);
    }
    for (k in origem) {
      if (tem(origem, k) && !tem(defs, k) && listas.indexOf(k) < 0) {
        rel.push({ onde: onde, campo: k, nivel: 'info', valorArquivo: mostra(origem[k]), valorAdotado: '(ignorado)', motivo: 'Chave que este app não conhece: ignorada.' });
      }
    }
    return o;
  }

  // Uma lista de linhas (unidades; trechos, singularidades e componentes de uma rede de ar)
  function lista(defs, origem, rot, chaveId, onde, nome, rel) {
    var out = [];
    if (!Array.isArray(origem)) {
      rel.push({ onde: onde, campo: 'lista "' + nome + '"', nivel: origem === undefined ? 'info' : 'substituido', valorArquivo: mostra(origem), valorAdotado: 'lista vazia',
                 motivo: 'Lista ausente ou inválida: abre vazia.' });
      return out;
    }
    origem.forEach(function (linha, i) {
      var r = rot + ' ' + (i + 1) + (objeto(linha) && typeof linha[chaveId] === 'string' && linha[chaveId] !== '' ? ' (' + linha[chaveId] + ')' : '');
      if (!objeto(linha)) {
        rel.push({ onde: r, campo: 'linha', nivel: 'substituido', valorArquivo: mostra(linha), valorAdotado: '(retirada)', motivo: 'Linha que não é um objeto: retirada.' });
        return;
      }
      out.push(grupo(defs, linha, r, rel));
    });
    return out;
  }

  function linhaNova(grupoNome, extra) {
    var o = {}, defs = CAT[grupoNome], k;
    for (k in defs) { if (tem(defs, k)) { o[k] = defs[k].p; } }
    for (k in (extra || {})) { if (tem(extra, k) && tem(defs, k)) { o[k] = extra[k]; } }
    return o;
  }
  // Bloco "ar" com os padrões "em uso" e sem redes
  function arPadrao() {
    var a = {}, g;
    for (g in CAT.GRUPOS_AR) { if (tem(CAT.GRUPOS_AR, g)) { a[g] = linhaNova(CAT.GRUPOS_AR[g]); } }
    a.redes = [];
    return a;
  }
  // Rede de ar nova, com as três listas vazias
  function redeNova(extra) {
    var r = linhaNova('arRede', extra), l;
    for (l in CAT.LISTAS_AR) { if (tem(CAT.LISTAS_AR, l)) { r[l] = []; } }
    return r;
  }

  // Bloco "ar" do arquivo → bloco novo, campo a campo
  function abrirAr(bruto, rel) {
    var A = {}, g, k;
    for (g in CAT.GRUPOS_AR) {
      if (!tem(CAT.GRUPOS_AR, g)) { continue; }
      if (!objeto(bruto[g])) {
        rel.push({ onde: NOME_GRUPO_AR[g], campo: 'bloco "ar.' + g + '"', nivel: 'substituido', valorArquivo: mostra(bruto[g]), valorAdotado: 'padrões', motivo: 'Bloco ausente ou inválido: adotados os padrões.' });
        A[g] = linhaNova(CAT.GRUPOS_AR[g]);
      } else { A[g] = grupo(CAT[CAT.GRUPOS_AR[g]], bruto[g], NOME_GRUPO_AR[g], rel, { calados: CALADOS_AR }); }
    }
    A.redes = [];
    if (!Array.isArray(bruto.redes)) {
      rel.push({ onde: 'Dutos de ar', campo: 'lista "redes"', nivel: bruto.redes === undefined ? 'info' : 'substituido', valorArquivo: mostra(bruto.redes), valorAdotado: 'lista vazia',
                 motivo: 'Lista ausente ou inválida: abre vazia.' });
    } else {
      bruto.redes.forEach(function (rd, i) {
        var rot = 'Rede de ar ' + (i + 1) + (objeto(rd) && typeof rd.id === 'string' && rd.id !== '' ? ' (' + rd.id + ')' : ''), o, l;
        if (!objeto(rd)) {
          rel.push({ onde: rot, campo: 'rede', nivel: 'substituido', valorArquivo: mostra(rd), valorAdotado: '(retirada)', motivo: 'Rede que não é um objeto: retirada.' });
          return;
        }
        o = grupo(CAT.arRede, rd, rot, rel, { listas: Object.keys(CAT.LISTAS_AR) });
        for (l in CAT.LISTAS_AR) {
          if (tem(CAT.LISTAS_AR, l)) { o[l] = lista(CAT[CAT.LISTAS_AR[l]], rd[l], rot + ' · ' + NOME_LISTA_AR[l], l === 'trechos' ? 'id' : 'trecho', rot, l, rel); }
        }
        A.redes.push(o);
      });
    }
    for (k in bruto) {
      if (tem(bruto, k) && !tem(CAT.GRUPOS_AR, k) && k !== 'redes') {
        rel.push({ onde: 'Dutos de ar', campo: k, nivel: 'info', valorArquivo: mostra(bruto[k]), valorAdotado: '(ignorado)', motivo: 'Chave que este app não conhece: ignorada.' });
      }
    }
    return A;
  }

  function abrir(obj) {
    try {
      if (!objeto(obj)) { return nao('O arquivo não contém um projeto.'); }
      if (obj.formato !== FORMATO) {
