<script>
/* ==== js/motor/ar.js ==== */
/* Redes HVAC. Motor, peça Ar: propriedades do ar para os dutos e vazão de ar pelo calor sensível.
   Massa específica: ar-padrão da NBR 16401-1:2024, 3.8 (1,2 kg/m³ a 20 °C e 101,325 kPa), corrigido pela pressão da
   altitude (ASHRAE Fundamentals 2021 SI, cap. 1, Eq. 3) e pela temperatura do ar no duto. É ar seco: a umidade é
   desprezada na massa específica.
   Viscosidade: a do ar-padrão do cap. 21, tirada de ASHRAE Fundamentals 2021, cap. 21, p. 21.6, Eq. 21 e texto
   (Re = 66,4·Dh·V com 1,204 kg/m³, que está no texto da página, fora da equação). A Eq. 21 vale de 4 a 38 °C.
   Vazão pelo calor sensível: a mesma conta do app de difusores (massa específica só pela altitude e calor específico
   do ar úmido do recinto), para a mesma unidade dar a mesma vazão nos dois apps. Sem DOM. */
(function (H) {
  'use strict';
  var M = H.motor = H.motor || {};
  function numero(v) { return typeof v === 'number' && isFinite(v); }

  M.ar = {
    P0: 101325,               // Pa
    RHO_PADRAO: 1.2,          // kg/m³ (NBR 16401-1:2024, 3.8)
    T_PADRAO: 20,             // °C
    MU_PADRAO: 1.204 / 66400, // Pa·s (Fundamentals 2021, cap. 21, Eq. 21)
    ALTITUDE_PADRAO: 1060,    // m (Brasília)
    T_RECINTO_PADRAO: 24,     // °C
    UR_PADRAO: 50,            // %

    // p/p0 pela altitude z, em m (Fundamentals 2021, cap. 1, Eq. 3)
    pressaoRelativa: function (z) { return Math.pow(1 - 2.25577e-5 * z, 5.2559); },

    // pressão de saturação sobre água líquida, em Pa; t em °C (Fundamentals 2021, cap. 1, Eq. 6)
    pws: function (t) {
      var T = t + 273.15;
      return Math.exp(-5.8002206e3 / T + 1.3914993 - 4.8640239e-2 * T + 4.1764768e-5 * T * T
        - 1.4452093e-8 * T * T * T + 6.5459673 * Math.log(T));
    },

    // prem: { altitude, tAr, rhoManual, muManual, tRecinto, ur }; tRede: temperatura do ar da rede, se informada
    propriedades: function (prem, tRede) {
      prem = prem || {};
      var z = numero(prem.altitude) ? prem.altitude : this.ALTITUDE_PADRAO;
      var t = numero(tRede) ? tRede : (numero(prem.tAr) ? prem.tAr : this.T_PADRAO);
      var tRec = numero(prem.tRecinto) ? prem.tRecinto : this.T_RECINTO_PADRAO;
      var ur = numero(prem.ur) ? prem.ur : this.UR_PADRAO;
      var pRel = this.pressaoRelativa(z), p = this.P0 * pRel;
      var rhoManual = numero(prem.rhoManual) && prem.rhoManual > 0, muManual = numero(prem.muManual) && prem.muManual > 0;
      var rho = rhoManual ? prem.rhoManual : this.RHO_PADRAO * pRel * (273.15 + this.T_PADRAO) / (273.15 + t);
      var mu = muManual ? prem.muManual : this.MU_PADRAO;
      var pv = ur / 100 * this.pws(tRec), w = 0.621945 * pv / (p - pv);
      return {
        altitude: z, tAr: t, pRel: pRel, p: p,
        rho: rho, origemRho: rhoManual ? 'manual' : 'calculada',
        mu: mu, origemMu: muManual ? 'manual' : 'padrão',
        nu: mu / rho,
        tRecinto: tRec, ur: ur, w: w, cp: 1006 + 1860 * w,   // J/(kg·°C)
        rhoVazao: this.RHO_PADRAO * pRel                     // kg/m³, só para a vazão pelo calor sensível
      };
    },

    // vazão de ar, em m³/s, que retira o calor sensível qs (W) com a diferença dT (°C)
    vazaoDeCalor: function (qs, dT, ar) {
      if (!numero(qs) || !numero(dT) || !(dT > 0)) { return null; }
      return qs / (ar.rhoVazao * ar.cp * dT);
    }
  };
})(window.HVAC);

</script>
<script>
/* ==== js/motor/secao.js ==== */
/* Redes HVAC. Motor, peça Seção: geometria da seção do duto de ar (circular, retangular, oval e flexível).
   Diâmetro equivalente (De): o do duto circular com a mesma perda, vazão e comprimento. Retangular: Eq. 25;
   oval: Eq. 26 a 28; diâmetro hidráulico: Eq. 24 (ASHRAE Fundamentals 2021 SI, cap. 21, p. 21.6 e 21.9).
   Dimensões em mm; área em m², perímetro em m. No retangular, a é a largura e b a altura; no oval, a é o eixo
   maior e b o eixo menor. Sem DOM. */
(function (H) {
  'use strict';
  var M = H.motor = H.motor || {};
  function numero(v) { return typeof v === 'number' && isFinite(v); }

  M.secao = {
    FORMAS: ['circular', 'retangular', 'oval', 'flexivel'],

    circular: function (forma) { return forma === 'circular' || forma === 'flexivel'; },

    deRetangular: function (a, b) { return 1.30 * Math.pow(a * b, 0.625) / Math.pow(a + b, 0.25); },

    // área (mm²), perímetro (mm) e De (mm) do oval de eixo maior a e eixo menor b
    oval: function (a, b) {
      var area = Math.PI * b * b / 4 + b * (a - b), per = Math.PI * b + 2 * (a - b);
      return { area: area, perimetro: per, de: 1.55 * Math.pow(area, 0.625) / Math.pow(per, 0.25) };
    },

    // Devolve { ok, motivo, area, perimetro, de, dh, aspecto }
    geometria: function (forma, d, a, b) {
      var area, per, de, asp, o;
      function falha(m) { return { ok: false, motivo: m, area: null, perimetro: null, de: null, dh: null, aspecto: null }; }
      if (this.FORMAS.indexOf(forma) < 0) { return falha('forma do duto não informada'); }
      if (this.circular(forma)) {
        if (!numero(d)) { return falha('sem dimensão'); }
        if (!(d > 0)) { return falha('dimensão não positiva'); }
        area = Math.PI * d * d / 4; per = Math.PI * d; de = d; asp = 1;
      } else {
        if (!numero(a) || !numero(b)) { return falha('sem dimensão'); }
        if (!(a > 0) || !(b > 0)) { return falha('dimensão não positiva'); }
        if (forma === 'retangular') {
          area = a * b; per = 2 * (a + b); de = this.deRetangular(a, b); asp = Math.max(a, b) / Math.min(a, b);
        } else {
          if (a < b) { return falha('oval com o eixo maior menor que o menor'); }
          o = this.oval(a, b); area = o.area; per = o.perimetro; de = o.de; asp = a / b;
        }
      }
      return { ok: true, motivo: '', area: area / 1e6, perimetro: per / 1000, de: de, dh: 4 * area / per, aspecto: asp };
    }
  };
})(window.HVAC);

</script>
<script>
/* ==== js/motor/dutos.js ==== */
/* Redes HVAC. Motor, peça Dutos: redes de dutos de ar pelo método da perda de carga constante.
   Especificação: ESPECIFICACAO_R1.md (sessão R1, 2026-10-09), aprovada com as diferenças DA1 a DA14.

   → singularidades (C × pv da velocidade real) → componentes → acumulado, boca crítica e desbalanceamento por lado →

(function (H) {

      if (e.forma === 'oval' && !(numero(e.ladoFixo) && e.ladoFixo > 0)) { return falha('no oval, a sugestão pede o eixo menor fixo'); }

    calcular: function (P, opc) {

      else if (est.terminal[i]) { direta.push(M.ar.vazaoDeCalor(e.qs, rede.dT, ar)); origemQ[i] = 'calor'; }
      else { direta.push(undefined); origemQ[i] = 'soma'; }

        qCat: (numero(y.qCat) && y.qCat > 0) ? y.qCat : null, dp: null, orfa: li < 0, obs: txt(y.obs)
      };

        lado: lado[i], raiz: est.pai[i] === R.RAIZ, boca: est.terminal[i],
        forma: txt(e.forma), d: numero(e.d) ? e.d : null, a: numero(e.a) ? e.a : null, b: numero(e.b) ? e.b : null,
        L: numero(e.L) ? e.L : null, q: q[i], qM3h: numero(q[i]) ? q[i] * 3600 : null, qLs: numero(q[i]) ? q[i] * 1000 : null, origemQ: origemQ[i],
        qRamais: null, calorSensivel: null, nSing: singDe[i].length, nComp: compDe[i].length,
        area: null, perimetro: null, de: null, dh: null, aspecto: null, v: null, pv: null,
        eps: null, origemEps: '', fonteEps: '', ve: null, re: null, regime: '', rr: null, f: null, pdcf: null, paMBase: null,

      if (g.ok) {

      }

      '<div class="entrada' + (o.fixo ? ' fixo' : '') + '">' +
        '<input class="num" id="' + o.id + '" type="text" inputmode="decimal" autocomplete="off" value="' + f.campo(o.valor, casas) + '"' +
        (o.fixo ? ' readonly' : ' data-caminho="' + o.caminho + '" data-tipo="' + (o.inteiro ? 'int' : 'num') + '"' + (o.padrao !== undefined || o.anulavel ? ' data-anulavel="1"' : '') +
          (o.negativo ? ' data-negativo="1"' : '')) + '>' +
        (o.unidade ? '<span class="un">' + esc(o.unidade) + '</span>' : '') +
      '</div>' +
      '<div class="estado">' + estado + '</div>' +

  }

  function texto(o) {
    return '<div class="campo"><label for="' + o.id + '">' + esc(o.rotulo) + '</label><div class="entrada">' +
      '<input id="' + o.id + '" type="text" autocomplete="off" value="' + esc(o.valor) + '" placeholder="' + esc(o.dica || '') +

  function seletor(o) {

      var v = typeof op === 'string' ? op : op.v, t = typeof op === 'string' ? op : op.t;

    }).join('');
    return '<div class="campo"><label for="' + o.id + '">' + esc(o.rotulo) + '</label><div class="entrada">' +
      '<select id="' + o.id + '"' + (o.caminho ? ' data-caminho="' + o.caminho + '" data-tipo="sel"' : '') + (o.acaoSel ? ' data-acao-sel="' + o.acaoSel + '"' : '') + '>' + ops + '</select></div>' +
      '<div class="estado">' + (o.fonte ? selo('norma', o.seloTexto || 'fonte', o.fonte) : '') + '</div>' +
      (o.nota ? '<div class="fraco">' + esc(o.nota) + '</div>' : '') + '</div>';
  }

  function segmentado(o) {
    return '<div class="campo"><span class="rotulo">' + esc(o.rotulo) + '</span><div><div class="seg" role="group" aria-label="' + esc(o.rotulo) + '">' +
      o.opcoes.map(function (op) {
        return '<button type="button" data-acao="' + (o.acao || 'definir') + '" data-caminho="' + o.caminho + '"' + (o.campo ? ' data-campo="' + o.campo + '"' : '') + ' data-valor="' + esc(op.v) + '"' +
          (o.numerico ? ' data-numerico="1"' : '') + (o.booleano ? ' data-booleano="1"' : '') + ' aria-pressed="' + (op.v === o.valor) + '">' + esc(op.t) + '</button>';
      }).join('') + '</div></div>' + (o.fonte ? '<div class="estado">' + selo('norma', 'fonte', o.fonte) + '</div>' : '') + '</div>';
  }

  // Valor calculado: não se edita, e o clique abre a conta
  function calculado(o) {
    return '<div class="campo"><span class="rotulo">' + esc(o.rotulo) + '</span><div>' +
      '<button type="button" class="valor-calc num" data-acao="' + (o.chave ? 'conta' : 'fonte') + '"' +
      (o.chave ? ' data-chave="' + o.chave + '"' : ' data-fonte="' + esc(o.fonte || '') + '"') + '>' + esc(o.valor) +
      (o.unidade ? ' <small>' + esc(o.unidade) + '</small>' : '') + '</button></div>' +
      '<div class="estado">' + selo('calc', 'calculado') + (o.demo ? selo('demo', typeof o.demo === 'string' ? o.demo : 'valor do exemplo') : '') + '</div></div>';
  }

  function passos(lista) {
    return lista.map(function (p) {
      return '<div class="passo"><div class="q"><span>' + esc(p.passo) + '</span><span class="num">' + esc(p.resultado) + '</span></div>' +
        (p.formula ? '<div class="f">' + esc(p.formula) + (p.valores ? ' = ' + esc(p.valores) : '') + '</div>' : '') +
        (p.fonte ? '<div class="fo">' + esc(p.fonte) + '</div>' : '') + '</div>';
    }).join('');
  }

  function aprender(html) {
    return daTela().aprender ? '<div class="aprender"><b>Por quê?</b> ' + html + '</div>' : '';
  }

  // Cabeçalho de tela: linha de contexto, título e texto de apoio (o texto aceita HTML do app)
  function cabeca(sobre, titulo, texto) {

  }

  function kpi(rotulo, valor, sub) {
    return '<div class="kpi-c"><span>' + rotulo + '</span><b class="num">' + valor + '</b>' + (sub ? '<span class="fraco">' + sub + '</span>' : '') + '</div>';
  }

      '<button type="button" class="bloco-cab" data-acao="bloco" data-bloco="' + id + '" aria-expanded="' + aberto + '">' +

        '<span class="carga num">' + carga + (rotuloCarga ? '<small>' + rotuloCarga + '</small>' : '') + '</span><span class="seta" aria-hidden="true">›</span>' +
      '</button>' + (aberto ? '<div class="bloco-corpo">' + corpo() + '</div>' : '') + '</section>';
  }

  /* Barras ordenadas da maior para a menor; cada linha abre a conta. lista = [{ chave, nome, valor }]; total = base do percentual;
     unidade = texto depois do valor; casas = casas decimais do valor (padrão 0) */
  function barras(lista, total, unidade, casas) {
    var max = 0, min = 0;
    lista.forEach(function (c) { max = Math.max(max, c.valor); min = Math.min(min, c.valor); });
    var faixa = (max - min) || 1, zero = (-min / faixa) * 100;
    var ordenado = lista.slice().sort(function (a, b) { return b.valor - a.valor; });
    return '<div class="barras">' + ordenado.map(function (c) {
      var larg = Math.abs(c.valor) / faixa * 100;
      var estilo = c.valor >= 0 ? 'left:' + zero.toFixed(2) + '%;width:' + larg.toFixed(2) + '%' : 'left:' + (zero - larg).toFixed(2) + '%;width:' + larg.toFixed(2) + '%';
      return '<div class="linha-b" data-acao="conta" data-chave="' + c.chave + '" role="button" tabindex="0" title="Abrir a conta">' +
        '<span class="nome">' + esc(c.nome) + '</span>' +
        '<span class="trilho"><span class="eixo" style="left:' + zero.toFixed(2) + '%"></span><span class="barra' + (c.valor < 0 ? ' neg' : '') + '" style="' + estilo + '"></span></span>' +
        '<span class="v">' + f.num(c.valor, casas || 0) + (unidade ? ' ' + unidade : '') + '</span><span class="p">' + f.num(c.valor / total * 100, 0) + ' %</span></div>';
    }).join('') + '</div>';
  }

  // Os mesmos passos da gaveta, em tabela, para a folha do memorial
  function tabPassos(lista) {
    return '<table class="passos-t"><thead><tr><th>Passo</th><th>Fórmula e valores</th><th class="num">Resultado</th><th>Fonte</th></tr></thead><tbody>' +
      lista.map(function (p) {
        return '<tr><td>' + esc(p.passo) + '</td><td class="f">' + esc(p.formula) + (p.valores ? ' = ' + esc(p.valores) : '') + '</td><td class="num">' + esc(p.resultado) + '</td><td>' + esc(p.fonte) + '</td></tr>';
      }).join('') + '</tbody></table>';
  }

  /* Lista de cartões do celular (v0.4.0): oculta no computador (o app desenha também a tabela, marcada com .so-computador).
     itens = [{ href (tela que o cartão abre; sem href o cartão não é link), titulo, sub (texto depois do título),
     valores: [{ r (rótulo), v (valor já formatado), u (unidade) }] (valor vazio ou "—" não aparece), situacao (HTML do app),
     destaque (bool: barra lateral, como o circuito crítico) }] */
  function cartoes(itens) {
    return '<ul class="cel-cartoes">' + itens.map(function (x) {
      var vals = (x.valores || []).filter(function (v) { return v && v.v !== undefined && v.v !== null && v.v !== '' && v.v !== '—'; }).map(function (v) {
        return '<span><small>' + esc(v.r) + '</small>' + esc(v.v) + (v.u ? ' ' + esc(v.u) : '') + '</span>';
      }).join('');
      var tag = x.href ? 'a' : 'div', corpo = '<span class="cel-c-tit"><b>' + esc(x.titulo) + '</b>' + (x.sub ? ' <span>· ' + esc(x.sub) + '</span>' : '') + '</span>' +
        (x.href ? '<span class="cel-c-seta" aria-hidden="true">›</span>' : '') + (vals ? '<span class="cel-c-vals num">' + vals + '</span>' : '') +
        (x.situacao ? '<span class="cel-c-sit">' + x.situacao + '</span>' : '');
      return '<li><' + tag + ' class="cel-cartao' + (x.destaque ? ' destaque' : '') + '"' + (x.href ? ' href="' + esc(x.href) + '"' : '') + '>' + corpo + '</' + tag + '></li>';
    }).join('') + '</ul>';
  }

  H.ui.c = { selo: selo, campo: campo, texto: texto, seletor: seletor, segmentado: segmentado, calculado: calculado, passos: passos, aprender: aprender,
             cabeca: cabeca, kpi: kpi, bloco: bloco, barras: barras, tabPassos: tabPassos, cartoes: cartoes };
})(window.HVAC);

<script>
/* ==== plataforma v0.4.1: js/interface/casca.js ==== */
/* Plataforma HVAC. Casca comum dos apps: estado, armazenamento, rotas, trilha, faixa de resultado, gaveta, janela, paleta de comandos,
   tema, modo aprendizado, arquivo de projeto com relatório de importação e impressão do memorial; desde a v0.4.0, o celular

   Tudo o que é próprio do app vem do manifesto H.app (contrato em docs\GUIA_INTERFACE.md). A casca não conhece motor nenhum:

(function (H) {
  'use strict';

  var clicarDepois = null;                    // seletor do parâmetro de teste ?clicar=, à espera do próximo desenho
  var digitarDepois = null;                   // "<id>:<valor>" do parâmetro de teste ?digitar=, à espera do próximo desenho
  var despejar = false;                       // parâmetro de teste ?despejar=1: o texto do arquivo vai para a página a cada desenho
  function tem(o, k) { return !!o && Object.prototype.hasOwnProperty.call(o, k); }

  // ------------------------------------------------------------ armazenamento (o app funciona sem ele)
  function guardar() { try { localStorage.setItem(A.chave, JSON.stringify(E)); } catch (e) { /* sem armazenamento: segue em memória */ } }
  function guardarPref() { try { localStorage.setItem(CHAVE_PREF, JSON.stringify({ aprender: U.aprender, tema: U.tema })); } catch (e) { /* idem */ } }
  function contar(rel, nivel) { var n = 0; rel.forEach(function (x) { if (x.nivel === nivel) n++; }); return n; }
  // O relatório abre sozinho quando o arquivo veio de formato anterior ou quando algum valor foi substituído
  function pedeRelatorio(r) { return r.versaoOrigem < A.arquivo.versao || contar(r.relatorio, 'substituido') > 0; }
  function carregar() {
    try {
      var p = JSON.parse(localStorage.getItem(CHAVE_PREF) || 'null');
      if (p) { U.aprender = !!p.aprender; U.tema = p.tema === 'escuro' ? 'escuro' : 'claro'; }
      else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) U.tema = 'escuro';
      var s = JSON.parse(localStorage.getItem(A.chave) || 'null');
      if (s) {
        var r = A.arquivo.abrir(s);
        if (r.ok) {

          return r.projeto;
        }

  }

  // ------------------------------------------------------------ importação (arquivo de projeto e parâmetro de teste ?importar=)
  function fmtQuando() {

  }
  function htmlNaoAbriu(motivo) {
    return '<h2>Não foi possível abrir</h2><p>' + esc(motivo) + '</p><div class="acoes" style="margin-top:12px"><button class="botao prim" data-acao="fechar">Fechar</button></div>';
  }
  /* Abre o projeto lido do texto do arquivo. opc.semGuardar: não grava no localStorage (parâmetro de teste); opc.irParaProjeto: navega

  }
  // Linhas do relatório: { onde, campo, nivel ('info' | 'convertido' | 'mantido' | 'substituido'), valorArquivo, valorAdotado, motivo }
  var SELO_NIVEL = { substituido: ' <span class="selo alterado">alterado</span>', mantido: ' <span class="selo mantido">mantido</span>' };
  var NIVEL_TXT = { info: 'INFO', convertido: 'CONVERTIDO', mantido: 'MANTIDO', substituido: 'SUBSTITUÍDO' };
  var BOTOES_REL = '<div class="acoes" style="margin-top:12px"><button class="botao prim" data-acao="fechar">Continuar</button><button class="botao" data-acao="salvar-relatorio">Salvar relatório (.txt)</button></div>';
  function htmlLinhas(rel) {
    return '<div class="tabela-rolo" style="max-height:52vh;overflow:auto"><table><thead><tr><th>Onde</th><th>Campo</th><th>No arquivo</th><th>Adotado</th><th>Motivo</th></tr></thead><tbody>' +
      rel.map(function (x) {
        return '<tr><td>' + esc(x.onde) + '</td><td>' + esc(x.campo) + (tem(SELO_NIVEL, x.nivel) ? SELO_NIVEL[x.nivel] : '') + '</td><td>' + esc(x.valorArquivo) + '</td><td>' +
          esc(x.valorAdotado) + '</td><td>' + esc(x.motivo) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }
  // "N conversões · N valores seus mantidos · N substituições"; o trecho dos mantidos só aparece quando há algum
  function contagem(rel) {
    var nc = contar(rel, 'convertido'), nm = contar(rel, 'mantido'), ns = contar(rel, 'substituido');
    return nc + (nc === 1 ? ' conversão' : ' conversões') + (nm ? ' · ' + nm + (nm === 1 ? ' valor seu mantido' : ' valores seus mantidos') : '') +
      ' · ' + ns + (ns === 1 ? ' substituição' : ' substituições');
  }
  function htmlImportacao() {
    var im = U.importacao, rel = im.relatorio;
    return '<h2>Relatório de importação</h2><p class="suave" style="margin-bottom:10px">Arquivo <b>' + esc(im.nome) + '</b> · formato da versão ' + im.versaoOrigem + ' → ' + A.arquivo.versao + ' · ' +
      contagem(rel) + ' · ' + esc(im.quando) + '</p>' +
      (rel.length ? htmlLinhas(rel) : '<p>Nenhuma alteração foi necessária.</p>') + BOTOES_REL;
  }
  /* Relatório avulso (H.ui.api.relatorio): a mesma janela do relatório do arquivo de projeto, para qualquer importação do app.
     r = { linhas, titulo, nome (arquivo de origem), resumo (frase em destaque), texto (conteúdo do .txt), arquivoTxt (nome do .txt), manter } */
  function htmlRelatorio(r) {
    return '<h2>' + esc(r.titulo) + '</h2><p class="suave" style="margin-bottom:10px">' + (r.nome ? 'Arquivo <b>' + esc(r.nome) + '</b> · ' : '') + contagem(r.linhas) + ' · ' + esc(r.quando) + '</p>' +
      (r.resumo ? '<p style="margin-bottom:10px"><b>' + esc(r.resumo) + '</b></p>' : '') +
      (r.linhas.length ? htmlLinhas(r.linhas) : (r.resumo ? '' : '<p>Nenhuma alteração foi necessária.</p>')) + BOTOES_REL;
  }
  function textoRelatorioAvulso(r) {
    var l = [r.titulo];
    if (r.nome) l.push('Arquivo: ' + r.nome);
    l.push(contagem(r.linhas) + ' · ' + r.quando);
    if (r.resumo) l.push(r.resumo);

      l.push('[' + (tem(NIVEL_TXT, x.nivel) ? NIVEL_TXT[x.nivel] : String(x.nivel)) + '] ' + x.onde + ' · ' + x.campo + ': no arquivo "' + x.valorArquivo + '", adotado "' + x.valorAdotado + '". ' + x.motivo);

    U.sobre = { tipo: 'janela', html: htmlRelatorio(rel), manter: !!r.manter, relatorio: rel };
  }
  function nomeTxt(nome) { return String(nome).replace(/\.json$/i, '').replace(/[^\wÀ-ú]+/g, '_') + '_relatorio_importacao.txt'; }

  function salvarRelatorio() {
    var av = U.sobre && U.sobre.relatorio;
    if (av) { baixar('﻿' + (typeof av.texto === 'string' ? av.texto : textoRelatorioAvulso(av)), 'text/plain;charset=utf-8', av.arquivoTxt || nomeTxt(av.nome || 'relatorio')); return; }
    var im = U.importacao; if (!im) return;
    baixar('﻿' + A.arquivo.textoRelatorio({ relatorio: im.relatorio, versaoOrigem: im.versaoOrigem }, im.nome), 'text/plain;charset=utf-8',
      String(im.nome).replace(/\.json$/i, '').replace(/[^\wÀ-ú]+/g, '_') + '_relatorio_importacao.txt');
  }
  function decodificarBase64(b64) {
    var bin = atob(b64.replace(/-/g, '+').replace(/_/g, '/')), pct = '', i;
    for (i = 0; i < bin.length; i++) pct += '%' + ('0' + bin.charCodeAt(i).toString(16)).slice(-2);

  // ------------------------------------------------------------ rotas: #/tela/indice?chave=valor
  /* Parâmetros de endereço da casca (usados em testes e capturas): importar, bloco, tema, aprender, conta, clicar, digitar, despejar.
     Os do app ficam em A.parametros = { nome: function (valor, U) }; se o app declara "clicar", "digitar" ou "despejar", vale o dele
     e a casca não age nesse parâmetro. */
  function lerRota() {

    var rota = A.rotas[U.tela];
    if (rota.indice) U[rota.indice] = Math.max(0, parseInt(seg[1], 10) || 0);
    U.temIndice = !!rota.indice && /^\d+/.test(seg[1] || '');   // "#/rota/N" trouxe o índice; "#/rota" não (U[rota.indice] vale 0 nos dois casos)
    (partes[1] || '').split('&').forEach(function (par) {

    if (mantida && !U.sobre) { mantida.manter = false; U.sobre = mantida; }                          // a janela da casca, quando há, prevalece
    desenhar(); window.scrollTo(0, 0);
  });

  // ------------------------------------------------------------ celular (v0.4.0; especificação da sessão M0, itens C1 a C17)
  /* Tudo aqui só age com a tela estreita (até 760 px, só na tela): na tela larga a página fica igual à de antes, também por dentro.
     Os elementos novos (botão Menu, barra de passos, balão de dica) vêm de pagina.js e nascem ocultos (base.css). */
  var estreita = window.matchMedia ? window.matchMedia('screen and (max-width: 760px)') : { matches: false };
  function celular() { return !!estreita.matches; }
  var imprimindo = false;                     // a troca de mídia durante a impressão não redesenha a tela
  window.addEventListener('beforeprint', function () { imprimindo = true; });
  window.addEventListener('afterprint', function () { imprimindo = false; });

  // Menu (C1, C2): o que estava no topo e na paleta, em botões de 44 px; o seletor de arquivo fica sobre o botão (C12)
  function htmlMenu() {
    return '<h2>Menu</h2><p class="fraco" style="margin:2px 0 12px">' + esc(A.nome) + (A.rotuloVersao ? ' · ' + esc(A.rotuloVersao) : '') + '</p>' +
      '<div class="cel-lista-menu">' +
        '<button type="button" class="botao prim" data-acao="salvar">Salvar arquivo do projeto</button>' +
        '<label class="botao arquivo-projeto">Abrir arquivo de projeto<input type="file" data-arquivo-projeto accept=".json,application/json"></label>' +
        (rotaQueImprime() ? '<button type="button" class="botao" data-acao="pdf">Gerar PDF do memorial</button>' : '') +
        '<button type="button" class="botao" data-acao="tema">' + (U.tema === 'escuro' ? 'Usar tema claro' : 'Usar tema escuro') + '</button>' +
        '<button type="button" class="botao" data-acao="aprender">' + (U.aprender ? 'Desligar o modo aprendizado' : 'Ligar o modo aprendizado') + '</button>' +
        (A.ajuda && A.ajuda.length ? '<button type="button" class="botao" data-acao="ajuda">Ajuda</button>' : '') +
        (tem(A.rotas, 'referencias') ? '<a class="botao" href="#/referencias">Referências</a>' : '') +
        '<button type="button" class="botao" data-acao="paleta">Todos os comandos</button>' +
        '<button type="button" class="botao leve" data-acao="fechar">Fechar</button>' +
      '</div>';
  }

  // Barra de passos embaixo (C3): anterior · atual (abre a lista dos passos) · próximo; rota fora da trilha mostra "Ver os passos"
  function indicePasso() {
    var ativa = A.rotas[U.tela].passo || U.tela, k;
    for (k = 0; k < A.trilha.length; k++) if (A.trilha[k].r === ativa) return k;
    return -1;
  }
  function htmlPassos(R) {
    var tr = A.trilha, i = indicePasso(), x = i >= 0 ? tr[i] : null, meio;
    function lado(j, seta, rot) {
      if (j < 0 || j >= tr.length) return '<span class="vazio" aria-hidden="true">' + seta + '</span>';
      return '<a href="#/' + tr[j].r + '" aria-label="' + rot + ': ' + esc(tr[j].t) + '">' + seta + '<small>' + esc(tr[j].t) + '</small></a>';
    }
    if (x) {
      meio = '<button type="button" class="atual" id="cel-lista-passos" data-acao="passos" aria-label="Ver todos os passos"><small>Passo ' + (i + 1) + ' de ' + tr.length + '</small>' +
        '<b>' + esc(x.t) + '</b><small' + (x.pend && x.pend(E, R) ? ' class="pend"' : '') + '>' + esc(x.s ? x.s(E, R) : '') + '</small></button>';
    } else {
      meio = '<button type="button" class="atual" id="cel-lista-passos" data-acao="passos"><small>' + (U.tela === 'inicio' ? 'Início' : 'Fora da trilha') + '</small><b>Ver os passos</b></button>';
    }
    return lado(i < 0 ? -1 : i - 1, '‹', 'Passo anterior') + meio + lado(i < 0 ? 0 : i + 1, '›', 'Próximo passo');
  }
  function htmlListaPassos() {
    return '<h2>Passos do projeto</h2><ol class="trilha cel-trilha">' + htmlTrilha(A.calcular ? A.calcular(E) : null) + '</ol>' +
      '<div class="acoes" style="margin-top:12px"><a class="botao" href="#/inicio">Início</a>' + (tem(A.rotas, 'referencias') ? '<a class="botao" href="#/referencias">Referências</a>' : '') +
      '<button type="button" class="botao leve" data-acao="fechar">Fechar</button></div>';
  }

  // Tabelas de leitura (C13): tabela solta ganha o quadro que rola (fora da folha e das tabelas empilháveis) e o aviso quando não cabe
  function quadrosDeLeitura() {
    Array.prototype.forEach.call(document.querySelectorAll('#tela table'), function (t) {
      if (t.closest('.folha') || t.classList.contains('empilha')) return;
      var rolo = t.closest('.tabela-rolo');
      if (!rolo) { rolo = document.createElement('div'); rolo.className = 'tabela-rolo'; t.parentNode.insertBefore(rolo, t); rolo.appendChild(t); }
      var antes = rolo.previousElementSibling;
      if (rolo.scrollWidth > rolo.clientWidth + 1 && !(antes && antes.classList.contains('cel-rolar'))) {
        rolo.insertAdjacentHTML('beforebegin', '<p class="cel-rolar">Arraste a tabela para o lado para ver as outras colunas →</p>');
      }
    });
  }

  // Memorial em escala (C14): na rota que imprime, cada folha é desenhada na largura do papel (o max-width dela) e encolhida até caber
  function folhasEmEscala() {
    if (!A.rotas[U.tela].imprime) return;
    Array.prototype.forEach.call(document.querySelectorAll('#tela .folha'), function (f) {
      if (f.parentNode.closest('.folha') || f.parentNode.classList.contains('cel-moldura')) return;
      var papel = parseFloat(window.getComputedStyle(f).maxWidth), m = document.createElement('div');
      m.className = 'cel-moldura';
      f.parentNode.insertBefore(m, f); m.appendChild(f);
      f.style.width = (papel > 0 && isFinite(papel) ? papel : 800) + 'px';
    });
    escalarFolhas();
  }
  function escalarFolhas() {
    Array.prototype.forEach.call(document.querySelectorAll('#tela .cel-moldura'), function (m) {
      var f = m.firstElementChild, s;
      if (!f) return;
      if (!celular() || m.classList.contains('real')) { f.style.transform = ''; m.style.height = ''; return; }

  window.addEventListener('resize', function () { if (celular()) escalarFolhas(); });

  // Depois de cada desenho: barra de passos, quadros das tabelas e folha em escala; na tela larga, só garante a barra vazia
  function ajustarCelular(R) {
    var nav = document.getElementById('cel-passos');

  }

  // Dica por toque (C10): o title do elemento (que o computador mostra ao passar o mouse) num balão por 5 s
  var relogioDica = null;
  function dica(texto) {
    var d = document.getElementById('cel-dica');
    if (!d || !celular()) return;
    d.textContent = texto; d.hidden = false;
    clearTimeout(relogioDica); relogioDica = setTimeout(function () { d.hidden = true; }, 5000);
  }
  document.addEventListener('click', function (ev) {
    if (!celular() || !ev.target.closest) return;
    var m = ev.target.closest('#tela .cel-moldura'), el;
    if (m) {   // folha do memorial: o toque alterna entre caber na tela e o tamanho real
      if (ev.target.closest('a, button, input, select, [data-acao]')) return;
      m.classList.toggle('real'); escalarFolhas();
      dica(m.classList.contains('real') ? 'Tamanho real: arraste para os lados. Toque de novo para caber na tela.' : 'Folha inteira na tela. Toque para ver no tamanho real.');
      return;
    }
    el = ev.target.closest('#tela [title]');
    if (el && el.getAttribute('title') && !el.closest('a, button, input, select, textarea, label, [data-acao]')) dica(el.getAttribute('title'));
  });

  // Voltar do aparelho (C9): com gaveta ou janela aberta em tela estreita, a casca empilha uma entrada no histórico (sem mudar o
  // endereço); o Voltar fecha a camada e fica na mesma tela. Fechar pelo × ou tocando fora tira a entrada.
  var empilhou = false;
  function voltarDoAparelho() {
    if (U.sobre && !empilhou && celular()) { try { history.pushState({ hvacSobre: true }, ''); empilhou = true; } catch (e) { /* sem histórico: segue */ } }
    else if (!U.sobre && empilhou) { empilhou = false; if (history.state && history.state.hvacSobre) history.back(); }
  }
  window.addEventListener('popstate', function () {
    if (empilhou && U.sobre) { empilhou = false; U.sobre = null; desenharSobre(); }
  });

  // Teclado aberto (C15): com um campo de digitação em foco, a barra de passos e a faixa somem (classe no body, só em tela estreita)
  function campoDeDigitar(el) {
    if (!el || el.readOnly || el.disabled) return false;
    if (el.tagName === 'TEXTAREA') return true;
    return el.tagName === 'INPUT' && !/^(checkbox|radio|file|button|submit|reset|range|color)$/i.test(el.type);
  }
  document.addEventListener('focusin', function (ev) { if (celular() && campoDeDigitar(ev.target)) document.body.classList.add('cel-digitando'); });
  document.addEventListener('focusout', function () {
    setTimeout(function () { if (!campoDeDigitar(document.activeElement)) document.body.classList.remove('cel-digitando'); }, 0);
  });

  // Troca entre tela estreita e larga (girar o aparelho, mudar a janela): redesenha, para pôr ou tirar o que é do celular
  function aoMudarLargura() {
    if (imprimindo || !A) return;
    document.body.classList.remove('cel-digitando');
    desenhar();
  }
  if (estreita.addEventListener) estreita.addEventListener('change', aoMudarLargura);
  else if (estreita.addListener) estreita.addListener(aoMudarLargura);

  // ------------------------------------------------------------ o que a casca oferece ao app
  H.ui.projeto = function () { return E; };
  H.ui.api = {
    projeto: function () { return E; },
    guardar: guardar,
    alterar: alterar,
    desenhar: desenhar,
    janela: function (html, opc) { U.sobre = { tipo: 'janela', html: html, manter: !!(opc && opc.manter) }; },   // opc.manter: sobrevive à próxima troca de endereço
    relatorio: abrirRelatorio,                // relatório avulso: { linhas, titulo, nome, resumo, texto, arquivoTxt, manter }
    textoArquivo: textoArquivo,               // o texto do arquivo de projeto como seria salvo (apoio a teste)
    fechar: function () { U.sobre = null; },
    acoes: ACOES,
    celular: celular,                         // v0.4.0: true com a tela estreita (até 760 px, só na tela)
    dica: dica                                // v0.4.0: balão de dica por 5 s (só age com a tela estreita)
  };

  // Topo: nome do app, rótulo de versão, ícone próprio (opcional) e botão de ajuda (só quando o manifesto traz itens de ajuda)
  function montarTopo() {
    document.getElementById('marca-nome').innerHTML = esc(A.nome) + (A.rotuloVersao ? ' <small>' + esc(A.rotuloVersao) + '</small>' : '');
    if (A.icone) { var svg = document.querySelector('.marca svg'); if (svg) svg.outerHTML = A.icone; }
    if (A.ajuda && A.ajuda.length && !document.getElementById('b-ajuda')) {
      document.getElementById('topo-acoes').insertAdjacentHTML('afterbegin', '<button class="icone" id="b-ajuda" data-acao="ajuda">Ajuda</button>');
    }
  }

  H.ui.iniciar = function () {
    var k;
    A = H.app;
    if (!A || !A.rotas || !A.rotas.inicio || !A.trilha || !A.arquivo) throw new Error('Manifesto do app (H.app) ausente ou incompleto: faltam rotas (com "inicio"), trilha ou arquivo.');
    for (k in A.estado || {}) if (tem(A.estado, k)) U[k] = A.estado[k];
    montarTopo();
    E = carregar();
    lerRota();
    if (U.mostrarNaAbertura && U.importacao) { U.sobre = { tipo: 'janela', html: htmlImportacao() }; }
    U.mostrarNaAbertura = false;
    desenhar();
  };
})(window.HVAC);

<!-- App: telas, tabela editável, contas da gaveta, Resultados, Memorial, Referências e manifesto -->
<script>
/* ==== js/interface/telas.js ==== */
/* Redes HVAC. Telas da água gelada sobre a casca da plataforma: Início, Projeto, Rede e Trecho (especificação A0, seção 4).
   Só montam HTML a partir do projeto (E.projeto) e do resultado do motor (R = M.agua.calcular). Resultados, Memorial e
   Referências ficam em resultados.js, memorial.js e referencias.js. Os campos usam os componentes da casca (H.ui.c); a
   tabela editável é do app (tabela.js). */
(function (H) {
  'use strict';
  var f = H.util.fmt, esc = f.esc, C = H.ui.c, U = H.ui.U, M = H.motor, TAB = H.dados.tab, CAT = H.dados.campos;
  var X = H.ui.redes = H.ui.redes || {};
  var T = H.ui.telas = {};
  // app só de dutos (sessão DU1): o index_dutos.html carrega js\interface\modo_dutos.js, que grava H.modo = 'dutos'
  var DUTOS = X.soDutos = H.modo === 'dutos';
  // app só de água gelada (sessão AG1): o index_agua.html carrega js\interface\modo_agua.js, que grava H.modo = 'agua'
  var AGUA = X.soAgua = H.modo === 'agua';
  // "Passo k de n" pela posição da rota na trilha do manifesto (a trilha muda no app só de dutos)
  X.passo = function (rota) {
    var tr = (H.app && H.app.trilha) || [], i;
    for (i = 0; i < tr.length; i++) { if (tr[i].r === rota) { return 'Passo ' + (i + 1) + ' de ' + tr.length; } }
    return '';
  };

  // ------------------------------------------------------------ apoio
  var ROT_SELO = { norma: 'norma', conferir: 'CONFERIR', premissa: 'premissa', informado: 'informado' };
  function n(v, casas) { return f.num(v, casas); }
  // id do campo de um caminho: "projeto.agua.trechos.3.dn" -> "c-agua-trechos-3-dn"
  function idDe(caminho) { return 'c-' + String(caminho).replace(/^projeto\./, '').replace(/\./g, '-'); }
  // resultado que pode ser mostrado como válido: fluido certo, algum trecho e nenhum erro de dados (ressalva R5 da A1)
  function valido(R) { return R.premissas.ok && R.contagem.trechos > 0 && R.contagem.dados === 0; }
  // selo de um dado pelo texto da fonte, com o texto sempre presente
  function seloFonte(fonte) {
    if (!fonte) { return ''; }
    var s = TAB.selo(fonte);
    return C.selo(s === 'informado' ? 'alterado' : s, ROT_SELO[s], fonte);
  }
  // troca o selo "norma" que a casca põe no campo pelo selo da fonte (CONFERIR ou premissa)
  function comSelo(html, fonte) {
    var s = TAB.selo(fonte);
    return html.replace(/class="selo norma"([^>]*)>[^<]*</, 'class="selo ' + s + '"$1>' + ROT_SELO[s] + '<');
  }
  function comNota(html, nota) { return nota ? html.replace(/<\/div>$/, nota + '</div>') : html; }
  function marca(chave, texto) { return '<span data-g="' + esc(chave) + '">' + esc(texto) + '</span>'; }

  // linha "em uso" de um campo com padrão: o valor que vale, o padrão e a fonte
  function emUso(def, valor) {
    var k = def.pct ? 100 : 1, un = def.un ? ' ' + def.un : '', pad = f.campo(def.p * k, def.casas) + un;
    var txt = valor === def.p ? 'em uso: padrão ' + pad : 'em uso: ' + f.campo(valor * k, def.casas) + un + ' · padrão ' + pad;
    return '<div class="fraco em-uso">' + esc(txt) + (def.fonte ? ' · ' + esc(def.fonte) : '') + '</div>';
  }
  // campo numérico do catálogo (def) num caminho do projeto, com padrão, selo da fonte e a linha "em uso"
  function campoDef(def, caminho, valor) {
    var k = def.pct ? 100 : 1;
    var html = C.campo({ id: idDe(caminho), caminho: caminho, rotulo: def.rotulo, valor: valor === null ? null : valor * k, unidade: def.un, casas: def.casas,
                         padrao: def.p === null ? undefined : def.p * k, alterado: valor !== def.p, fonte: def.fonte, seloPadrao: 'norma', inteiro: !!def.int,
                         negativo: !!def.livre, anulavel: !!(def.nulo && (def.livre || def.p === null)) });   // temperatura: campo com sinal; sem padrão: aceita vazio
    return comNota(def.fonte ? comSelo(html, def.fonte) : html, def.p === null ? '' : emUso(def, valor));
  }
  function campoP(grupo, chave, E) { return campoDef(CAT[grupo][chave], 'projeto.' + grupo + '.' + chave, E.projeto[grupo][chave]); }
  function seletorP(grupo, chave, E, opcoes, nota) {
    var def = CAT[grupo][chave], caminho = 'projeto.' + grupo + '.' + chave;
    var html = C.seletor({ id: idDe(caminho), caminho: caminho, rotulo: def.rotulo, valor: String(E.projeto[grupo][chave]), opcoes: opcoes || def.ops, fonte: def.fonte, seloTexto: 'norma', nota: nota });
    return def.fonte ? comSelo(html, def.fonte) : html;
  }
  function segmentadoP(grupo, chave, E) {
    var def = CAT[grupo][chave], html = C.segmentado({ rotulo: def.rotulo, caminho: 'projeto.' + grupo + '.' + chave, valor: E.projeto[grupo][chave], opcoes: def.ops, fonte: def.fonte });
    return def.fonte ? comSelo(html, def.fonte) : html;
  }
  function textoP(chave, E) {
    var def = CAT.projeto[chave], caminho = 'projeto.' + chave;
    return C.texto({ id: idDe(caminho), caminho: caminho, rotulo: def.rotulo, valor: E.projeto[chave], dica: def.dica });
  }
  function alterados(grupo, E) {
    var c = 0, k;
    for (k in CAT[grupo]) { if (CAT[grupo][k].p !== null && E.projeto[grupo][k] !== CAT[grupo][k].p) { c++; } }
    return c;
  }
  // linha da tabela de erosão em uso (a mesma regra do motor: horas imediatamente superiores; fora da tabela, a 1ª ou a última)
  function linhaErosao(horas) {
    var e = TAB.erosao, i, k = e.length - 1;
    for (i = e.length - 1; i >= 0; i--) { if (e[i][0] >= horas) { k = i; } }
    return { horas: e[k][0], v: e[k][1], acima: horas > e[e.length - 1][0], ultima: e[e.length - 1][0], fonte: (H.dados.bruto.erosao[0] || {}).fonte || '' };
  }
  function nomeFluido(fl) { return M.fluido.nome(fl.tipo) + (fl.tipo === 'agua' ? '' : ' a ' + f.campo(fl.concentracao, 0) + ' %'); }
  function textoSituacao(R) {
    var c = R.contagem;
    if (!R.premissas.ok) { return '⚠ fluido: ' + R.premissas.erro.replace(/^ERRO:\s*/, ''); }
    if (c.trechos === 0) { return 'sem trechos'; }
    if (c.dados) { return '⚠ ' + c.dados + ' com erro de dados' + (c.revisar ? ' · ' + c.revisar + ' a revisar' : ''); }
    return c.revisar ? c.revisar + ' a revisar' : 'OK';
  }
  function plural(q, um, varios) { return q + ' ' + (q === 1 ? um : varios); }

  X.id = idDe; X.valido = valido; X.seloFonte = seloFonte; X.linhaErosao = linhaErosao; X.nomeFluido = nomeFluido; X.textoSituacao = textoSituacao; X.plural = plural; X.marca = marca;
  X.campoDef = campoDef; X.comSelo = comSelo; X.comNota = comNota;
  // opções de um seletor de unidade do cadastro; o valor gravado que não está no cadastro aparece marcado
  X.opcoesUnidade = function (P, valor) {
    var ops = [{ v: '', t: '— nenhuma —' }], vistos = {};
    (P.unidades || []).forEach(function (u) {
      var k = M.rede.chave(u.id);
      if (k !== '' && !vistos[k]) { vistos[k] = true; ops.push({ v: u.id, t: u.id + (u.descricao ? ' · ' + u.descricao : '') }); }
    });
    if (valor !== '' && !vistos[M.rede.chave(valor)]) { ops.push({ v: valor, t: valor + ' (não cadastrada)' }); }
    else if (valor !== '') { ops.forEach(function (o) { if (M.rede.chave(o.v) === M.rede.chave(valor)) { o.v = valor; } }); }
    return ops;
  };

  // ------------------------------------------------------------ Início
  // botões do cartão "Projeto aberto" (os dois apps)
  function acoesInicio(U) {
    return '<div class="acoes" style="margin-top:14px">' +
        '<a class="botao prim" href="#/projeto">Continuar o projeto</a>' +
        '<button class="botao" data-acao="abrir-arquivo">Abrir arquivo</button>' +
        '<button class="botao" data-acao="salvar">Salvar arquivo</button>' +
        '<button class="botao" data-acao="exemplo">Abrir o exemplo</button>' +
        '<button class="botao perigo" data-acao="novo-projeto">Projeto novo</button>' +
        (U.importacao ? '<button class="botao leve" data-acao="ver-importacao">Ver o relatório de importação</button>' : '') +
      '</div>';
  }
  // Início do app só de dutos: o Projeto aberto (só os dutos) e os cinco passos
  function inicioDutos(E, U, R) {
    var p = E.projeto;
    return C.cabeca('Dutos HVAC · dutos de ar', p.nome || 'Projeto sem nome',
        'Redes de dutos de ar pelo método da perda de carga constante: trechos, singularidades, componentes, dimensão sugerida, boca crítica e ventilador. ' +

    // bloco 4: resultado do trecho (cada valor abre a conta na gaveta)
    function calc(rot, valor, un, k) { return C.calculado({ rotulo: rot, valor: valor, unidade: un, chave: 't.' + i + '.' + k }); }
    var b4 = (r.situacao.indexOf('DADOS') === 0 ? '<p class="msg-tela erro">' + esc(r.situacao) + '. Corrija o dado para ver o resultado deste trecho' + (r.consistencia.indexOf('ciclo') >= 0 ? ' (o montante leva de volta ao próprio trecho)' : '') + '.</p>' : '') +
      (primeira ? '' : '<p class="msg-tela erro">Há outro trecho, antes deste, com o mesmo ID: as conexões e os equipamentos valem para o primeiro.</p>') +
      '<div class="grade">' +
        calc('Velocidade', n(r.v, 3), 'm/s', 'v') + calc('Reynolds', n(r.re, 0), r.regime || '', 're') + calc('Fator de atrito f', n(r.f, 5), '', 'f') +
        calc('Perda por metro (tubo novo)', n(r.paM, 1), 'Pa/m', 'paM') + calc('ΔP distribuído', n(r.dpDist, 3), 'kPa', 'dpDist') + calc('ΔP das conexões', n(r.dpLocal, 3), 'kPa', 'dpLocal') +
        calc('ΔP dos equipamentos', n(r.dpEquip, 3), 'kPa', 'dpEquip') + calc('ΔP do trecho', n(r.dpTrecho, 3), 'kPa', 'dpTrecho') + calc('ΔP acumulado', n(r.dpAcum, 3), 'kPa', 'dpAcum') +
        (r.terminal && X.valido(R) ? calc('Excesso do terminal', n(r.excesso, 3), 'kPa', 'excesso') : '') +
        (r.autoridade !== null && X.valido(R) ? calc('Autoridade da válvula', n(r.autoridade, 3), '', 'autoridade') : '') +
        calc('Menor DN que atende', r.menorDN || '—', '', 'menorDN') + '</div>' +
      '<table class="verif"><thead><tr><th>Verificação</th><th class="num">Valor</th><th class="num">Limite</th><th>Resultado</th></tr></thead><tbody>' +
        '<tr><td>Velocidade máxima (' + (r.dnmm !== null && r.dnmm <= pr.dnLimite ? 'até o DN limite' : 'erosão, ' + n(X.linhaErosao(pr.horas).horas, 0) + ' h/ano') + ')</td><td class="num">' + n(r.v, 2) + ' m/s</td><td class="num">' + n(r.vMax, 2) + ' m/s</td><td>' + esc(r.sitV || '—') + '</td></tr>' +
        '<tr><td>Perda por metro, tubo novo</td><td class="num">' + n(r.paM, 0) + ' Pa/m</td><td class="num">' + n(pr.paMin, 0) + ' a ' + n(pr.paMax, 0) + ' Pa/m</td><td>' + esc(r.sitPerda || '—') + '</td></tr>' +
        '<tr><td>ASHRAE 90.1 (informativo; aplicada ao aço, de DN 65 (2½") em diante)</td><td class="num">' + n(r.v, 2) + ' m/s</td><td class="num">' + (typeof r.v901 === 'number' ? n(r.v901, 2) + ' m/s' : 'n.a.') + '</td><td>' + esc(r.sit901 || '—') + '</td></tr>' +
        '<tr class="total"><td>Situação do trecho</td><td></td><td></td><td>' + seloSituacao(r) + '</td></tr></tbody></table>' +
      (r.avisos.length ? '<ul class="avisos">' + r.avisos.map(function (a) { return '<li><b>Aviso:</b> ' + esc(a.texto) + '.</li>'; }).join('') + '</ul>' : '') +
      (r.autoridade !== null && X.valido(R) ? '<p class="fraco">Autoridade = ΔP da válvula ÷ (ΔP do trecho + excesso do terminal). <span class="selo premissa">premissa</span> todo o excesso é dissipado no balanceamento deste terminal; ' +
        'se parte for dissipada a montante, a autoridade real fica entre ' + n(r.autoridade, 2) + ' e ' + n(r.dpValvula / r.dpTrecho, 2) + '. A conta vale para o último trecho do ramal.</p>' : '');

    var ids = {}, lista = '';
    ag.trechos.forEach(function (x, j) { var k = M.rede.chave(x.id); if (j !== i && k !== '' && !ids[k]) { ids[k] = true; lista += '<option value="' + esc(x.id) + '">'; } });
    return '<div class="rede">' + C.cabeca('Rede · trecho ' + (i + 1) + ' de ' + nT, 'Trecho ' + (t.id || '(sem ID)'), esc(t.descricao || '')) +
      '<div class="acoes barra-tab"><a class="botao" href="#/rede">← Rede</a>' +
        (i > 0 ? '<a class="botao leve" href="#/trecho/' + (i - 1) + '">trecho anterior</a>' : '') + (i < nT - 1 ? '<a class="botao leve" href="#/trecho/' + (i + 1) + '">próximo trecho</a>' : '') +
        '<span style="margin-left:auto">' + seloSituacao(r) + '</span></div>' +
      X.maisAcoes('trecho', i, nT) +
      '<div class="cartao"><h2>1 · Vazão e tubo</h2>' + b1 + '</div>' +
      '<div class="cartao"><h2>2 · Conexões</h2>' + b2 + '</div>' +
      '<div class="cartao"><h2>3 · Equipamentos</h2>' + b3 + '</div>' +
      '<div class="cartao"><h2>4 · Resultado do trecho</h2><p class="fraco" style="margin-bottom:10px">Cada valor abre a conta, passo a passo.</p>' + b4 + '</div>' +
      '<datalist id="lista-ids">' + lista + '</datalist></div>';
  };

  X.seloSituacao = seloSituacao;
})(window.HVAC);

</script>
<script>
/* ==== js/interface/tabela.js ==== */
/* Redes HVAC. Tabela editável do app: uma linha por item de uma lista do projeto (trechos, conexões, equipamentos), com as
   entradas e os resultados na mesma linha. Só monta HTML: cada célula é um campo comum da casca (data-caminho com o índice
   da lista, "projeto.agua.trechos.3.dn"), então a gravação, a validação e o Enter são os da casca.
   montar(o): o = { id, base (caminho da lista), linhas: [{ i (índice na lista), l (a linha) }], cat (catálogo do grupo),
     colunas: [{ t (título), k (chave), tipo: 'txt' | 'num' | 'sel' | 'bool', w (largura relativa), dica, lista (id de datalist),
                 opcoes: function (l, i) -> ['a', { v, t }], so: function (l, i) -> bool (a célula só existe quando verdadeiro) }],
     resultados: [{ t, w, num (alinha à direita), v: function (r, i) -> HTML }], res: function (i) -> resultado da linha,
     acoes: function (i) -> HTML, wAcoes, classe: function (i) -> classe da linha, vazio (texto sem linhas) }
   As larguras (w) são relativas: a soma vale a largura da tela; abaixo de 88 % da soma em px a tabela rola na horizontal.
   Celular (v0.4.0; ESPECIFICACAO_celular da M0, R1, R4 e R5), sem efeito na tela larga:
     empilha (bool): table.empilha da plataforma; cada td leva data-rotulo (o título da coluna); texto, lista, resultado de
       texto e ações ocupam a linha toda (td.largo); célula que não se aplica (so) some;
     rolo: classe a mais no quadro da tabela (ex.: 'so-computador', quando o app desenha também a lista em cartões);
     resumo: function (x, r) -> HTML da linha-resumo (td.so-celular, botão com data-acao = acaoResumo e data-i); a linha fica
       recolhida (só o resumo) salvo quando aberta(i) é verdadeiro ou algum campo dela tem erro. */
(function (H) {
  'use strict';
  var f = H.util.fmt, esc = f.esc;

  function idDe(caminho) { return 'c-' + String(caminho).replace(/^projeto\./, '').replace(/\./g, '-'); }
  function semQuebra(s) { return String(s).replace(/<br>/g, ' '); }

  // opções de um seletor; o valor gravado que não está na lista aparece marcado, para não sumir da tela
  function htmlOpcoes(lista, valor) {
    var ops = lista.map(function (o) { return typeof o === 'string' ? { v: o, t: o } : o; });
    if (!ops.some(function (o) { return o.v === valor; })) { ops.unshift({ v: valor, t: valor === '' ? '—' : valor + ' (fora da lista)' }); }
    return ops.map(function (o) { return '<option value="' + esc(o.v) + '"' + (o.v === valor ? ' selected' : '') + '>' + esc(o.t) + '</option>'; }).join('');
  }

  // atributos da célula: classes e, na tabela empilhável, o rótulo da coluna (no computador nada disso aparece)
  function attrTd(classes, rotulo) {
    var c = classes.filter(Boolean).join(' ');
    return (c ? ' class="' + c + '"' : '') + rotulo;
  }
  function celula(col, x, o, n, erros, problemas) {
    var caminho = o.base + '.' + x.i + '.' + col.k, id = idDe(caminho), def = o.cat[col.k] || {}, v = x.l[col.k], erro = erros[id];
    var rot = esc(semQuebra(col.t) + ', linha ' + (n + 1)), comum = ' id="' + id + '" data-caminho="' + caminho + '" aria-label="' + rot + '"';
    var rotulo = o.empilha ? ' data-rotulo="' + esc(semQuebra(col.t)) + '"' : '', largo = o.empilha && (col.tipo === 'txt' || col.tipo === 'sel') ? 'largo' : '';
    var cls = attrTd([erro ? 'invalido' : '', largo], rotulo);
    if (erro) { problemas.push('Linha ' + (n + 1) + ', ' + semQuebra(col.t) + ': ' + erro); comum += ' aria-invalid="true" title="' + esc(erro) + '"'; }
    // texto e seletor: o valor inteiro na dica, porque a célula estreita corta o que é longo
    else if ((col.tipo === 'txt' || col.tipo === 'sel') && v !== null && v !== undefined && String(v) !== '') { comum += ' title="' + esc(v) + '"'; }
    if (col.so && !col.so(x.l, x.i)) { return '<td class="centro fraco' + (o.empilha ? ' na' : '') + '">—</td>'; }
    if (col.tipo === 'bool') {
      return '<td' + attrTd(['centro'], rotulo) + '><button type="button" class="mini alterna" data-acao="definir" data-caminho="' + caminho + '" data-valor="' + (v ? 'nao' : 'sim') +
        '" data-booleano="1" aria-pressed="' + !!v + '" aria-label="' + rot + '">' + (v ? 'sim' : 'não') + '</button></td>';
    }
    if (col.tipo === 'sel') {
      var val = v === null || v === undefined ? '' : String(v);
      return '<td' + cls + '><select' + comum + ' data-tipo="sel">' + htmlOpcoes(col.opcoes(x.l, x.i), val) + '</select></td>';
    }
    if (col.tipo === 'num') {
      return '<td' + cls + '><input class="num" type="text" inputmode="decimal" autocomplete="off"' + comum + ' data-tipo="' + (def.int ? 'int' : 'num') + '"' + (def.nulo ? ' data-anulavel="1"' : '') + (def.livre ? ' data-negativo="1"' : '') +
        ' value="' + f.campo(v, def.casas) + '" placeholder="' + esc(col.dica || '') + '"></td>';
    }
    return '<td' + cls + '><input type="text" autocomplete="off"' + comum + ' data-tipo="txt" value="' + esc(v === null || v === undefined ? '' : v) + '" placeholder="' + esc(col.dica || '') + '"' +
      (col.lista ? ' list="' + col.lista + '"' : '') + '></td>';
  }

  function montar(o) {
    var erros = (H.ui.U || {}).erros || {}, problemas = [], res = o.resultados || [], wa = o.acoes ? (o.wAcoes || 44) : 0, largura = wa, cols = '', cab = '';
    o.colunas.forEach(function (c) { largura += c.w; });
    res.forEach(function (c) { largura += c.w; });
    // larguras em porcentagem da soma: a tabela ocupa a largura da tela (em px, o layout fixo a deixaria com a soma, maior que a tela)
    function col(w) { return '<col style="width:' + (w / largura * 100).toFixed(3) + '%">'; }
    o.colunas.forEach(function (c) { cols += col(c.w); cab += '<th' + (c.tipo === 'num' ? ' class="num"' : '') + '>' + c.t + '</th>'; });
    res.forEach(function (c) { cols += col(c.w); cab += '<th class="res' + (c.num ? ' num' : '') + '">' + c.t + '</th>'; });
    if (o.acoes) { cols += col(wa); cab += '<th><span class="so-leitor">Ações</span></th>'; }
    var corpo = o.linhas.map(function (x, n) {
      var r = o.res ? o.res(x.i) : null, cls = o.classe ? o.classe(x.i) : '', resumo = '';
      if (o.resumo) {
        // R5: no celular a linha mostra só o resumo e abre ao tocar; a que está aberta ou tem campo com erro fica aberta
        var aberta = (o.aberta && o.aberta(x.i)) || o.colunas.some(function (c) { return !!erros[idDe(o.base + '.' + x.i + '.' + c.k)]; });
        if (!aberta) { cls = (cls ? cls + ' ' : '') + 'linha-recolhida'; }
        resumo = '<td class="resumo-linha so-celular largo"><button type="button" class="resumo-bt" data-acao="' + o.acaoResumo + '" data-i="' + x.i + '" aria-expanded="' + aberta + '">' +
          o.resumo(x, r) + '<span class="resumo-seta" aria-hidden="true">' + (aberta ? '▴' : '▾') + '</span></button></td>';
      }
      return '<tr' + (cls ? ' class="' + cls + '"' : '') + '>' + resumo +
        o.colunas.map(function (c) { return celula(c, x, o, n, erros, problemas); }).join('') +
        res.map(function (c) {
          return '<td' + attrTd(['res', c.num ? 'num' : '', o.empilha && !c.num ? 'largo' : ''], o.empilha ? ' data-rotulo="' + esc(semQuebra(c.t)) + '"' : '') + '>' + (r ? c.v(r, x.i) : '—') + '</td>';
        }).join('') +
        (o.acoes ? '<td class="acoes-linha' + (o.empilha ? ' largo' : '') + '">' + o.acoes(x.i) + '</td>' : '') + '</tr>';
    }).join('');
    if (!o.linhas.length) { corpo = '<tr><td class="vazio" colspan="' + (o.colunas.length + res.length + (o.acoes ? 1 : 0)) + '">' + esc(o.vazio || 'Nenhuma linha.') + '</td></tr>'; }
    return '<div class="tabela-rolo' + (o.rolo ? ' ' + o.rolo : '') + '"><table class="tab-edit' + (o.empilha ? ' empilha' : '') + '" id="' + o.id + '" style="min-width:' + Math.round(largura * 0.88) + 'px"><colgroup>' + cols + '</colgroup><thead><tr>' + cab +
      '</tr></thead><tbody>' + corpo + '</tbody></table></div>' +
      (problemas.length ? '<div class="msg-tela erro" role="alert">' + problemas.map(esc).join('<br>') + '</div>' : '');
  }

  H.ui.tabela = { montar: montar, id: idDe };
})(window.HVAC);

</script>
<script>
/* ==== js/interface/telas_ar.js ==== */
/* Redes HVAC. Telas dos dutos de ar (ESPECIFICACAO_telas_dutos, seção 3): blocos do ar na tela Projeto, Unidades, Dutos
   (rede de ar escolhida e a tabela de trechos) e Trecho de ar. Só montam HTML a partir do projeto (E.projeto.ar e
   E.projeto.unidades) e do resultado do motor (R.dutos = M.dutos.calcular): nenhuma conta é feita aqui. A rede de ar
   mostrada é a de U.rede; o trecho aberto, o de U.duto. Carrega depois de telas.js e de tabela.js. */
(function (H) {
  'use strict';
  var f = H.util.fmt, esc = f.esc, C = H.ui.c, U = H.ui.U, M = H.motor, TAB = H.dados.tab, CAT = H.dados.campos;
  var X = H.ui.redes, T = H.ui.telas, TA = TAB.ar;

  function n(v, casas) { return f.num(v, casas); }
  function numero(v) { return typeof v === 'number' && isFinite(v); }
  function ch(id) { return M.rede.chave(id); }
  function nota(html) { return '<div class="fraco em-uso">' + html + '</div>'; }
  var NOME_LADO = { insuflamento: 'Insuflamento', retorno: 'Retorno' };
  var NOME_FORMA = { circular: 'circular', retangular: 'retangular', oval: 'oval', flexivel: 'flexível' };

  // ------------------------------------------------------------ apoio comum às telas do ar
  // rede de ar escolhida: { i, e (entrada), r (resultado do motor) }; null sem redes
  X.redeAr = function (E, R) {
    var redes = (E.projeto.ar || {}).redes || [], i = Math.max(0, Math.min(parseInt(U.rede, 10) || 0, redes.length - 1));
    if (!redes.length || !R.dutos || !R.dutos.redes[i]) { return null; }
    return { i: i, e: redes[i], r: R.dutos.redes[i] };
  };
  // rede que pode ser mostrada como válida: algum trecho e nenhum erro de dados
  X.validoAr = function (r) { return !!r && r.contagem.trechos > 0 && r.contagem.dados === 0; };
  X.textoSituacaoAr = function (r) {
    if (!r) { return 'sem rede de ar'; }
    var c = r.contagem;
    if (c.trechos === 0) { return 'sem trechos'; }
    if (c.dados) { return '⚠ ' + c.dados + ' com erro de dados' + (c.revisar ? ' · ' + c.revisar + ' a revisar' : ''); }
    return c.revisar ? c.revisar + ' a revisar' : 'OK';
  };
  // dimensão por extenso: "Ø 315", "450 × 300", "400 × 200 oval"
  X.dimAr = function (forma, d, a, b) {
    if (M.secao.circular(forma)) { return numero(d) ? 'Ø ' + n(d, 0) + (forma === 'flexivel' ? ' flex.' : '') : '—'; }
    if (forma === 'retangular' || forma === 'oval') { return numero(a) && numero(b) ? n(a, 0) + ' × ' + n(b, 0) + (forma === 'oval' ? ' oval' : '') : '—'; }
    return '—';
  };
  // a dimensão do trecho já é a sugerida?
  X.sugestaoIgual = function (t) {
    var s = t.sugestao;
    if (!s) { return false; }
    return M.secao.circular(t.forma) ? t.d === s.d : (t.a === s.a && t.b === s.b);
  };
  X.seloSituacaoAr = function (t) {
    var s = t.situacao || '', cls = s === 'OK' ? 'ok' : (s === 'REVISAR' ? 'revisar' : (s === '' ? 'vazia' : 'dados'));
    return '<span class="sit ' + cls + '"' + (t.revisar ? ' title="' + esc(t.revisar) + '"' : '') + '>' + esc(s === '' ? 'sem ID: linha ignorada' : s) + '</span>';
  };
  var AVISO_CURTO = { paMFora: 'perda por metro', vazaoTronco: 'vazão do tronco', bocaSemSaida: 'boca sem saída', ruido: 'ruído', aspecto: 'razão de aspecto',
                      flexivelForaDaBoca: 'flexível fora da boca', flexivelLongo: 'flexível longo', flexivelComprimido: 'flexível comprimido',
                      flexivelCompressaoAlta: 'compressão alta', flexivelEstimado: 'flexível estimado', pecaTabela: 'peça de tabela', transicao: 'Reynolds baixo' };
  function avisosCurtos(t) {
    var a = t.avisos || [];
    if (!a.length) { return ''; }
    var dica = a.map(function (x) { return x.texto; }).join(' '), curto = a.length === 1 ? 'aviso: ' + (AVISO_CURTO[a[0].tipo] || a[0].tipo) : a.length + ' avisos';
    return '<span class="aviso-linha" title="' + esc(dica) + '">' + esc(curto) + '</span>';
  }
  function critica(r, t) { var ld = r.lados[t.lado]; return !!ld && ld.iCritica === t.i; }
  // dimensão do trecho no cartão do celular (R2): "Ø 315 mm", "450 × 300 mm", "400 × 200 mm oval"; sem dimensão, não aparece
  function dimCartao(l) {
    var circ = M.secao.circular(l.forma), ab = l.forma === 'retangular' || l.forma === 'oval';
    if (circ && numero(l.d)) { return { r: 'Seção', v: 'Ø ' + n(l.d, 0), u: 'mm' + (l.forma === 'flexivel' ? ' flex.' : '') }; }
    if (ab && numero(l.a) && numero(l.b)) { return { r: 'Seção', v: n(l.a, 0) + ' × ' + n(l.b, 0), u: 'mm' + (l.forma === 'oval' ? ' oval' : '') }; }
    return { r: 'Seção', v: '' };
  }
  function origemVazao(t) {
    return t.origemQ === 'informada' ? 'informada no trecho' : (t.origemQ === 'calor' ? 'do calor sensível da boca, pelo ΔT de insuflamento da rede' : (t.origemQ === 'soma' ? 'soma dos trechos a jusante' : '—'));
  }

  // equipamento existente (DU1 e DU2): a comparação da vazão e da pressão, em lista; folha = true na folha do memorial
  X.comparaEquipAr = function (r, folha) {
    var V = r.ventilador, EQ = V.equipamento, L = [], cls = folha ? 'nota' : 'fraco';
    if (!EQ || (EQ.q === null && EQ.pDisp === null)) {
      return folha ? '' : '<p class="fraco" style="margin-top:8px">Com a vazão nominal e a pressão estática externa disponível do catálogo do equipamento que fica, o app compara a rede nova com ele.</p>';
    }
    if (EQ.q !== null) {
      L.push(EQ.difVazao === null ? 'Vazão: sem comparação (' + esc(V.motivoQ || 'vazão do ventilador sem valor') + ').'
        : 'Vazão do ventilador ' + n(V.q * 3600, 1) + ' m³/h × nominal ' + n(EQ.q * 3600, 1) + ' m³/h: ' + (EQ.difVazao >= 0 ? '+' : '−') + n(Math.abs(EQ.difVazao) * 100, 1) + ' % ' +
          (Math.abs(EQ.difVazao) > EQ.tolPct / 100 ? '<span class="sit revisar">fora da tolerância de ' + f.campo(EQ.tolPct, 0) + ' %</span>' : '<span class="sit ok">dentro da tolerância de ' + f.campo(EQ.tolPct, 0) + ' %</span>'));
    }
    if (EQ.pDisp !== null) {
      L.push(EQ.folga === null ? 'Pressão: sem comparação (' + esc(V.motivoP || 'pressão do ventilador sem valor') + ').'
        : 'Pressão ' + (EQ.base === 'estatica' ? 'estática' : 'total') + ' exigida ' + n(EQ.pExigida, 1) + ' Pa × disponível ' + n(EQ.pDispCorr, 1) + ' Pa no ar da rede (' +
          n(EQ.pDisp, 1) + ' Pa no catálogo × ' + n(EQ.rho, 4) + ' ÷ ' + n(EQ.rhoCat, 3) + ' kg/m³): ' +
          (EQ.folga >= 0 ? '<span class="sit ok">folga de ' + n(EQ.folga, 1) + ' Pa</span>' : '<span class="sit revisar">déficit de ' + n(-EQ.folga, 1) + ' Pa</span>') +
          (EQ.base === 'total' ? ' (sem a velocidade na descarga, a comparação usa a pressão total, a favor da segurança)' : ''));
    }

      (y.forma === '' && linhasS.length ? '<p class="msg-tela alerta">Trecho sem forma: sem a seção não há pressão de velocidade para as singularidades.</p>' : '');

    // bloco 3: componentes
    var linhasC = [], baseC = baseR + 'componentes';
    rd.componentes.forEach(function (s, j) { if (chave !== '' && ch(s.trecho) === chave) { linhasC.push({ i: j, l: s }); } });
    var tabC = G.montar({
      id: 'tab-comp', base: baseC, linhas: linhasC, cat: CAT.arComponente,
      colunas: [
        { t: 'Descrição', k: 'descricao', tipo: 'txt', w: 210 },
        { t: 'Tag ou modelo', k: 'tag', tipo: 'txt', w: 130 },
        { t: 'ΔP de catálogo<br>Pa', k: 'dp', tipo: 'num', w: 90 },
        { t: 'Vazão de catálogo<br>m³/h', k: 'qCat', tipo: 'num', w: 100 },
        { t: 'Observação', k: 'obs', tipo: 'txt', w: 190 }
      ],
      resultados: [
        { t: 'Critério aplicado', w: 220, v: function (s) { return s.dpCat === null ? '<span class="sit dados">sem ΔP</span>' : (s.qCat === null ? 'ΔP de catálogo' : 'ΔP de catálogo × (vazão ÷ vazão de catálogo)²'); } },
        { t: 'ΔP adotado<br>Pa', w: 80, num: true, v: function (s) { return n(s.dp, 2); } }
      ],
      res: function (j) { return r.componentes[j]; },
      acoes: function (j) { return '<button type="button" class="mini perigo" data-acao="comp-del" data-i="' + j + '" title="Excluir o componente" aria-label="Excluir o componente">×</button>'; },
      vazio: 'Nenhum componente neste trecho.',
      empilha: true
    });
    var b3 = tabC + '<div class="acoes barra-tab"><button type="button" class="botao" data-acao="comp-novo" data-i="' + i + '"' + (chave !== '' ? '' : ' disabled') + '>Novo componente</button>' +
      '<span class="fraco">ΔP dos componentes no trecho = ' + n(y.dpComp, 2) + ' Pa</span></div>' +
      '<p class="fraco">Difusor, grelha, registro, atenuador, filtro, serpentina: o ΔP é o do catálogo. Com a vazão de catálogo, o ΔP é corrigido pelo quadrado da razão das vazões.</p>';

    // bloco 4: resultado do trecho (cada valor abre a conta na gaveta)
    function calc(rot, valor, un, k) { return C.calculado({ rotulo: rot, valor: valor, unidade: un, chave: 'd.' + ri + '.' + i + '.' + k }); }
    var classe = TA.classe(cri.classePressao), vMaxC = classe && numero(classe.vMax) ? classe.vMax : null, ruido = TA.limiteRuido(cri.posicaoDuto, cri.nc);
    var limR = ruido ? (circ ? ruido.circular : ruido.retangular) : null, temGeo = numero(y.area);
    var b4 = (y.situacao.indexOf('DADOS') === 0 ? '<p class="msg-tela erro">' + esc(y.situacao) + '. Corrija o dado para ver o resultado deste trecho' + (y.consistencia.indexOf('ciclo') >= 0 ? ' (o montante leva de volta ao próprio trecho)' : '') + '.</p>' : '') +
      (primeira || chave === '' ? '' : '<p class="msg-tela erro">Há outro trecho, antes deste, com o mesmo ID: as singularidades e os componentes valem para o primeiro.</p>') +
      '<div class="grade">' +
        (temGeo ? calc('Área da seção', n(y.area, 4), 'm²', 'area') + calc('Diâmetro equivalente De', n(y.de, 1), 'mm', 'de') + calc('Diâmetro hidráulico Dh', n(y.dh, 1), 'mm', 'dh') +
          calc('Velocidade real', n(y.v, 2), 'm/s', 'v') + calc('Pressão de velocidade', n(y.pv, 2), 'Pa', 'pv') + calc('Velocidade no circular equivalente', n(y.ve, 2), 'm/s', 've') +
          calc('Reynolds', n(y.re, 0), y.regime || '', 're') + calc('Fator de atrito f', n(y.f, 5), '', 'f') + calc('Perda por metro', n(y.paM, 2), 'Pa/m', 'paM') +
          calc('ΔP de atrito', n(y.dpAtrito, 2), 'Pa', 'dpAtrito') : '') +
        calc('ΔP das singularidades', n(y.dpSing, 2), 'Pa', 'dpSing') + calc('ΔP dos componentes', n(y.dpComp, 2), 'Pa', 'dpComp') +
        calc('ΔP do trecho', n(y.dp, 2), 'Pa', 'dp') + calc('ΔP acumulado', n(y.acumulado, 2), 'Pa', 'acumulado') +
        (y.boca && ok ? calc('Excesso da boca', n(y.excesso, 2), 'Pa', 'excesso') : '') +
        (temGeo ? calc('Superfície de duto', n(y.superficie, 2), 'm²', 'superficie') : '') + '</div>' +
      (y.estimativa && numero(y.paM) ? '<p class="msg-tela alerta">Perda do flexível <b>estimada</b>: sem o dado do fabricante, o app usa a rugosidade de ' + f.campo(y.eps, 1) + ' mm e o fator de correção da compressão.</p>' : '') +
      '<table class="verif"><thead><tr><th>Verificação</th><th class="num">Valor</th><th class="num">Limite</th><th>Resultado</th></tr></thead><tbody>' +
        '<tr><td>Velocidade máxima da classe de pressão de ' + n(cri.classePressao, 0) + ' Pa</td><td class="num">' + n(y.v, 2) + ' m/s</td><td class="num">' + (vMaxC === null ? 'sem limite' : n(vMaxC, 1) + ' m/s') + '</td><td>' +
          (numero(y.v) && vMaxC !== null ? (y.v > vMaxC ? 'acima: REVISAR' : 'OK') : '—') + '</td></tr>' +
        '<tr><td>Perda por metro (aviso)</td><td class="num">' + n(y.paM, 2) + ' Pa/m</td><td class="num">' + f.campo(cri.paMin, 2) + ' a ' + f.campo(cri.paMax, 2) + ' Pa/m</td><td>' +
          (numero(y.paM) && y.L > 0 ? (y.paM < cri.paMin ? 'abaixo da faixa' : (y.paM > cri.paMax ? 'acima da faixa' : 'OK')) : '—') + '</td></tr>' +
        '<tr><td>Velocidade pelo ruído (aviso): ' + esc(ruido ? ruido.posicao : cri.posicaoDuto) + ', NC ' + esc(String(cri.nc)) + ', duto ' + (circ ? 'circular' : 'retangular') + '</td><td class="num">' + n(y.v, 2) + ' m/s</td><td class="num">' +
          (numero(limR) ? n(limR, 1) + ' m/s' : 'sem limite') + '</td><td>' + (numero(y.v) && numero(limR) ? (y.v > limR ? 'acima do recomendado' : 'OK') : '—') + '</td></tr>' +
        (ladoAB ? '<tr><td>Razão de aspecto (aviso)</td><td class="num">' + n(y.aspecto, 2) + '</td><td class="num">até ' + f.campo(cri.aspectoMax, 1) + '</td><td>' + (numero(y.aspecto) ? (y.aspecto > cri.aspectoMax ? 'acima' : 'OK') : '—') + '</td></tr>' : '') +
        '<tr class="total"><td>Situação do trecho</td><td></td><td></td><td>' + X.seloSituacaoAr(y) + '</td></tr></tbody></table>' +
      (y.revisar ? '<p class="msg-tela alerta">' + esc(y.revisar) + '</p>' : '') +
      (y.avisos.length ? '<ul class="avisos">' + y.avisos.map(function (a) { return '<li><b>Aviso:</b> ' + esc(a.texto) + '</li>'; }).join('') + '</ul>' : '');

    // bloco 5: dimensão sugerida
    var s = y.sugestao, ld = r.lados[y.lado], b5;
    if (s) {
      b5 = '<div class="grade">' +
        C.calculado({ rotulo: 'Dimensão sugerida', valor: X.dimAr(t.forma, s.d, s.a, s.b), unidade: 'mm', chave: 'd.' + ri + '.' + i + '.sug' }) +
        C.calculado({ rotulo: 'Velocidade com a sugerida', valor: n(s.v, 2), unidade: 'm/s', chave: 'd.' + ri + '.' + i + '.sug' }) +
        C.calculado({ rotulo: 'Perda por metro com a sugerida', valor: n(s.paM, 2), unidade: 'Pa/m', chave: 'd.' + ri + '.' + i + '.sug' }) + '</div>' +
        '<p class="fraco">Alvo: ' + (numero(s.vAlvo) ? 'velocidade de até ' + f.campo(s.vAlvo, 1) + ' m/s (primeiro trecho do lado)' : n(s.alvo, 2) + ' Pa/m' + (numero(s.deExato) ? ' · diâmetro equivalente exato de ' + n(s.deExato, 1) + ' mm' : '')) +
          ' · diâmetro equivalente da sugerida: ' + n(s.de, 1) + ' mm' + (ladoAB ? ' · razão de aspecto ' + n(s.aspecto, 2) + (s.aspectoAcima ? ' (acima do máximo: aumente o lado fixo)' : '') : '') + '. Dimensão atual: ' + esc(X.dimAr(t.forma, y.d, y.a, y.b)) + ' mm.</p>' +
        '<div class="acoes">' + (X.sugestaoIgual(y) ? '<span class="msg-tela bom" data-g="sug-igual">A dimensão do trecho já é a sugerida.</span>'
          : '<button type="button" class="botao prim" data-acao="duto-aplicar" data-i="' + i + '">Aplicar a sugestão a este trecho</button>') + '</div>';
    } else {
      b5 = '<p class="fraco" data-g="sem-sugestao">Sem dimensão sugerida' + (y.motivoSugestao ? ': ' + esc(y.motivoSugestao) : (ld && ld.motivoAlvo ? ': ' + esc(ld.motivoAlvo) : '')) + '.</p>';
    }

    var ids = {}, lista = '';
    rd.trechos.forEach(function (z, j) { var k = ch(z.id); if (j !== i && k !== '' && !ids[k]) { ids[k] = true; lista += '<option value="' + esc(z.id) + '">'; } });
    return '<div class="rede">' + C.cabeca('Dutos de ar · rede ' + (rd.id || '(sem ID)') + ' · trecho ' + (i + 1) + ' de ' + nT, 'Trecho ' + (t.id || '(sem ID)'), esc(t.descricao || '')) +
      '<div class="acoes barra-tab"><a class="botao" href="#/dutos">← Dutos de ar</a>' +
        (i > 0 ? '<a class="botao leve" href="#/duto/' + (i - 1) + '">trecho anterior</a>' : '') + (i < nT - 1 ? '<a class="botao leve" href="#/duto/' + (i + 1) + '">próximo trecho</a>' : '') +
        '<span style="margin-left:auto">' + (y.lado ? '<span class="fraco">' + NOME_LADO[y.lado] + (y.boca ? ' · boca' : '') + (ok && y.boca && critica(r, y) ? ' crítica' : '') + '</span> ' : '') + X.seloSituacaoAr(y) + '</span></div>' +
      X.maisAcoes('duto', i, nT) +
      '<div class="cartao"><h2>1 · Vazão e seção</h2>' + b1 + '</div>' +
      '<div class="cartao"><h2>2 · Singularidades</h2>' + b2 + '</div>' +
      '<div class="cartao"><h2>3 · Componentes</h2>' + b3 + '</div>' +
      '<div class="cartao"><h2>4 · Resultado do trecho</h2><p class="fraco" style="margin-bottom:10px">Cada valor abre a conta, passo a passo.' +
        (t.forma !== '' && !circ ? ' O atrito do duto ' + NOME_FORMA[t.forma] + ' é calculado no circular equivalente (De); a velocidade real vale para os limites e para as singularidades.' : '') + '</p>' + b4 + '</div>' +
      '<div class="cartao"><h2>5 · Dimensão sugerida</h2>' + b5 + '</div>' +
      '<datalist id="lista-ids-ar">' + lista + '</datalist></div>';
  };
})(window.HVAC);

</script>
<script>
/* ==== js/interface/contas.js ==== */
/* Redes HVAC. Contas da gaveta: o passo a passo de cada valor calculado das telas Projeto, Trecho e Resultados.
   Chaves: "fl.<grandeza>" (fluido), "t.<índice do trecho>.<grandeza>" e "b.<grandeza>" (bomba). Os números vêm do resultado do motor
   (M.agua.calcular); aqui só se escreve a conta, com os mesmos valores. */
(function (H) {
  'use strict';
  var f = H.util.fmt, C = H.ui.c, M = H.motor, TAB = H.dados.tab;
  var X = H.ui.redes = H.ui.redes || {};

  // a Eq. 4 do cap. 22 vem impressa com 1,74 e 18,7; a forma do motor (3,7 e 2,51) é a que o cap. 21 imprime
  var F_ATRITO = 'ASHRAE Fundamentals 2021 (SI), cap. 22, Eq. 1 (Darcy-Weisbach) e Eq. 4 (Colebrook), p. 22.5 (PDF 641); ' +
    'Colebrook escrita com 3,7 e 2,51 (forma equivalente): cap. 21, Eq. 19, p. 21.6 (PDF 610)';
  var F_DARCY = 'ASHRAE Fundamentals 2021 (SI), cap. 22, Eq. 1 (Darcy-Weisbach), p. 22.5 (PDF 641)';
  var F_NOVO = 'NBR 16401-1:2024, 12.2.4 (p. 33, PDF 43)';
  var F_ENV = 'HDR Design Guide (1981), citado em ASHRAE Fundamentals 2021 (SI), cap. 22, p. 22.23 (PDF 659)';
  var F_NBR = 'NBR 16401-1:2024, 12.2.8 (p. 33, PDF 43)';
  var F_AUT = 'ASHRAE HVAC Systems and Equipment 2016 (SI), cap. 47, p. 47.8 (PDF 804): o diferencial do ramal inclui o dispositivo de balanceamento. ' +
    'Faixa de 0,30 a 0,50 (para razão de perda de carga de 2:1 entre ramal e prumada): cap. 13, p. 13.15 (PDF 273)';

  function n(v, casas) { return f.num(v, casas); }
  function numero(v) { return typeof v === 'number' && isFinite(v); }
  function p(passo, formula, valores, resultado, fonte) { return { passo: passo, formula: formula, valores: valores, resultado: resultado, fonte: fonte }; }

  // ------------------------------------------------------------ fluido
  function contaFluido(g, E, R) {
    var pr = R.premissas, fl = pr.fluido, fe = E.projeto.fluido, sobre = 'Projeto · ' + X.nomeFluido(fe), L = [];
    var base = fe.baseT === 'manual' ? 'manual' : (fe.baseT === 'media' ? 'média de alimentação e retorno' : 'alimentação');
    if (g === 't') {
      L.push(p('Base escolhida', '', '', base, 'Premissa de projeto: a água mais fria é mais viscosa, do lado conservador'));
      L.push(fe.baseT === 'media' ? p('Temperatura de cálculo', '(T alimentação + T retorno) ÷ 2', '(' + n(fl.tAlim, 1) + ' + ' + n(fl.tRet, 1) + ') ÷ 2', n(fl.tCalc, 2) + ' °C')
        : p('Temperatura de cálculo', fe.baseT === 'manual' ? 'valor informado' : 'T alimentação', '', n(fl.tCalc, 2) + ' °C'));
      return { sobre: sobre, titulo: 'Temperatura de cálculo', valor: n(fl.tCalc, 2) + ' °C', html: C.passos(L) };
    }
    if (g === 'dT') {
      L.push(p('ΔT de projeto', 'T retorno − T alimentação', n(fl.tRet, 1) + ' − ' + n(fl.tAlim, 1), n(fl.dT, 2) + ' °C', 'Converte a carga em kW de cada terminal em vazão'));
      return { sobre: sobre, titulo: 'ΔT de projeto', valor: n(fl.dT, 2) + ' °C', html: C.passos(L) };
    }
    if (g === 'tcong') {
      var cg = TAB.congelamento[TAB.chave(fl.nome, String(fl.concentracao))];
      L.push(p('Temperatura de congelamento', fl.nome === 'Água' ? 'água pura' : 'tabela, pela concentração em volume', '', fl.tCong === null ? '—' : n(fl.tCong, 1) + ' °C', cg ? cg.fonte : ''));
      if (fl.margemCong !== null) { L.push(p('Folga da alimentação', 'T alimentação − T congelamento', n(fl.tAlim, 1) + ' − (' + n(fl.tCong, 1) + ')', n(fl.margemCong, 1) + ' °C')); }
      return { sobre: sobre, titulo: 'Temperatura de congelamento', valor: fl.tCong === null ? '—' : n(fl.tCong, 1) + ' °C', html: C.passos(L) };
    }
    if (!pr.ok) { return null; }
    var bloco = TAB.fluidos[TAB.chave(fl.nome, String(fl.concentracao))] || [], a = null, b = null;
    bloco.forEach(function (x) { if (x.t === fl.t1) { a = x; } if (x.t === fl.t2) { b = x; } });
    if (!a || !b) { return null; }
    var peso = p('Peso da interpolação', 'w = (T − T1) ÷ (T2 − T1)', '(' + n(fl.tCalc, 2) + ' − ' + n(a.t, 1) + ') ÷ (' + n(b.t, 1) + ' − ' + n(a.t, 1) + ')', n(fl.w, 4), 'Fora da faixa da tabela o app acusa erro: não extrapola');
    var linhas = function (rot, k, casas, un) {
      return p('Linhas da tabela', '', '', 'T1 = ' + n(a.t, 1) + ' °C: ' + n(a[k], casas) + ' ' + un + ' · T2 = ' + n(b.t, 1) + ' °C: ' + n(b[k], casas) + ' ' + un, fl.fonte);
    };
    if (g === 'rho') {
      L = [linhas('ρ', 'rho', 2, 'kg/m³'), peso, p('Massa específica', 'ρ = ρ1 + w · (ρ2 − ρ1)', n(a.rho, 2) + ' + ' + n(fl.w, 4) + ' · (' + n(b.rho, 2) + ' − ' + n(a.rho, 2) + ')', n(fl.rho, 2) + ' kg/m³')];
      return { sobre: sobre, titulo: 'Massa específica ρ', valor: n(fl.rho, 2) + ' kg/m³', html: C.passos(L) };
    }
    if (g === 'cp') {
      L = [linhas('cp', 'cp', 4, 'kJ/(kg·°C)'), peso, p('Calor específico', 'cp = cp1 + w · (cp2 − cp1)', n(a.cp, 4) + ' + ' + n(fl.w, 4) + ' · (' + n(b.cp, 4) + ' − ' + n(a.cp, 4) + ')', n(fl.cp, 4) + ' kJ/(kg·°C)')];
      return { sobre: sobre, titulo: 'Calor específico cp', valor: n(fl.cp, 4) + ' kJ/(kg·°C)', html: C.passos(L) };
    }
    var mu = [linhas('μ', 'mu', 4, 'mPa·s'), peso,
      p('Viscosidade dinâmica', 'ln μ = ln μ1 + w · (ln μ2 − ln μ1)', 'interpolação no logaritmo, entre ' + n(a.mu, 4) + ' e ' + n(b.mu, 4), n(fl.mu * 1000, 4) + ' mPa·s', 'A viscosidade cai depressa com a temperatura: a interpolação é feita no logaritmo')];
    if (g === 'mu') { return { sobre: sobre, titulo: 'Viscosidade dinâmica μ', valor: n(fl.mu * 1000, 4) + ' mPa·s', html: C.passos(mu) }; }
    if (g === 'nu') {
      mu.push(p('Viscosidade cinemática', 'ν = μ ÷ ρ', n(fl.mu * 1000, 4) + ' × 10⁻³ ÷ ' + n(fl.rho, 2), n(fl.nu * 1e6, 4) + ' mm²/s (× 10⁻⁶ m²/s)'));
      return { sobre: sobre, titulo: 'Viscosidade cinemática ν', valor: n(fl.nu * 1e6, 4) + ' mm²/s', html: C.passos(mu) };
    }
    return null;
  }

  // ------------------------------------------------------------ trecho
  function passosVazao(t, i, R) {
    var pr = R.premissas, est = R.estrutura, L = [];
    if (t.vazao !== null) { return [p('Vazão informada', 'valor digitado no trecho', '', n(t.q, 3) + ' m³/h', 'Tem prioridade sobre a carga e sobre a soma dos ramais')]; }
    if (t.kW !== null) {
      return [p('Vazão pela carga', 'Q = carga × 3 600 ÷ (ρ · cp · ΔT)', n(t.kW, 3) + ' × 3 600 ÷ (' + n(pr.rho, 2) + ' × ' + n(pr.cp, 4) + ' × ' + n(pr.dT, 2) + ')', n(t.q, 3) + ' m³/h',
        'ρ em kg/m³, cp em kJ/(kg·°C) e ΔT em °C, do fluido do projeto')];
    }
    var filhos = est.filhos[est.chave[i]] || [], soma = 0;
    filhos.forEach(function (j) {
      var x = R.trechos[j];
      if (numero(x.q)) { soma += x.q; }
      L.push(p('Ramal ' + x.id, '', '', n(x.q, 3) + ' m³/h'));
    });
    if (!filhos.length) { L.push(p('Sem vazão', 'trecho sem vazão informada, sem carga e sem ramais', '', '—')); return L; }
    L.push(p('Soma dos ramais', '', '', n(soma, 3) + ' m³/h'));
    L.push(p('Vazão do trecho', 'soma × fator de diversificação', n(soma, 3) + ' × ' + n(t.fd === null ? 1 : t.fd, 3), n(t.q, 3) + ' m³/h', t.fd === null ? 'Fator de diversificação vazio vale 1' : 'Fator de diversificação informado no trecho'));
    return L;
  }
  function passoTubo(t) {
    var tb = TAB.tubo(t.especificacao, t.dn);
    return p('Diâmetro interno e área', 'Di = De − 2 · e ; A = π · Di² ÷ 4', tb ? n(tb.de, 2) + ' − 2 × ' + n(tb.e, 2) + ' mm' : '', n(t.di, 2) + ' mm · ' + n(t.area * 1e6, 1) + ' mm²', tb ? tb.fonte : '');
  }
  function passoV(t) { return p('Velocidade', 'v = Q ÷ A', '(' + n(t.q, 3) + ' ÷ 3 600) ÷ ' + n(t.area, 6) + ' m²', n(t.v, 3) + ' m/s'); }
  function passoRe(t, pr) { return p('Reynolds', 'Re = v · Di ÷ ν', n(t.v, 3) + ' × ' + n(t.di / 1000, 5) + ' ÷ ' + n(pr.nu * 1e6, 4) + ' × 10⁻⁶', n(t.re, 0) + ' (' + t.regime + ')', 'Laminar abaixo de 2 000 e transição de 2 000 a 10 000: ASHRAE Fundamentals 2021 (SI), cap. 3, p. 3.7 (PDF 56)'); }
  function passosF(t) {
    var a = t.atrito, L = [];
    if (!a) { return [p('Fator de atrito', 'sem Reynolds ou sem rugosidade', '', '—')]; }
    if (t.re < M.atrito.RE_LAMINAR) { return [p('Fator de atrito (laminar)', 'f = 64 ÷ Re', '64 ÷ ' + n(t.re, 0), n(t.f, 5))]; }
    var esp = TAB.espec(t.especificacao);
    L.push(p('Rugosidade relativa', 'ε ÷ Di', X.rugosidade(t.eps) + ' ÷ ' + n(t.di, 2), n(t.rr, 6), t.epsManual !== null ? 'ε informado pelo projetista' : (esp ? esp.fonteEps : '')));
    L.push(p('Partida (Swamee-Jain)', 'x0 = −2 · log10(ε ÷ (3,7 · Di) + 5,74 ÷ Re^0,9)', '', n(a.x0, 6), 'x = 1 ÷ √f'));

    if (c && c.html && c.html.indexOf('nota-gaveta') < 0) { c.html += NOTA_GAVETA; }
