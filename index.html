  };
})(window.HVAC);

</script>
<script>
/* ==== js/interface/resultados.js ==== */
/* Redes HVAC. Tela Resultados (especificação A0, seção 4) e as tabelas de resultado que a folha do Memorial repete:
   bomba, circuito crítico, trechos, balanceamento, menor DN, sensibilidade de DN e avisos. Só monta HTML a partir do
   resultado do motor (R = M.agua.calcular); nenhuma conta é feita aqui. Com erro de dados (X.valido(R) falso) a tela diz
   o que falta e não mostra bomba nem circuito crítico. Carrega depois de telas.js e de contas.js. */
(function (H) {
  'use strict';
  var f = H.util.fmt, esc = f.esc, C = H.ui.c, M = H.motor, TAB = H.dados.tab, CAT = H.dados.campos, T = H.ui.telas, X = H.ui.redes;

  function n(v, casas) { return f.num(v, casas); }
  function numero(v) { return typeof v === 'number' && isFinite(v); }
  function indice(R, id) { var i = R.estrutura.primeira[M.rede.chave(id)]; return i === undefined ? -1 : i; }
  // número marcado para a conferência (data-g); na tela, com chave, vira botão que abre a conta na gaveta
  function num(g, texto, chave) {
    if (!chave) { return '<span data-g="' + esc(g) + '">' + esc(texto) + '</span>'; }
    return '<button type="button" class="num-conta" data-acao="conta" data-chave="' + esc(chave) + '" title="Ver a conta" data-g="' + esc(g) + '">' + esc(texto) + '</button>';
  }
  // tabela só de leitura: cols = [{ t: cabeçalho, num: bool, v: function (linha, i) -> HTML }]
  function tabela(classe, cols, linhas, rodape, classeLinha) {
    return '<div class="tabela-rolo"><table class="' + classe + '"><thead><tr>' +
      cols.map(function (c) { return '<th' + (c.num ? ' class="num"' : '') + '>' + c.t + '</th>'; }).join('') + '</tr></thead><tbody>' +
      linhas.map(function (l, i) {
        var cl = classeLinha ? classeLinha(l, i) : '';
        return '<tr' + (cl ? ' class="' + cl + '"' : '') + '>' + cols.map(function (c) { return '<td' + (c.num ? ' class="num"' : '') + '>' + c.v(l, i) + '</td>'; }).join('') + '</tr>';
      }).join('') + (rodape || '') + '</tbody></table></div>';
  }
  function sit(t) { return X.seloSituacao(t); }

  // ------------------------------------------------------------ o que falta (resultado que não pode ser mostrado)
  function oQueFalta(R) {
    var L = [], pr = R.premissas;
    if (!pr.ok) { L.push({ t: 'Fluido: ' + String(pr.erro).replace(/^ERRO:\s*/, ''), href: '#/projeto', onde: 'Abrir o Projeto' }); }
    if (R.contagem.trechos === 0) { L.push({ t: 'A rede não tem nenhum trecho com ID', href: '#/rede', onde: 'Abrir a Rede' }); }
    if (pr.ok) {
      R.trechos.forEach(function (t, i) {
        if (t.situacao.indexOf('DADOS') === 0) { L.push({ t: 'Trecho ' + t.id + ': ' + t.consistencia, href: '#/trecho/' + i, onde: 'Abrir o trecho ' + t.id }); }
      });
    }
    return L;
  }
  function cartaoFalta(R, folha) {
    var L = oQueFalta(R);
    return '<div class="' + (folha ? 'falta-f' : 'cartao') + '" data-g="falta"><h2>O que falta para calcular</h2>' +
      '<p class="' + (folha ? 'alerta-f' : 'msg-tela erro') + '">Enquanto houver erro de dados, a bomba e o circuito crítico não valem e não são mostrados.</p><ul class="lista-falta">' +
      L.map(function (x) { return '<li>' + esc(x.t) + '.' + (folha ? '' : ' <a href="' + x.href + '">' + esc(x.onde) + '</a>') + '</li>'; }).join('') + '</ul></div>';
  }

  // ------------------------------------------------------------ bomba
  // linha "em uso" de um parâmetro da bomba ou de um critério: valor, padrão e o selo da fonte
  function emUso(grupo, k, valor) {
    var def = CAT[grupo][k], q = def.pct ? 100 : 1, un = def.un ? ' ' + def.un : '', igual = valor === def.p;
    return esc(def.rotulo) + ': <b>' + f.campo(valor * q, def.casas) + esc(un) + '</b> ' +
      (igual ? '(padrão) ' + X.seloFonte(def.fonte) : '(padrão ' + f.campo(def.p * q, def.casas) + esc(un) + ') ' + C.selo('alterado', 'alterado'));
  }
  function cartaoBomba(R) {
    var b = R.bomba, pr = R.premissas, dentro = numero(b.relacao) && b.relacao <= M.agua.LIMITE_REL;
    function calc(rot, valor, un, k) { return C.calculado({ rotulo: rot, valor: valor, unidade: un, chave: 'b.' + k }); }
    return '<div class="cartao" data-g="bomba"><h2>Bomba</h2><p class="fraco" style="margin-bottom:10px">Cada valor abre a conta, passo a passo.</p><div class="grade">' +
      calc('Vazão', n(b.q, 3), 'm³/h', 'q') + calc('ΔP do circuito crítico', n(b.dpCritico, 3), 'kPa', 'dpCritico') +
      calc('ΔP de projeto (com a margem)', n(b.dpProjeto, 3), 'kPa', 'dpProjeto') + calc('Altura manométrica', n(b.h, 3), 'mca', 'h') +
      calc('Potência hidráulica', n(b.pHid, 3), 'kW', 'pHid') + calc('Potência no eixo', n(b.pEixo, 3), 'kW', 'pEixo') + calc('Potência elétrica', n(b.pEl, 3), 'kW', 'pEl') +
      calc('Energia térmica transportada', n(b.qt, 2), 'kW', 'qt') + calc('Relação de bombeamento', n(b.relacao, 4), 'kW/kW', 'relacao') + '</div>' +
      (numero(b.relacao) ? '<p class="msg-tela ' + (dentro ? 'bom' : 'alerta') + '" data-g="relacao">Relação de bombeamento de ' + n(b.relacao, 4) + ' kW/kW: ' + (dentro ? 'dentro do' : 'acima do') +
        ' valor de ' + n(M.agua.LIMITE_REL, 2) + ' kW/kW, que a norma chama de desejável, porém nem sempre viável. ' + (dentro ? '' : 'Vale avaliar a rede; a situação dos trechos não muda. ') +
        X.seloFonte(X.F_RELACAO) + '</p>' : '') +
      '<ul class="em-uso-lista"><li>' + emUso('bomba', 'margem', pr.margem) + '</li><li>' + emUso('bomba', 'rendBomba', pr.rendBomba) + '</li><li>' + emUso('bomba', 'rendMotor', pr.rendMotor) + '</li></ul>' +
      '<p class="fraco">Altura em metros de coluna do fluido do projeto. Para alterar a margem e os rendimentos: <a href="#/projeto">Projeto</a>, bloco Bomba.</p></div>';
  }

  // ------------------------------------------------------------ bomba existente (AG9 a AG14)
  function sinal(v, casas) { return (v < 0 ? '−' : '+') + n(Math.abs(v), casas); }
  // a rede tem comparação com a bomba existente? (dado informado e rede sem erro de dados)
  function temBombaExistente(R) { return !!R.bomba.existente; }
  // comparação em lista (Projeto e folha); folha = true na folha do memorial
  X.comparaBomba = function (R, folha) {

    if (!X.valido(R)) {

    }
    if (EX.q !== null) {
      L.push('Vazão da rede ' + n(EX.qRede, 2) + ' m³/h × nominal ' + n(EX.q, 2) + ' m³/h: ' + sinal(EX.difVazao * 100, 2) + ' % ' +
        (Math.abs(EX.difVazao) > EX.tol ? '<span class="sit revisar">fora da tolerância de ' + f.campo(EX.tol * 100, 1) + ' %</span>' : '<span class="sit ok">dentro da tolerância de ' + f.campo(EX.tol * 100, 1) + ' %</span>'));
    }
    if (EX.h !== null) {
      // item 2 da revisão da AG1: com a vazão fora da tolerância, a folga compara alturas em vazões diferentes (indicativa)
      L.push(EX.folga === null ? 'Altura: sem comparação (fluido sem propriedades).'
        : 'Altura de projeto ' + n(EX.hProjeto, 2) + ' m' + (EX.margem > 0 ? ' (circuito crítico ' + n(EX.hCritico, 2) + ' m, margem de ' + f.campo(EX.margem * 100, 1) + ' %)' : '') + ' × bomba existente ' + n(EX.h, 2) + ' m: ' +
          // AG2 (decisão dele): o déficit com a vazão fora da tolerância também é indicativo, como na gaveta e no memorial
          (EX.folga < 0 ? '<span class="sit revisar">' + (EX.vazaoFora ? 'déficit indicativo de ' + n(-EX.folga, 2) + ' m (vazões diferentes)' : 'déficit de ' + n(-EX.folga, 2) + ' m') + '</span>'
            : (EX.vazaoFora ? '<span class="sit">folga indicativa de ' + n(EX.folga, 2) + ' m (vazões diferentes)</span>' : '<span class="sit ok">folga de ' + n(EX.folga, 2) + ' m</span>')) +
          (EX.margem > 0 ? ' (sem a margem: ' + sinal(EX.folgaSemMargem, 2) + ' m)' : ''));
    } else if (EX.q !== null) { L.push('Altura: não informada.'); }
    return '<ul class="em-uso-lista" data-g="bomba-compara">' + L.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>' +
      '<p class="' + cls + '">Vazão da rede: a da bomba, sem a margem. Altura: em metros de coluna do fluido, contra a altura de projeto (circuito crítico mais a margem). ' + esc(X.P_BE_LIMITES) + '.</p>';
  };
  X.temBombaExistente = temBombaExistente;
  function cartaoBombaExistente(R) {
    var EX = R.bomba.existente;

      return '<div class="cartao" data-g="bomba-existente"><h2>Bomba existente</h2><p class="msg-tela alerta">Sem comparação: enquanto houver erro de dados na rede, a vazão e a altura da rede não valem.</p></div>';
    }

    var g = [];

      g.push(calc('Vazão da rede', n(EX.qRede, 3), 'm³/h', 'qRede'), dado('Vazão nominal', n(EX.q, 2), 'm³/h'), calc('Diferença de vazão', sinal(EX.difVazao * 100, 2), '%', 'dif'));
    }
    if (EX.h !== null && EX.folga !== null) {
      g.push(calc('Altura de projeto (com a margem de ' + f.campo(EX.margem * 100, 1) + ' %)', n(EX.hProjeto, 3), 'm', 'hProjeto'), calc('Altura do circuito crítico', n(EX.hCritico, 3), 'm', 'hCritico'),
        dado('Altura disponível', n(EX.h, 2), 'm'), calc('Folga, com a margem', sinal(EX.folga, 2), 'm', 'folga'));
      if (EX.margem > 0) { g.push(calc('Folga, sem a margem', sinal(EX.folgaSemMargem, 2), 'm', 'folgaSem')); }

    }
    return '<div class="cartao" data-g="bomba-existente"><h2>Bomba existente</h2><p class="fraco" style="margin-bottom:10px">Cada valor calculado abre a conta, passo a passo. Os dados de catálogo são os informados no Projeto.</p>' +
      '<div class="grade">' + g.join('') + '</div>' +
      (EX.avisos.length ? '<ul class="lista-avisos" data-g="bomba-existente-avisos">' + EX.avisos.map(function (a) { return '<li class="revisar"><b>' + (a.tipo === 'vazaoBomba' ? 'Vazão' : 'Altura') + ':</b> ' + esc(a.texto) + '</li>'; }).join('') + '</ul>'
        : '<p class="msg-tela bom" data-g="bomba-existente-ok">A bomba existente atende à rede nos dados informados' +
          (EX.h === null ? ' (altura não informada)' : (EX.q === null ? ' (vazão nominal não informada)' : '')) + '.</p>') +
      (EX.vazaoFora && EX.folga !== null ? '<p class="fraco" data-g="bomba-folga-indicativa">Com a vazão fora da tolerância, ' + (EX.folga >= 0 ? 'a folga de altura é indicativa' : 'o déficit de altura é indicativo') +
        ': compara a altura da bomba na vazão nominal com a da rede na vazão da rede.</p>' : '') +
      '<p class="fraco">Vazão da rede: a da bomba, sem a margem (a margem do app é só sobre o ΔP). Altura em metros de coluna do fluido, sem correção pela massa específica; pressão equivalente = ρ · g · H. ' +
        esc(X.P_BE_LIMITES) + '. Para alterar os dados: <a href="#/projeto">Projeto</a>, bloco Bomba.</p></div>';
  }

  // ------------------------------------------------------------ circuito crítico
  function tabCaminho(R) {
    var cam = R.caminho.slice().reverse(), b = R.bomba;
    return tabela('leitura', [
      { t: 'Nº', num: true, v: function (c, i) { return String(i + 1); } },

  }

  // ------------------------------------------------------------ trechos (tabela completa, só leitura)
  function tabTrechosA(R, folha) {
    return tabela('leitura densa', [
      { t: 'ID', v: function (t, i) { return folha ? '<b>' + esc(t.id) + '</b>' : '<a href="#/trecho/' + i + '" title="Abrir o trecho"><b>' + esc(t.id || '(sem ID)') + '</b></a>'; } },
      { t: 'Montante', v: function (t) { return esc(t.montante || 'bomba'); } },
      { t: 'Descrição', v: function (t) { return esc(t.descricao); } },

      { t: 'Vazão<br>L/s', num: true, v: function (t) { return n(t.qLs, 3); } },

  function tabTrechosB(R, folha) {

      { t: 'ID', v: function (t, i) { return folha ? '<b>' + esc(t.id) + '</b>' : '<a href="#/trecho/' + i + '" title="Abrir o trecho"><b>' + esc(t.id || '(sem ID)') + '</b></a>'; } },
      { t: 'ΔP distr.<br>kPa', num: true, v: function (t) { return n(t.dpDist, 3); } },

  // rugosidade de tubo liso (cobre, 0,00152 mm) pede a quinta casa
  function rugosidade(v) { return n(v, typeof v === 'number' && Math.abs(v) < 0.01 ? 5 : 4); }

    'ΔP do trecho = distribuído + conexões + equipamentos. Acumulado em metros de coluna do fluido. A coluna 90.1 é informativa (aço, de DN 65 em diante).';

  // ------------------------------------------------------------ balanceamento
  function tabTerminais(R, folha) {

      { t: 'Vazão<br>m³/h', num: true, v: function (x) { return n(x.q, 3); } },

  function notaAutoridade(R, folha) {
    var pr = R.premissas, def = CAT.criterios.autoridadeMin;
    return '<p class="' + (folha ? 'nota' : 'fraco') + '" data-g="premissa-d23">Autoridade = ΔP da válvula de controle ÷ (ΔP do trecho terminal + excesso do terminal). ' +
      (folha ? '<b>Premissa:</b>' : '<span class="selo premissa">premissa</span>') + ' todo o excesso é dissipado no balanceamento do próprio terminal; se parte for dissipada a montante, ' +
      'a autoridade real fica entre o valor com o excesso e o valor sem ele. Autoridade mínima em uso: ' + n(pr.autoridadeMin, 2) + (pr.autoridadeMin === def.p ? ' (padrão)' : ' (padrão ' + n(def.p, 2) + ')') +
      '; abaixo dela o trecho recebe um aviso, e a situação não muda. A margem da bomba não entra no excesso nem na autoridade. ' +
      // D26: onde a margem é dissipada
      (folha ? '<b>Premissa:</b>' : '<span class="selo premissa">premissa</span>') + ' a margem é suposta retirada na bomba, e não no balanceamento dos terminais. ' +
      (folha ? esc(X.F_AUTORIDADE) + '.' : X.seloFonte(X.F_AUTORIDADE)) +
      // D28: o Handbook não dá faixa geral para a bomba de velocidade variável; a nota só relata o caso que ele descreve
      (pr.controle === 'variavel' ? ' <span data-g="nota-d28">Com bomba de velocidade variável e controle pelo ΔP do ramal, o Handbook relata bons resultados com autoridade de 50 % a 100 %, medida sobre a válvula mais a serpentina, ' +
        'em serpentinas com ΔT de 6,7 °C; a base desse percentual não é a deste app, e o mínimo em uso não muda. ' + (folha ? esc(X.F_AUT_VARIAVEL) + '.' : X.seloFonte(X.F_AUT_VARIAVEL)) + '</span>' : '') + '</p>';
  }

  // ------------------------------------------------------------ menor DN e sensibilidade de DN
  function leituraMenor(t) {
    var tubos = TAB.tubosDaEsp(t.especificacao), atual = -1, k = t.menor ? t.menor.kf : null;
    tubos.forEach(function (x, j) { if (x.dn === t.dn) { atual = j; } });
    if (!t.menorDN || k === null || atual < 0) { return '—'; }
    if (k >= tubos.length) { return 'nenhum DN desta especificação atende'; }
    if (k < atual) { return 'há DN menor que atende'; }
    return k === atual ? 'o DN em uso é o menor que atende' : 'o DN em uso está abaixo do menor que atende';
  }
  // a linha leva o índice do trecho na rede (a chave da conta), porque a linha sem ID fica de fora
  function tabMenorComIndice(R, folha) {
    var cols = [
      { t: 'Trecho', v: function (x) { return '<b>' + esc(x.t.id) + '</b>'; } },
      { t: 'Vazão<br>m³/h', num: true, v: function (x) { return n(x.t.q, 3); } },
      { t: 'Especificação', v: function (x) { return esc(x.t.especificacao); } },
      { t: 'DN em uso', v: function (x) { return esc(x.t.dn || '—'); } },
      { t: 'Menor DN<br>que atende', v: function (x) { return x.t.menorDN ? num('menor.' + x.t.id, x.t.menorDN, folha || !numero(x.t.menor.dVelErosao) ? '' : 't.' + x.i + '.menorDN') : '—'; } },
      { t: 'Leitura', v: function (x) { return esc(leituraMenor(x.t)); } },
      { t: 'Situação', v: function (x) { return sit(x.t); } }
    ], linhas = [];
    R.trechos.forEach(function (t, i) { if (!t.semId) { linhas.push({ t: t, i: i }); } });
    return tabela('leitura', cols, linhas);
  }
  function trechoDaSensibilidade(R, U) {
    var ids = R.trechos.filter(function (t) { return !t.semId; }).map(function (t) { return t.id; });
    if (U && U.sens && indice(R, U.sens) >= 0) { return R.trechos[indice(R, U.sens)].id; }
    if (X.valido(R) && R.bomba.indiceCritico >= 0) { return R.trechos[R.bomba.indiceCritico].id; }
    return ids.length ? ids[0] : '';
  }
  function tabSensibilidade(R, id) {
    var S = M.agua.sensibilidade(R, id);
    if (!S || !S.linhas.length) { return '<p class="fraco">Sem vazão ou sem tubo neste trecho: não há o que comparar.</p>'; }
    return tabela('leitura', [
      { t: 'DN', v: function (l) { return '<b>' + esc(l.dn) + '</b>' + (l.atual ? ' <span class="selo calc">em uso</span>' : ''); } },
      { t: 'Di<br>mm', num: true, v: function (l) { return n(l.di, 2); } },
      { t: 'Veloc.<br>m/s', num: true, v: function (l) { return num('sens.' + l.dn + '.v', n(l.v, 3)); } },
      { t: 'Reynolds', num: true, v: function (l) { return n(l.re, 0); } },
      { t: 'f', num: true, v: function (l) { return n(l.f, 5); } },
      { t: 'Perda<br>Pa/m', num: true, v: function (l) { return num('sens.' + l.dn + '.paM', n(l.paM, 1)); } },
      { t: 'ΔP distribuído<br>kPa', num: true, v: function (l) { return n(l.dpDist, 3); } },
      { t: 'v máx.<br>m/s', num: true, v: function (l) { return n(l.vMax, 2); } },
      { t: 'Velocidade', v: function (l) { return esc(l.sitV); } },
      { t: 'Perda por metro', v: function (l) { return esc(l.sitPerda); } }
    ], S.linhas, '', function (l) { return l.atual ? 'atual' : ''; });
  }
  function cartaoMenor(R, U) {
    var id = trechoDaSensibilidade(R, U), t = R.trechos[indice(R, id)];
    var ops = R.trechos.filter(function (x) { return !x.semId; }).map(function (x) {
      return '<option value="' + esc(x.id) + '"' + (x.id === id ? ' selected' : '') + '>' + esc(x.id + (x.descricao ? ' · ' + x.descricao : '')) + '</option>';
    }).join('');
    return '<div class="cartao" data-g="menor"><h2>Menor DN e sensibilidade de DN</h2>' +
      '<p class="fraco" style="margin-bottom:10px">O menor DN é uma indicação: a troca é do projetista. Até o DN limite vale a velocidade; acima dele, o DN tem de atender aos dois limites: a velocidade de erosão e a perda máxima por metro.</p>' +
      tabMenorComIndice(R, false) +
      '<div class="sub"><h3>Sensibilidade de DN de um trecho</h3><div class="grade g2"><div class="campo"><label for="sens-trecho">Trecho</label><div class="entrada">' +
        '<select id="sens-trecho" data-acao-sel="sens-trecho">' + ops + '</select></div></div></div>' +
        (t ? '<p class="fraco" style="margin:10px 0">Trecho <b data-g="sens-id">' + esc(t.id) + '</b>: ' + n(t.q, 3) + ' m³/h em ' + esc(t.especificacao || 'sem tubo') + ', ' +
          n((t.L === null ? 0 : t.L) * (t.idaVolta === null ? 1 : t.idaVolta), 2) + ' m de tubo (com o fator ida e volta). Todos os DN da especificação, com a mesma vazão, a mesma rugosidade e o mesmo comprimento. ' +
          'Só o ΔP distribuído entra na comparação: as conexões e os equipamentos do trecho ficam de fora.</p>' + tabSensibilidade(R, id) : '') +
      '</div></div>';
  }

  // ------------------------------------------------------------ avisos
  function acimaV(t) { return String(t.sitV).indexOf('ACIMA') === 0; }
  function acimaP(t) { return String(t.sitPerda).indexOf('ACIMA') === 0; }
  // lista única de avisos da rede: { onde, texto, nivel } (nivel: 'revisar' ou 'aviso')
  function avisos(R) {
    var L = [], pr = R.premissas, b = R.bomba, ok = X.valido(R);
    if (pr.sitEnvelhecimento !== 'OK') {
      L.push({ onde: 'Projeto', nivel: 'aviso', texto: 'circuito aberto com acréscimo por envelhecimento de ' + f.campo(pr.env * 100, 1) + ' %: o HDR Design Guide (1981), citado pela ASHRAE, indica de 75 % a 90 % ' +
        '(ASHRAE Fundamentals 2021 (SI), cap. 22, p. 22.23, PDF 659)' });
    }
    R.trechos.forEach(function (t) {
      if (t.semId) { return; }
      if (t.situacao === 'REVISAR DN') {
        L.push({ onde: 'Trecho ' + t.id, nivel: 'revisar', texto: 'revisar o DN: ' + (acimaV(t) ? 'velocidade de ' + n(t.v, 2) + ' m/s acima do limite de ' + n(t.vMax, 2) + ' m/s' : '') +
          (acimaV(t) && acimaP(t) ? '; ' : '') + (acimaP(t) ? 'perda de ' + n(t.paM, 0) + ' Pa/m acima do limite de ' + n(pr.paMax, 0) + ' Pa/m' : '') +
          (t.menorDN ? ' (menor DN que atende: ' + t.menorDN + ')' : '') });
      }
      (t.avisos || []).forEach(function (a) { L.push({ onde: 'Trecho ' + t.id, nivel: 'aviso', texto: a.texto }); });
    });
    if (ok) {
      R.terminais.forEach(function (x) { if (x.fracao !== null && x.fracao > 0.5) { L.push({ onde: 'Terminal ' + x.id, nivel: 'aviso', texto: x.obs }); } });
      if (numero(b.relacao) && b.relacao > M.agua.LIMITE_REL) {
        L.push({ onde: 'Bomba', nivel: 'aviso', texto: 'relação de bombeamento de ' + n(b.relacao, 4) + ' kW/kW, acima do valor desejável de ' + n(M.agua.LIMITE_REL, 2) + ' kW/kW (NBR 16401-1:2024, 12.2.7, p. 33, PDF 43)' });
      }
    }
    // bomba existente (AG13): os avisos da comparação, com a rede válida
    if (ok && b.existente) { b.existente.avisos.forEach(function (a) { L.push({ onde: 'Bomba existente', nivel: 'revisar', texto: String(a.texto).replace(/\.$/, '') }); }); }
    if (R.contagem.orfas) { L.push({ onde: 'Rede', nivel: 'aviso', texto: X.plural(R.contagem.orfas, 'linha órfã', 'linhas órfãs') + ' de conexão ou de equipamento: o trecho não existe mais, e a linha não entra na conta' }); }
    return L;
  }
  function listaAvisos(R) {
    var L = avisos(R);
    if (!L.length) { return '<p class="fraco" data-g="sem-avisos">Nenhum aviso.</p>'; }
    return '<ul class="lista-avisos">' + L.map(function (a) {
      return '<li class="' + a.nivel + '"><b>' + esc(a.onde) + ':</b> ' + esc(a.texto) + '.</li>';
    }).join('') + '</ul>';
  }

  X.oQueFalta = oQueFalta; X.cartaoFalta = cartaoFalta; X.tabCaminho = tabCaminho; X.textoCaminho = textoCaminho; X.tabTrechosA = tabTrechosA; X.tabTrechosB = tabTrechosB;
  X.NOTA_TRECHOS = NOTA_TRECHOS; X.NOTA_ARRED = NOTA_ARRED; X.rugosidade = rugosidade; X.tabTerminais = tabTerminais; X.notaAutoridade = notaAutoridade; X.tabMenor = tabMenorComIndice; X.avisos = avisos; X.listaAvisos = listaAvisos;
  X.tabelaLeitura = tabela; X.numMarcado = num;

  // ------------------------------------------------------------ a tela
  // seletor do módulo mostrado (estado da tela: U.modulo)
  function seletorModulo(U) {
    var ar = U.modulo === 'ar';
    return '<div class="acoes barra-tab" data-g="modulo"><div class="seg" role="group" aria-label="Resultados de">' +
      '<button type="button" data-acao="modulo" data-valor="agua" aria-pressed="' + !ar + '">Água gelada</button>' +
      '<button type="button" data-acao="modulo" data-valor="ar" aria-pressed="' + ar + '">Dutos de ar</button></div></div>';
  }
  T.resultados = function (E, U, R) {
    var ok = X.valido(R), c = R.contagem;
    // app só de dutos: sempre os dutos, sem o seletor do módulo
    if (!X.soAgua && (U.modulo === 'ar' || X.soDutos) && X.resultadosAr) {
      return '<div class="rede">' + C.cabeca(X.passo('resultados'), 'Resultados', 'Dutos de ar: ventilador' + (X.soDutos ? ' e equipamento' : '') + ', bocas críticas, trechos, balanceamento, dimensão sugerida, vazamento e avisos. Os valores do ventilador abrem a conta, com fórmula, valores e fonte.') +
        (X.soDutos ? '' : seletorModulo(U)) + X.resultadosAr(E, U, R) + '</div>';
    }
    return '<div class="rede">' + C.cabeca(X.passo('resultados'), 'Resultados', 'Água gelada: bomba' + (R.bomba.existente ? ', bomba existente' : '') + ', circuito crítico, trechos, balanceamento, menor DN e avisos. Os valores da bomba e do balanceamento abrem a conta, com fórmula, valores e fonte.') +
      (X.soAgua ? '' : seletorModulo(U)) +
      C.aprender('A bomba vence o caminho de maior perda de carga, da bomba até um terminal e de volta: o circuito crítico. Os outros terminais recebem pressão de sobra (excesso), que a válvula de balanceamento de cada um dissipa.') +
      (ok ? cartaoBomba(R) + cartaoBombaExistente(R) + cartaoCritico(R) : cartaoFalta(R, false)) +
      (c.trechos ? '<div class="cartao" data-g="trechos"><h2>Trechos</h2><p class="fraco" style="margin-bottom:10px">' + X.plural(c.trechos, 'trecho', 'trechos') + ' · ' + c.revisar + ' a revisar · ' + c.dados +
        ' com erro de dados. Tabela só de leitura: o ID abre o trecho.</p><h3 class="sub-t">Vazão, tubo e escoamento</h3>' + tabTrechosA(R, false) +
        '<h3 class="sub-t">Perda de carga e verificações</h3>' + tabTrechosB(R, false) + '<p class="fraco" style="margin-top:10px">' + NOTA_TRECHOS + ' ' + NOTA_ARRED + '</p></div>' : '') +
      (ok ? '<div class="cartao" data-g="balanceamento"><h2>Balanceamento</h2><p class="fraco" style="margin-bottom:10px">Excesso = ΔP do circuito crítico − ΔP acumulado do terminal: é o que o balanceamento de cada terminal tem de dissipar.</p>' +
        tabTerminais(R, false) + notaAutoridade(R, false) + '</div>' : '') +
      (c.trechos && R.premissas.ok ? cartaoMenor(R, U) : '') +
      '<div class="cartao" data-g="avisos"><h2>Avisos</h2>' + listaAvisos(R) + '</div>' +
      '<div class="acoes"><a class="botao prim" href="#/memorial">Abrir o memorial</a><a class="botao" href="#/rede">Voltar à rede</a></div></div>';
  };
})(window.HVAC);

</script>
<script>
/* ==== js/interface/resultados_ar.js ==== */
/* Redes HVAC. Resultados dos dutos de ar (ESPECIFICACAO_telas_dutos, seção 3): ventilador, bocas críticas, trechos,
   balanceamento, dimensão atual e sugerida, vazamento com a classe CL e avisos, da rede de ar escolhida (U.rede). Só monta
   HTML a partir do resultado do motor (R.dutos = M.dutos.calcular); nenhuma conta é feita aqui. Com erro de dados
   (X.validoAr falso) a tela diz o que falta e não mostra ventilador nem bocas críticas. Carrega depois de resultados.js,
   de telas_ar.js e de contas_ar.js. */
(function (H) {
  'use strict';
  var f = H.util.fmt, esc = f.esc, C = H.ui.c, M = H.motor, TA = H.dados.tab.ar, X = H.ui.redes;

  function n(v, casas) { return f.num(v, casas); }
  function numero(v) { return typeof v === 'number' && isFinite(v); }
  function num(g, texto, chave) { return X.numMarcado(g, texto, chave); }
  function ponto(s) { return String(s).replace(/[.\s]+$/, '') + '.'; }
  var NOME_LADO = { insuflamento: 'Insuflamento', retorno: 'Retorno' };
  var NOME_FORMA = { circular: 'circular', retangular: 'retangular', oval: 'oval', flexivel: 'flexível' };
  // nota do que a pressão total do ventilador inclui (R4, observação 2 do revisor da R3); a mesma na tela e na folha
  var NOTA_PTOTAL = '<b>O que a pressão total inclui:</b> atrito dos dutos, singularidades e componentes lançados nos trechos (boca crítica do insuflamento e do retorno), ' +
    'efeito do sistema e acréscimo do filtro saturado. <b>Não inclui</b>, a não ser que sejam lançados como componente de um trecho: a serpentina, o filtro limpo e as ' +
    'demais perdas internas do equipamento. Na seleção do ventilador, somar essas perdas; ao comparar com a pressão disponível de um equipamento de catálogo, usar a mesma base (total ou estática).';
  var ORIGEM_Q = { informada: 'informada', calor: 'calor sensível', soma: 'soma a jusante' };
  function lados(r) { return ['insuflamento', 'retorno'].map(function (k) { return r.lados[k]; }).filter(function (ld) { return !!ld; }); }
  function linkTrecho(t) { return '<a href="#/duto/' + t.i + '" title="Abrir o trecho"><b>' + esc(t.id || '(sem ID)') + '</b></a>'; }
  // coluna do ID: na folha do memorial, sem link
  function idTrecho(folha) { return folha ? function (t) { return '<b>' + esc(t.id || '(sem ID)') + '</b>'; } : linkTrecho; }

  // ------------------------------------------------------------ o que falta
  function oQueFaltaAr(r) {
    var L = [];
    if (r.contagem.trechos === 0) { L.push({ t: 'A rede não tem nenhum trecho com ID', href: '#/dutos', onde: 'Abrir os dutos' }); }
    r.trechos.forEach(function (t) {
      if (String(t.situacao).indexOf('DADOS') === 0) { L.push({ t: 'Trecho ' + t.id + ': ' + String(t.situacao).replace(/^DADOS:\s*/, ''), href: '#/duto/' + t.i, onde: 'Abrir o trecho ' + t.id }); }
    });
    return L;
  }
  function cartaoFaltaAr(r) {
    return '<div class="cartao" data-g="falta-ar"><h2>O que falta para calcular</h2>' +
      '<p class="msg-tela erro">Enquanto houver erro de dados, o ventilador e as bocas críticas não valem e não são mostrados.</p><ul class="lista-falta">' +
      oQueFaltaAr(r).map(function (x) { return '<li>' + esc(ponto(x.t)) + ' <a href="' + x.href + '">' + esc(x.onde) + '</a></li>'; }).join('') + '</ul></div>';
  }

  // ------------------------------------------------------------ ventilador
  function cartaoVentilador(r, ri) {
    var V = r.ventilador, li = r.lados.insuflamento, lr = r.lados.retorno, k = 'v.' + ri + '.';
    function calc(rot, valor, un, g) { return C.calculado({ rotulo: rot, valor: valor, unidade: un, chave: k + g }); }
    var parcelas = [
      { t: 'Boca crítica do insuflamento' + (li && li.bocaCritica ? ' (' + li.bocaCritica + ')' : ''), v: V.dpInsuflamento, g: 'ar.dpIns', c: li && li.iCritica >= 0 ? k + 'critico.insuflamento' : '' },
      { t: 'Boca crítica do retorno' + (lr && lr.bocaCritica ? ' (' + lr.bocaCritica + ')' : ''), v: V.dpRetorno, g: 'ar.dpRet', c: lr && lr.iCritica >= 0 ? k + 'critico.retorno' : '' },
      { t: 'Efeito do sistema', v: V.efeitoSistema, g: 'ar.efeito', c: '' },
      { t: 'Acréscimo do filtro saturado', v: V.filtroSaturado, g: 'ar.filtro', c: '' }
    ];
    return '<div class="cartao" data-g="ventilador"><h2>Ventilador</h2><p class="fraco" style="margin-bottom:10px">Cada valor abre a conta, passo a passo.</p><div class="grade">' +
      (numero(V.q) ? calc('Vazão do ventilador', n(V.q * 3600, 1), 'm³/h', 'q') + calc('Vazamento admissível', n(V.qVazamento * 3600, 1), 'm³/h', 'qVazamento') : '') +
      (numero(V.pTotal) ? calc('Pressão total', n(V.pTotal, 2), 'Pa', 'pTotal') : '') +
      (numero(V.pEstatica) ? calc('Pressão estática', n(V.pEstatica, 2), 'Pa', 'pEstatica') : '') + '</div>' +
      (V.motivoQ ? '<p class="msg-tela alerta" data-g="sem-vazao-ar">Vazão do ventilador sem valor: ' + esc(ponto(V.motivoQ)) + '</p>' : '') +
      (V.motivoP ? '<p class="msg-tela alerta" data-g="sem-pressao-ar">Pressão total sem valor: ' + esc(ponto(V.motivoP)) + '</p>' : '') +
      '<p style="margin-top:10px">Vazão dos dutos: insuflamento ' + num('ar.qIns', n(numero(V.qInsuflamento) ? V.qInsuflamento * 3600 : null, 1)) + ' m³/h · retorno ' +
        num('ar.qRet', n(numero(V.qRetorno) ? V.qRetorno * 3600 : null, 1)) + ' m³/h' +
        (numero(V.q) ? '. Com ' + f.campo(V.vazamentoPct, 1) + ' % de vazamento admissível, o ventilador move ' + num('ar.qVent', n(V.q * 3600, 1)) + ' m³/h.' : '.') + '</p>' +
      '<h3 class="sub-t">Parcelas da pressão total</h3>' +
      X.tabelaLeitura('leitura', [
        { t: 'Parcela', v: function (x) { return esc(x.t); } },
        { t: 'Pa', num: true, v: function (x) { return num(x.g, n(x.v, 2), x.c); } }
      ], parcelas, '<tr class="total"><td>Pressão total do ventilador</td><td class="num">' + num('ar.pTotal', n(V.pTotal, 2)) + '</td></tr>') +
      (numero(V.pEstatica) ? '<p class="fraco" style="margin-top:8px">Pressão estática = pressão total − pressão de velocidade na descarga (' + n(V.pvDescarga, 2) + ' Pa, a ' + f.campo(V.vDescarga, 2) + ' m/s).</p>'
        : '<p class="fraco" style="margin-top:8px">A pressão estática só é mostrada com a velocidade na descarga do ventilador informada na rede (dado de catálogo, opcional).</p>') +
      '<p class="fraco">Vazão do ventilador: a dos dutos mais o vazamento admissível ' + X.seloFonte(X.F_AR.ventQ) + ' · Pressão: perdas em pressão total, sem margem (a folga, se houver, é do projetista) ' + X.seloFonte(X.F_AR.ventP) + '</p>' +
      '<p class="fraco" data-g="nota-ptotal">' + NOTA_PTOTAL + '</p>' +
      (temEquip(r) ? '<h3 class="sub-t">Equipamento existente</h3>' + X.comparaEquipAr(r, false) : '') + '</div>';
  }
  // a rede traz a vazão nominal ou a pressão disponível do equipamento existente (DU1 e DU2)?
  function temEquip(r) { var EQ = r.ventilador.equipamento; return !!EQ && (EQ.q !== null || EQ.pDisp !== null); }
  X.temEquipAr = temEquip;

  // ------------------------------------------------------------ bocas críticas
  function tabCaminhoAr(r, ld, folha) {
    var linhas = ld.caminho.slice().reverse().map(function (id) { return r.trechos[r.estrutura.primeira[M.rede.chave(id)]]; }).filter(function (t) { return !!t; });
    return X.tabelaLeitura('leitura', [
      { t: 'Nº', num: true, v: function (t, i) { return String(i + 1); } },

<script>
/* ==== js/interface/importa_ct.js ==== */
/* Redes HVAC. Importação da carga térmica para o cadastro de unidades (ESPECIFICACAO_telas_dutos, seção 5; correspondência

   O calor total não está no arquivo: fica vazio, para digitar. A unidade guarda a origem (arquivo, item e data); importar de
   novo casa pela origem e, depois, pelo ID igual ao nome do ambiente, e a janela mostra novo, atualiza ou igual antes de
   gravar. Nada é alterado na carga térmica web. Carrega depois de telas_ar.js; as ações ficam em app.js. */
(function (H) {
  'use strict';
  var f = H.util.fmt, esc = f.esc, M = H.motor, X = H.ui.redes;
  var FORMATO_CT = 'hvac-carga-termica', VERSAO_MIN = 3, VERSAO_CONHECIDA = 3;
  var MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  var DIAS = { tbs: 'dia de tbs máxima', tbu: 'dia de tbu máxima', umi: 'dia de umidade máxima' };

  function ehObj(x) { return x !== null && typeof x === 'object' && !Array.isArray(x); }

  // ------------------------------------------------------------ leitura do arquivo (sem tela)
  // Devolve { ok, motivo, versao, projeto (nome), itens: [{ tipo: 'ambiente' | 'conjunto', item (chave da origem), nome, descricao,
  //   calorSensivelW (null = não entra), quando, motivo }], simultaneo: { valor, quando } | null }
  function ler(obj) {

      var OUTRO = 'Este arquivo não é um projeto do app de carga térmica.';

      obj.ambientes.forEach(function (a, k) {
        if (!ehObj(a)) { return; }

        var nome = typeof a.nome === 'string' ? a.nome.trim() : '', r = res.ambientes[k], rot = nome || 'Ambiente ' + (k + 1), item = 'ambiente: ' + rot, q = 2, v = null, motivo = '';
        while (usados[item]) { item = 'ambiente: ' + rot + ' (' + (q++) + ')'; }

        else if (!numero(r.sensivelAmbienteW)) { motivo = 'calor sensível ilegível no arquivo'; }

                     calorSensivelW: validos === total ? Math.round(soma * 10) / 10 : null, quando: 'soma dos máximos dos ambientes',
                     motivo: validos === total ? '' : 'há ambiente sem calor sensível válido no arquivo: a soma dos máximos não fecha' });
      }

    } catch (err) {

  // ------------------------------------------------------------ situação de cada item diante do cadastro (novo, atualiza, igual)
  // Casa pela origem (arquivo e item; depois só o item, se uma única unidade o tiver) e, no ambiente, pelo ID igual ao nome
  function casar(us, it, nome, tomadas) {

    });

  }

  // ------------------------------------------------------------ janela da escolha
  function textoSituacao(x, us) {

        '<td><b>' + esc(x.descricao) + '</b></td><td class="num" data-g="ct.' + i + '.qs">' + (x.calorSensivelW === null ? '—' : n1(x.calorSensivelW)) + '</td>' +
        '<td>' + esc(x.quando || '—') + '</td><td data-g="ct.' + i + '.sit">' + textoSituacao(x, us) + '</td></tr>';

      '<p style="margin-bottom:10px">Marque o que vira unidade no cadastro. Cada ambiente marcado vira uma unidade com o calor sensível dele' +

      (p.lido.simultaneo ? '<p class="fraco" style="margin-top:10px" data-g="ct.simultaneo">Calor sensível simultâneo do conjunto, no arquivo: ' + n1(p.lido.simultaneo.valor) + ' W' +
        (p.lido.simultaneo.quando ? ' (' + esc(p.lido.simultaneo.quando) + ')' : '') + '. Só informação: em volume constante cada ambiente recebe a vazão do seu máximo, e a unidade do conjunto leva a soma dos máximos.</p>' : '') +
      '<p class="fraco" style="margin-top:6px">O calor sensível é o do ambiente: maior valor do ano na janela de ocupação, sem ar exterior, sem latente, sem calor ao retorno e sem fator de segurança. ' +
        'O arquivo da carga térmica não grava o calor total: ele fica vazio na unidade, para digitar (a "Capacidade de projeto" da carga térmica). O ID e a descrição da unidade podem ser trocados depois.' +

      linhas.push({ nivel: 'info', onde: 'Conjunto', campo: 'Calor sensível simultâneo', valorArquivo: n1(p.lido.simultaneo.valor) + ' W', valorAdotado: 'não usado',

      linhas: linhas, arquivoTxt: String(p.nome).replace(/\.json$/i, '').replace(/[^\wÀ-ú]+/g, '_') + '_relatorio_importacao_ct.txt' });

  }

<script>
/* ==== js/interface/memorial_ar.js ==== */
/* Redes HVAC. Memorial dos dutos de ar (ESPECIFICACAO_memorial_dutos, sessão R3): o que os dutos põem no cartão "antes de
   emitir" e as seções dos dutos na folha (método, premissas do ar e, por rede de ar, dados da rede, trechos, singularidades
   e componentes, ventilador e bocas críticas, balanceamento, vazamento e avisos). Só monta HTML a partir do projeto e do
   resultado do motor (R.dutos = M.dutos.calcular); as tabelas de trechos, de caminho e de balanceamento são as de
   resultados_ar.js. Rede de ar sem trecho fica fora da folha (M1). Carrega depois de resultados_ar.js e antes de memorial.js. */
(function (H) {

  var GRUPOS = [['premissas', 'Ar dos dutos'], ['metodo', 'Método dos dutos'], ['criterios', 'Critérios dos dutos']];
  var NOME_LADO = { insuflamento: 'insuflamento', retorno: 'retorno' };
  var P_CL = 'Premissa do app: a pressão P da classe de vazamento é a classe de pressão dos dutos';

  var P_DESB = 'Premissa do app: desbalanceamento = (maior − menor) ÷ maior, entre as bocas do lado';
  var P_EQUIP = 'Premissa do app (DU1 e DU2): vazão nominal e pressão estática externa disponível do catálogo do equipamento existente; a pressão do catálogo é estática, por isso a comparação usa a estática da rede ' +
    '(Psf = Ptf − Pvf, ASHRAE HVAC Systems and Equipment 2016 (SI), cap. 21, p. 21.6, PDF 363: pressão total menos a pressão de velocidade na descarga; leitura do app: sem a da entrada) quando há a velocidade na descarga e, sem ela, a total, a favor da segurança; ' +

      { t: 'Fonte', v: function (l) { return l.o === 'informado' ? esc(l.fonte || 'Dado do projeto') + ' ' + seloF('informado') : (l.o === 'vazio' ? esc(l.fonte || '—') : comSelo(l.fonte)); } }
    ], L);
  }
  function tabSingularidades(r) {
    var L = r.singularidades.filter(function (o) { return o.trecho !== ''; });
    if (!L.length) { return '<p class="nota">Nenhuma singularidade lançada.</p>'; }
    function trecho(o) { return o.orfa ? null : r.trechos[o.i]; }
    return tabela('leitura', [
      { t: 'Trecho', v: function (o) { return '<b>' + esc(o.trecho) + '</b>' + (o.orfa ? ' (órfã: fora da conta)' : ''); } },
      { t: 'Descrição', v: function (o) { return esc(o.descricao || '—'); } },
      { t: 'Peça', v: function (o) { var d = o.peca ? TA.derivacao(o.peca) : null; return o.origemC === 'tabela' ? esc(o.peca + (d && d.descricao ? ' · ' + d.descricao : '')) : (o.origemC === 'informado' ? 'C digitado' : '—'); } },
      { t: 'Lado da<br>peça', v: function (o) { return o.origemC === 'tabela' ? (o.ladoPeca === 'ramal' ? 'ramal' : 'passagem direta') : '—'; } },
      { t: 'C<br>unitário', num: true, v: function (o) { return n(o.c, 3); } },

      { t: 'C<br>total', num: true, v: function (o) { return n(o.cTotal, 3); } },
      { t: 'pv do trecho<br>Pa', num: true, v: function (o) { var t = trecho(o); return n(t ? t.pv : null, 2); } },

    ], L) + '<p class="nota">ΔP da singularidade = C × quantidade × pressão de velocidade do trecho em que ela foi lançada, com a velocidade real da seção.</p>';
  }
  function tabComponentes(r) {
    var L = r.componentes.filter(function (o) { return o.trecho !== ''; });

    return tabela('leitura', [
      { t: 'Trecho', v: function (o) { return '<b>' + esc(o.trecho) + '</b>' + (o.orfa ? ' (órfã: fora da conta)' : ''); } },
      { t: 'Descrição', v: function (o) { return esc(o.descricao || '—'); } },
      { t: 'Tag ou modelo', v: function (o) { return esc(o.tag || '—'); } },
      { t: 'ΔP de catálogo<br>Pa', num: true, v: function (o) { return n(o.dpCat, 1); } },

      { t: 'Vazão do trecho<br>m³/h', num: true, v: function (o) { var t = o.orfa ? null : r.trechos[o.i]; return n(t ? t.qM3h : null, 1); } },
      { t: 'ΔP adotado<br>Pa', num: true, v: function (o) { return n(o.dp, 2); } }
    ], L) + '<p class="nota">O ΔP e a vazão de catálogo são informados pelo projetista, a partir do catálogo de cada componente. Com a vazão de catálogo, o ΔP é corrigido pelo quadrado da razão de vazões.</p>';
  }
  function m3h(v) { return numero(v) ? n(v * 3600, 1) : '—'; }
  function secVentilador(r) {
    var V = r.ventilador, passos = [];
    function cel(rot, html) { return '<td><span>' + esc(rot) + '</span><b>' + html + '</b></td>'; }
    if (numero(V.q)) { passos = passos.concat(X.passosVentQ(r)); }

      passos.push(p('Pressão de velocidade na descarga', 'pv = ρ · V² ÷ 2', n(r.ar.rho, 4) + ' × ' + n(V.vDescarga, 2) + '² ÷ 2', n(V.pvDescarga, 2) + ' Pa', 'Velocidade na descarga: dado da rede, do catálogo do equipamento'));
      passos.push(p('Pressão estática do ventilador', 'pressão total − pressão de velocidade na descarga', n(V.pTotal, 2) + ' − ' + n(V.pvDescarga, 2), n(V.pEstatica, 2) + ' Pa', FA.estatica));
    }
    return '<table class="resumo-f"><tbody><tr>' +
        cel('Vazão do insuflamento', num('ar.qIns', m3h(V.qInsuflamento)) + ' m³/h') +
        cel('Vazão do retorno', num('ar.qRet', m3h(V.qRetorno)) + ' m³/h') +
        cel('Vazamento admissível', V.vazamentoPct === null ? '—' : esc(n(V.vazamentoPct, 1)) + ' % · ' + num('ar.qVaz', m3h(V.qVazamento)) + ' m³/h') +
        cel('Vazão do ventilador', num('ar.qVent', m3h(V.q)) + ' m³/h') +

      (V.motivoQ ? '<p class="alerta-f">Vazão do ventilador sem valor: ' + esc(semPonto(V.motivoQ)) + '.</p>' : '') +
      (V.motivoP ? '<p class="alerta-f">Pressão total sem valor: ' + esc(semPonto(V.motivoP)) + '.</p>' : '') +
      (passos.length ? C.tabPassos(passos) : '') +
      '<p class="nota">Vazão do ventilador: a dos dutos mais o vazamento admissível; os trechos são dimensionados sem o vazamento. Pressão: perdas em pressão total, sem margem (a folga, se houver, é do projetista). ' +
        (numero(V.pEstatica) ? '' : 'A pressão estática só é mostrada com a velocidade na descarga do ventilador informada na rede. ') + X.NOTA_ARRED + '</p>' +

      }).join('');
  }
  function secVazamento(r, cri) {
    var V = r.ventilador, ua = r.unidadeAtendida, cls = TA.classe(cri.classePressao);
    function cel(rot, html) { return '<td><span>' + esc(rot) + '</span><b>' + html + '</b></td>'; }
    return '<table class="resumo-f"><tbody><tr>' +
        cel('Vazamento admissível', numero(V.qVazamento) ? esc(n(V.qVazamento * 1000, 2)) + ' L/s' : '—') +
        cel('Superfície de duto', num('ar.sup', n(r.superficie, 2)) + ' m²') +

        p('Superfície dos dutos rígidos', 'soma de perímetro × comprimento, sem os flexíveis', '', n(r.superficieCl, 2) + ' m²', FA.semFlex),

        p('Classe de vazamento', 'CL = 1 000 · F ÷ P^0,65', '1 000 × ' + n(V.qVazamento * 1000 / r.superficieCl, 4) + ' ÷ ' + n(cri.classePressao, 0) + '^0,65', n(r.cl, 2),
          'P: pressão estática de trabalho, em Pa; o app adota a classe de pressão dos dutos. ' + FA.cl)])
        : '<p class="nota">A classe de vazamento CL pede o vazamento admissível da rede e ao menos um trecho de duto rígido com comprimento.</p>') +
      X.vazamentoLadosAr(r, cri, true) +
      '<p class="nota">Superfície de todos os trechos, para o quantitativo; a da classe de vazamento não conta os flexíveis. Classe de pressão em uso: ' + esc(n(cri.classePressao, 0)) + ' Pa' +
        (cls ? ' (' + esc(cls.operacao || cls.tipo || '') + (numero(cls.vMax) ? '; velocidade máxima de ' + esc(n(cls.vMax, 1)) + ' m/s' : '') + ')' : '') + '. ' + X.NOTA_ARRED + '</p>' +
      (ua.id !== '' && numero(r.calorBocas) ? '<h3>Calor sensível das bocas e da unidade</h3><p class="nota">Bocas do insuflamento: ' + num('ar.calorBocas', n(r.calorBocas, 0)) + ' W' +
        (ua.existe && numero(ua.calorSensivelW) ? ' · unidade ' + esc(ua.id) + ': ' + esc(n(ua.calorSensivelW, 0)) + ' W · diferença de ' + (ua.diferenca >= 0 ? '+' : '−') + esc(n(Math.abs(ua.diferenca) * 100, 2)) + ' %'
          : ' · unidade ' + esc(ua.id) + (ua.existe ? ': cadastrada sem o calor sensível' : ': não está no cadastro')) +
        '. A boca lançada por vazão entra pelo calor equivalente, com o mesmo ΔT de insuflamento.</p>' : '');
  }
  function faltaRede(r) {
    return '<div class="falta-f" data-g="falta-ar"><p class="alerta-f">Enquanto houver erro de dados, o ventilador, as bocas críticas, o balanceamento e o vazamento não valem e não são mostrados.</p><ul class="lista-falta">' +
      X.oQueFaltaAr(r).map(function (q) { return '<li>' + esc(semPonto(q.t)) + '.</li>'; }).join('') + '</ul></div>';
  }
  // de onde vem a perda por metro de cada flexível: a tabela mostra ε e f também no trecho com o dado do fabricante
  function notaFlexiveis(r) {
    var L = [];
    r.trechos.forEach(function (t) {
      if (t.semId || t.forma !== 'flexivel' || !numero(t.paMBase) || !numero(t.pdcf) || !numero(t.paM)) { return; }
      L.push('<b>' + esc(t.id) + '</b>: ' + (t.estimativa ? 'perda estimada com ε de 0,9 mm, ' : 'perda informada pelo fabricante, ') +
        esc(n(t.paMBase, 2)) + ' Pa/m × PDCF de ' + esc(n(t.pdcf, 3)) + ' = ' + esc(n(t.paM, 2)) + ' Pa/m' + (t.estimativa ? '' : ' (o ε e o f da tabela não entram na conta deste trecho)'));
    });

  }
  // todas as seções dos dutos; h2(titulo, quebra) numera as seções da folha
  function secoes(E, R, h2) {

    return h2('Método e equações dos dutos') +
      '<p class="nota">Rede em árvore a partir do ventilador, com o insuflamento e o retorno em trechos próprios. Dimensionamento pelo método da perda de carga constante, em baixa pressão; ' +
        'atrito por Darcy-Weisbach com o fator de Colebrook, no circular equivalente; singularidades pelo coeficiente C; componentes pelo dado de catálogo. Perdas em pressão total. ' + X.NOTA_ARRED + '</p>' + tabMetodo(comAlgumEquip(E, R)) +
      h2('Premissas, método e critérios do ar') + tabPremissas(E, R) +
      lista.map(function (x, j) {
        var r = x.r, ok = X.validoAr(r), suf = varias ? ' · rede ' + idRede(r) : '';
        return h2('Rede ' + idRede(r) + ': dados da rede', j > 0) +   // da segunda rede em diante, em página nova
          '<p class="nota">' + (r.descricao ? esc(r.descricao) + ' · ' : '') + X.plural(r.contagem.trechos, 'trecho', 'trechos') + ', ' +
            X.ladosAr(r).map(function (ld) { return X.plural(ld.bocas, 'boca', 'bocas') + ' de ' + NOME_LADO[ld.nome]; }).join(' e ') + '.</p>' + tabRede(x, RD) +
          h2('Trechos dos dutos' + suf) + '<h3>Vazão, seção e escoamento</h3>' + X.tabTrechosArA(r, true) + '<h3>Perda de carga e verificações dos dutos</h3>' + X.tabTrechosArB(r, ok, true) +
            '<p class="nota">' + X.NOTA_TRECHOS_AR + ' ' + X.NOTA_ARRED + '</p>' + notaFlexiveis(r) +
          h2('Singularidades e componentes' + suf) + '<h3>Singularidades</h3>' + tabSingularidades(r) + '<h3>Componentes</h3>' + tabComponentes(r) +
          (ok ? h2('Ventilador e bocas críticas' + suf) + secVentilador(r) +
                h2('Balanceamento dos dutos' + suf) + '<p class="nota">Excesso = ΔP da boca crítica do lado − ΔP acumulado da boca: é o que o registro de cada boca tem de dissipar. ' + esc(FA.balanceamento) + '.</p>' +
                  X.ladosBalanceamentoAr(r, x.i, cri, true) +
                h2('Vazamento, superfície e classe de vazamento' + suf) + secVazamento(r, cri)
              : h2('Ventilador, bocas críticas, balanceamento e vazamento' + suf) + faltaRede(r)) +
          h2('Avisos dos dutos' + suf) + X.listaAvisosAr(r);
      }).join('') +
      (vazias.length && lista.length ? '<p class="nota">' + (vazias.length === 1 ? 'A rede de ar ' + esc(vazias[0]) + ' não tem trechos e fica' : 'As redes de ar ' + esc(vazias.join(', ')) + ' não têm trechos e ficam') + ' fora deste memorial.</p>' : '');
  }
  // fontes dos dutos para a lista de referências, na ordem em que entram na conta
  function fontes(E, R) {
    var lista = redes(E, R), L = [FA.rho, 'Pressão pela altitude: ' + FA.altitude, FA.mu, FA.geo, FA.vReal, FA.atrito];
    if (lista.some(function (x) { return x.r.trechos.some(function (t) { return !t.semId && t.forma === 'flexivel'; }); })) { L.push(FA.flex, FA.fab); }

    L.push(FA.cl);
    if (lista.some(function (x) { return X.temVazamentoLadosAr(x.r); })) { L.push(FA.notaC, FA.ensaio); }
    L.push(FA.semFlex, 'Umidade absoluta do recinto: ' + FA.w, 'Calor específico do ar úmido. ' + FA.cp);
    dados(E, R).forEach(function (d) { if (!d.alterado && d.selo !== 'informado' && d.fonte !== 'Padrão do app' && d.fonte !== 'Premissa do app') { L.push(d.fonte); } });
    tabelas(E, R).forEach(function (d) { L.push(d.fonte); });
    return L;
  }

  X.memAr = { redes: redes, motivoRede: motivoRede, dados: dados, tabelas: tabelas, emitir: emitir, secoes: secoes, fontes: fontes };
})(window.HVAC);

<script>
/* ==== js/interface/memorial.js ==== */
/* Redes HVAC. Tela Memorial (especificação A0, seção 4, e ESPECIFICACAO_memorial_dutos, sessão R3): o cartão "antes de
   emitir" e a folha para imprimir, em paisagem, com identificação, unidades atendidas, a parte da água gelada (método e
   equações, premissas, trechos, conexões, equipamentos, bomba, balanceamento, avisos), a parte dos dutos de ar
   (memorial_ar.js) e as referências. Só monta HTML a partir do projeto e do resultado do motor; as tabelas de resultado são
   as de resultados.js. O módulo sem nenhum trecho fica fora do projeto: não gera erro nem entra na folha (M1).
   A folha é branca nos dois temas: nada dentro dela usa cor do tema (app.css repete as cores claras dentro de .folha).
   Com erro de dados a folha sai marcada como incompleta, sem a máquina, o crítico nem o balanceamento do módulo com erro. */
(function (H) {
  'use strict';
  var f = H.util.fmt, esc = f.esc, C = H.ui.c, M = H.motor, TAB = H.dados.tab, CAT = H.dados.campos, T = H.ui.telas, X = H.ui.redes;
  var ROT = { norma: 'norma', conferir: 'CONFERIR', premissa: 'premissa', informado: 'informado' };
  var GRUPOS = [['sistema', 'Sistema'], ['fluido', 'Fluido'], ['criterios', 'Critérios'], ['bomba', 'Bomba']];
  var F_RE = 'ASHRAE Fundamentals 2021 (SI), cap. 3, p. 3.7 (PDF 56)';
  var F_EROSAO = 'NBR 16401-1:2024, 12.1.4 (p. 32, PDF 42), Tabela 4 (p. 33, PDF 43)';
  var P_D23 = 'Premissa do app: todo o excesso de pressão do terminal é dissipado no balanceamento do próprio terminal';
  var P_D26 = 'Premissa do app: a margem da bomba é suposta retirada na bomba, e não no balanceamento dos terminais';

  function n(v, casas) { return f.num(v, casas); }
  // módulos que fazem parte do projeto (M1): o que não tem nenhum trecho fica fora, sem erro
  function modulos(E, R) {
    var ar = X.soAgua ? [] : X.memAr.redes(E, R);   // app só de água gelada: sem dutos
    return { agua: R.contagem.trechos > 0, ar: ar.length > 0, redesAr: ar };
  }
  function numero(v) { return typeof v === 'number' && isFinite(v); }
  function tabela() { return X.tabelaLeitura.apply(null, arguments); }
  // selo dentro da folha: só texto e contorno, igual nos dois temas e no papel
  function seloF(s) { return '<span class="selo-f ' + s + '">' + ROT[s] + '</span>'; }
  function seloDe(fonte) { return fonte ? seloF(TAB.selo(fonte)) : ''; }

  // ------------------------------------------------------------ dados em uso (padrões, fontes e alterações)
  function textoValor(def, v) {
    var i;
    if (v === null || v === undefined || v === '') { return '—'; }
    if (def.ops) { for (i = 0; i < def.ops.length; i++) { if (def.ops[i].v === v) { return def.ops[i].t; } } return String(v); }
    if (typeof v !== 'number') { return String(v); }
    return f.num(v * (def.pct ? 100 : 1), def.casas) + (def.un ? ' ' + def.un : '');
  }
  // o campo vale para este projeto? (concentração só com glicol; temperatura manual só com a base manual)
  function vale(g, k, E) {
    var fl = E.projeto.fluido;
    if (g === 'fluido' && k === 'concentracao') { return fl.tipo !== 'agua'; }
    if (g === 'fluido' && k === 'tManual') { return fl.baseT === 'manual'; }
    // bomba existente (AG13): os dados só valem quando informados; a tolerância, só com a vazão nominal
    if (g === 'bomba' && (k === 'qNominal' || k === 'hDisp')) { return E.projeto.bomba[k] !== null; }
    if (g === 'bomba' && k === 'tolVazaoBomba') { return E.projeto.bomba.qNominal !== null; }
    return true;
  }
  // um item por campo dos grupos do projeto: { grupo, rotulo, valor, padrao, alterado, fonte, selo }
  function dadosDoProjeto(E) {
    var L = [];
    GRUPOS.forEach(function (g) {
      var k, def, v, alt;
      for (k in CAT[g[0]]) {
        def = CAT[g[0]][k]; v = E.projeto[g[0]][k];
        if (!vale(g[0], k, E)) { continue; }
        alt = def.p !== null && v !== def.p;
        L.push({ grupo: g[1], rotulo: def.rotulo, valor: textoValor(def, v), padrao: def.p === null ? '' : textoValor(def, def.p), alterado: alt,
                 fonte: alt ? 'Valor informado pelo projetista' : (def.fonte || (def.p === null ? 'Dado do projeto' : 'Padrão do app')),
                 selo: alt || def.p === null ? 'informado' : (def.fonte ? TAB.selo(def.fonte) : 'premissa') });
      }
    });
    return L;
  }
  function junta(mapa, ordem, chave, item, id) {
    if (!mapa[chave]) { mapa[chave] = item; item.trechos = []; ordem.push(chave); }
    if (id && mapa[chave].trechos.indexOf(id) < 0) { mapa[chave].trechos.push(id); }
  }
  function nosTrechos(ids) { return ids.length ? ' (' + (ids.length === 1 ? 'trecho ' : 'trechos ') + ids.join(', ') + ')' : ''; }
  // redução ou ampliação em trecho de ida e volta: na volta conta a peça contrária do mesmo par (D32)
  function voltaComPar(c, R) {
    var t = R.trechos[c.indiceTrecho];
    return !!t && t.idaVolta !== null && t.idaVolta > 1 && c.parNaVolta && c.kTotalVolta !== null;
  }
  // dados das tabelas do app que entram na conta deste projeto: { texto, fonte, selo }
  function dadosDasTabelas(E, R) {
    var pr = R.premissas, mapa = Object.create(null), ordem = [], L = [];
    if (pr.ok && pr.fluido.fonte) { L.push({ texto: 'Propriedades do fluido (' + X.nomeFluido(E.projeto.fluido) + ')', fonte: pr.fluido.fonte }); }

<script>

/* Redes HVAC. Tela Referências: todas as linhas das tabelas de dados do app (H.dados.bruto), com a fonte inteira e o selo de cada linha.

  }

  var BLOCOS = [
    { id: 'ref-tubos', n: 1, titulo: 'Tubos', frase: 'Dimensões dos tubos por especificação e DN, e a rugosidade de cada especificação.',

                 { t: 'Di mm', num: true, v: function (l, i) { var t = TAB.tubos[i]; return t ? nt(parseFloat(t.di.toFixed(4))) : '—'; } }] },
        { chave: 'especificacoes', titulo: 'Especificações de tubo e rugosidade', fonte: function (l) { return l.fonte_eps; },

    { id: 'ref-fluidos', n: 2, titulo: 'Fluidos', frase: 'Propriedades da água e dos glicóis por temperatura e concentração, e a temperatura de congelamento.',
      tabs: [

      tabs: [

      ] }

  function linhasDe(t) { return t.dado ? t.dado() : lista(t.chave); }
  // fonte por linha para a contagem; tabelas "t3" e "t4" têm a fonte da tabela inteira
  function fonteContagem(t) { return t.fonteTab ? t.fonteTab : t.fonte; }

  function contagemBloco(b) {
    var c = { total: 0 };
    b.tabs.forEach(function (t) {
      var fn = fonteContagem(t);
      if (fn) { c = soma(c, contar(linhasDe(t), t.fonteTab ? function () { return t.fonteTab(); } : fn)); } else { c.total += linhasDe(t).length; }
    });
    return c;
  }

  function corpoBloco(b) {
    return b.tabs.map(function (t) {
      var linhas = linhasDe(t);

        // fonte única da tabela: contagem e selo vêm da linha acima da tabela
        var fo = t.fonteTab(), c = contar(linhas, function () { return fo; });
        var h = '<th class="num">' + esc(t.cols[0].t) + '</th>' + t.cols.slice(1).map(function (k) { return '<th class="num">' + esc(k.t) + '</th>'; }).join('');
        var tr = linhas.map(function (l) {
          return '<tr data-ref="' + t.chave + '">' + t.cols.map(function (k) { return '<td class="num">' + esc(k.v(l)) + '</td>'; }).join('') + '</tr>';
        }).join('');
        return '<h3 class="ref-tit">' + esc(t.titulo) + '</h3><div class="fraco">' + esc(textoContagem(c)) + '</div>' +
          '<div class="ref-fonte-tab"><span>Fonte da tabela inteira: ' + esc(fo) + '</span> ' + sel(fo) + '</div>' +
          '<div class="tabela-rolo"><table class="ref-tab"><thead><tr>' + h + '</tr></thead><tbody>' + tr + '</tbody></table></div>';
      }
      return tabela(t.chave, t.titulo, linhas, t.cols, t.fonte);
    }).join('');
  }

  T.referencias = function (E, U, R) {
    var html = C.cabeca('Dados do app', 'Referências',
      'As tabelas que o app usa nas contas, linha por linha, com a fonte de cada valor. O selo diz de onde o valor vem: norma (norma ou handbook da biblioteca, conferido), CONFERIR (sem documento-fonte conferido) e premissa (escolha declarada).');
    // app só de dutos: os blocos dos dutos de ar e as cláusulas, renumerados
    // app só de água gelada (AG6): só os blocos 1 a 6 (a numeração já é a de origem)
    var lista = X.soDutos ? BLOCOS.filter(function (b) { return b.id.indexOf('ref-ar-') === 0; }).concat(BLOCOS.filter(function (b) { return b.id === 'ref-clausulas'; }))
      : (X.soAgua ? BLOCOS.filter(function (b) { return b.id.indexOf('ref-ar-') !== 0; }) : BLOCOS);
    lista.forEach(function (b, j) {
      var c = contagemBloco(b);
      var frase = b.frase + ' ' + textoContagem(c) + '.';
      html += C.bloco(b.id, X.soDutos || X.soAgua ? j + 1 : b.n, b.titulo, frase, c.total, 'linhas', function () { return corpoBloco(b); });
    });
    html += '<div class="acoes"><a class="botao" href="#/inicio">Voltar ao Início</a><a class="botao" href="#/memorial">Abrir o memorial</a></div>';
    return html;
  };
})(window.HVAC);

<script>
/* ==== js/interface/app.js ==== */
/* Redes HVAC. Manifesto do app para a casca da plataforma (H.app) e o adaptador da tela para a entrada do motor:
   rotas, trilha, faixa de resumo, arquivo de projeto, validação pelo catálogo de campos, ajustes em cadeia depois de cada
   alteração e as ações das tabelas (novo, duplicar, mover e excluir). O projeto da tela (E.projeto) é a própria entrada do
   motor (M.agua.calcular): a tela não guarda nada além dele. Carrega por último, antes de H.ui.iniciar(). */
(function (H) {
  'use strict';
  var f = H.util.fmt, M = H.motor, TAB = H.dados.tab, CAT = H.dados.campos, T = H.ui.telas, U = H.ui.U, K = H.ui.api;
  var X = H.ui.redes;

  function numero(v) { return typeof v === 'number' && isFinite(v); }
  function chave(id) { return M.rede.chave(id); }

  // ------------------------------------------------------------ cálculo (memorizado pelo texto do projeto)
  var memo = { k: null, R: null };
  function calcular(E) {
    var k = JSON.stringify(E.projeto);
    // os dutos de ar vão junto, em R.dutos: as telas recebem um resultado só
    if (k !== memo.k) { memo = { k: k, R: M.agua.calcular(E.projeto) }; memo.R.dutos = M.dutos.calcular(E.projeto); }
    return memo.R;
  }
  X.calcular = calcular;
  // app só de dutos (sessão DU1): manifesto próprio, montado no fim deste arquivo
  var DUTOS = X.soDutos;
  // app só de água gelada (sessão AG1): manifesto próprio, montado no fim deste arquivo
  var AGUA = X.soAgua;
  // telas em que a faixa e a variação são as dos dutos de ar (Resultados: a do módulo escolhido; no app só de dutos, todas)
  function noAr() { return !AGUA && (DUTOS || U.tela === 'dutos' || U.tela === 'duto' || (U.tela === 'resultados' && U.modulo === 'ar')); }
  // O número cuja variação a faixa mostra: a altura manométrica; nas telas dos dutos, a pressão total do ventilador da rede
  // escolhida. Sem resultado válido devolve NaN, e a faixa não mostra variação.
  function medida(E) {
    var R = calcular(E), x;
    if (noAr()) { x = X.redeAr(E, R); return x && X.validoAr(x.r) && numero(x.r.ventilador.pTotal) ? x.r.ventilador.pTotal : NaN; }
    return X.valido(R) && numero(R.bomba.h) ? R.bomba.h : NaN;
  }

  // ------------------------------------------------------------ faixa de resumo
  function faixaAr(E, R, U) {
    var x = X.redeAr(E, R), r = x ? x.r : null, ok = X.validoAr(r), V = r ? r.ventilador : {}, d = U.delta, delta = '';
    var li = r ? r.lados.insuflamento : null, lr = r ? r.lados.retorno : null;
    function boca(ld) { return ld && ld.bocaCritica ? ld.bocaCritica + ' (' + f.num(ld.dpCritico, 2) + ' Pa)' : '—'; }
    if (ok && numero(d) && Math.abs(d) >= 0.005) { delta = (d > 0 ? '+' : '−') + f.num(Math.abs(d), 2) + ' Pa na pressão total'; }
    return {
      itens: [
        { rotulo: 'Vazão do ventilador', valor: ok && numero(V.q) ? f.num(V.q * 3600, 1) + ' m³/h' : '—' },
        { rotulo: 'Pressão total', valor: ok && numero(V.pTotal) ? f.num(V.pTotal, 2) + ' Pa' : '—' },
        { rotulo: 'Bocas críticas (insuflamento · retorno)', valor: ok ? boca(li) + ' · ' + boca(lr) : '—', sec: true },
        { rotulo: 'Situação' + (r ? ' · rede ' + (r.id || '(sem ID)') : ''), valor: X.textoSituacaoAr(r) }
      ],
      delta: delta,
      link: U.tela === 'dutos' ? null : { href: '#/dutos', texto: 'Ver os dutos' }
    };
  }
  function faixa(E, R, U) {
    if (noAr()) { return faixaAr(E, R, U); }
    var ok = X.valido(R), b = R.bomba, d = U.delta, delta = '';
    if (ok && numero(d) && Math.abs(d) >= 0.0005) { delta = (d > 0 ? '+' : '−') + f.num(Math.abs(d), 3) + ' mca na altura manométrica'; }
    return {
      itens: [
        { rotulo: 'Vazão da bomba', valor: ok ? f.num(b.q, 3) + ' m³/h' : '—' },
        { rotulo: 'Altura manométrica', valor: ok ? f.num(b.h, 3) + ' mca' : '—' },
        { rotulo: 'ΔP do circuito crítico', valor: ok ? f.num(b.dpCritico, 3) + ' kPa · ' + b.terminalCritico : '—', sec: true },
        { rotulo: 'Situação', valor: X.textoSituacao(R) }
      ],
      delta: delta,
      link: U.tela === 'rede' ? null : { href: '#/rede', texto: 'Ver a rede' }
    };
  }

  // ------------------------------------------------------------ validação e ajustes de uma alteração
  // objeto que guarda a chave final de um caminho "projeto.a.b.c", a partir do objeto projeto
  function ponta(projeto, ps) {
    var o = projeto, i;
    for (i = 1; i < ps.length - 1; i++) { o = (o === null || o === undefined) ? undefined : o[ps[i]]; }
    return o;
  }
  // limites do catálogo, para os campos numéricos que a casca lê (o valor chega como foi digitado: em % nos campos de percentual)
  function validar(caminho, v) {
    var def = CAT.de(caminho);
    return def && def.t === 'num' ? CAT.erro(def, def.pct ? v / 100 : v) : '';
  }
  function ajustar(caminho, v) {
    var def = CAT.de(caminho);
    return def && def.pct ? v / 100 : v;
  }
  function trechoDe(P, id) {
    var k = chave(id), i;
    if (k === '') { return null; }
    for (i = 0; i < P.agua.trechos.length; i++) { if (chave(P.agua.trechos[i].id) === k) { return P.agua.trechos[i]; } }
    return null;
  }
  function familiaDe(P, id) {
    var t = trechoDe(P, id), e = t ? TAB.espec(t.especificacao) : null;
    return e ? e.fam : '';
  }
  // concentrações com dados para o fluido escolhido
  function concentracoes(tipo) {
    var nome = M.fluido.nome(tipo);
    return TAB.listaFluidos.filter(function (x) { return x.fluido === nome; }).map(function (x) { return x.conc; });
  }

  /* Depois de cada alteração de campo (a casca já gravou o valor e entrega o valor anterior). Aqui ficam: o texto que é número
     (seletores), os espaços do ID e do montante, e os campos que dependem do que mudou. */
  function aoAlterar(caminho, E, anterior) {
    var def = CAT.de(caminho);
    if (!def) { return; }
    var P = E.projeto, ps = caminho.split('.'), k = ps[ps.length - 1], o = ponta(P, ps), id = X.id(caminho);
    var vAntes = anterior === undefined ? def.p : anterior;
    if (!o) { return; }
    var v = o[k];

    if (def.t === 'txt' && def.apara && typeof v === 'string') { o[k] = v = v.trim(); }
    if (def.t === 'num' && typeof v === 'string') {
      var s = v.trim(), x, erro = '';
      if (s === '') {
        if (def.nulo) { v = null; } else if (def.p !== null) { v = def.p; } else { erro = 'Preencha este campo.'; }   // vazio volta ao padrão
      } else {
        x = f.ler(s);
        if (isNaN(x)) { erro = 'Digite um número (use vírgula para decimais).'; }
        else { erro = CAT.erro(def, x); v = x; }
      }
      if (erro) { o[k] = v = vAntes; U.erros[id] = erro; } else { o[k] = v; delete U.erros[id]; }
    }
    // campo com padrão não fica vazio: vazio volta ao padrão
    if (def.t === 'num' && v === null && def.p !== null) { o[k] = v = def.p; }

    if (ps[1] === 'fluido') {
      var fl = P.fluido, cs;
      if (k === 'tipo') {
        cs = concentracoes(fl.tipo);
        if (fl.tipo === 'agua') { fl.concentracao = 0; }
        else if (cs.indexOf(fl.concentracao) < 0 && cs.length) { fl.concentracao = cs[0]; }
      }
      // a base manual exige a temperatura (no motor, vazio valeria 0 °C)
      if (fl.baseT === 'manual' && fl.tManual === null) {
        if (k === 'tManual') { fl.tManual = numero(vAntes) ? vAntes : fl.tAlim; U.erros[id] = 'Com a base manual a temperatura é obrigatória.'; }
        else { fl.tManual = fl.tAlim; }
      }
    }
    if (ps[2] === 'trechos') {
      var t = o, ag = P.agua;
      if (k === 'id' && typeof vAntes === 'string') {
        var ka = chave(vAntes), kn = chave(t.id), usados = 0, livre = true;
        ag.trechos.forEach(function (y) { if (y !== t && chave(y.id) === ka) { usados++; } if (y !== t && chave(y.id) === kn) { livre = false; } });
        // o ID mudou de nome: quem apontava para ele acompanha (só se o nome antigo era de um trecho só e o novo está livre)
        if (ka !== '' && kn !== '' && ka !== kn && usados === 0 && livre) {
          ag.trechos.forEach(function (y) { if (chave(y.montante) === ka) { y.montante = t.id; } });
          ag.conexoes.forEach(function (y) { if (chave(y.trecho) === ka) { y.trecho = t.id; } });
          ag.equipamentos.forEach(function (y) { if (chave(y.trecho) === ka) { y.trecho = t.id; } });
        }
      }
      // DN que não existe na especificação nova: fica vazio, para ser escolhido de novo
      if (k === 'especificacao' && t.dn !== '' && !TAB.tubo(t.especificacao, t.dn)) { t.dn = ''; }
    }
    if (ps[2] === 'conexoes' && k === 'uniao') {
      if (o.item !== '' && !TAB.item(familiaDe(P, o.trecho), o.uniao, o.item)) { o.item = ''; }
    }
    // cadastro de unidades: o ID que muda de nome leva junto quem aponta para ele; o calor sensível editado à mão perde a origem
    if (ps[1] === 'unidades') {
      if (k === 'id' && typeof vAntes === 'string') {
        var ua = chave(vAntes), un = chave(o.id), outrasU = 0, livreU = true;
        P.unidades.forEach(function (y) { if (y !== o && chave(y.id) === ua) { outrasU++; } if (y !== o && chave(y.id) === un) { livreU = false; } });
        if (ua !== '' && un !== '' && ua !== un && outrasU === 0 && livreU) {
          P.ar.redes.forEach(function (y) { if (chave(y.unidade) === ua) { y.unidade = o.id; } });
          P.agua.trechos.forEach(function (y) { if (chave(y.unidade) === ua) { y.unidade = o.id; } });
        }
      }
      if (k === 'calorSensivelW' && v !== vAntes && o.origemArquivo !== '') { o.origemArquivo = ''; o.origemItem = ''; o.origemData = ''; }
    }
    // dutos de ar: o ID do trecho que muda de nome leva junto o montante, as singularidades e os componentes da rede dele
    if (ps[1] === 'ar' && ps[2] === 'redes' && ps.length === 7) {
